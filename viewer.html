<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#000000"><title>画像ビューア</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}.viewer{position:relative;width:100%;height:100dvh;min-height:100%;display:grid;place-items:center;overflow:hidden;background:#000;user-select:none;touch-action:pan-y;cursor:pointer}.image-frame{position:relative;display:inline-block;max-width:100%;max-height:100%;line-height:0}.image-frame img{display:block;max-width:100vw;max-height:100dvh;width:auto;height:auto;object-fit:contain;object-position:center;opacity:1;transition:opacity .22s ease}.counter{position:absolute;right:12px;bottom:12px;padding:6px 10px;border-radius:999px;background:rgba(0,0,0,.62);color:#fff;font:13px/1 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;pointer-events:none;transition:opacity .25s ease}.bottom-bar{position:fixed;left:50%;bottom:max(16px,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;align-items:center;gap:18px;z-index:10;transition:opacity .25s ease}.bottom-bar button{border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:9px 14px;min-width:84px;background:rgba(0,0,0,.62);color:#fff;font:600 13px/1 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:7px}.icon-play{width:0;height:0;border-top:6px solid transparent;border-bottom:6px solid transparent;border-left:9px solid currentColor}.icon-pause{position:relative;width:10px;height:12px}.icon-pause::before,.icon-pause::after{content:"";position:absolute;top:0;width:3px;height:12px;border-radius:1px;background:currentColor}.icon-pause::before{left:0}.icon-pause::after{right:0}.bottom-counter{min-width:56px;text-align:center;color:#fff;font:600 16px/1 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.counter{display:none}.ui-hidden .bottom-bar{opacity:0;pointer-events:none}</style></head><body><div id="viewer" class="viewer" tabindex="0"><div class="image-frame"><img id="image" alt=""><div id="counter" class="counter">1 / 1</div></div></div><div id="bookControls" class="bottom-bar"><button id="backBtn" type="button">← 戻る</button><button id="autoBtn" type="button"><span class="icon-play" aria-hidden="true"></span><span>自動</span></button><div id="pageInfo" class="bottom-counter">1 / 1</div><button id="muteBtn" type="button">音 ON</button><button id="fullBtn" type="button">全画面</button></div><script>(()=>{const images=[{"name":"IMG_0222.jpeg","data":"images/page01.jpg"},{"name":"IMG_0223.jpeg","data":"images/page02.jpg","se":"sounds/se_page02.mp3","seVolume":0.1},{"name":"IMG_0224.jpeg","data":"images/page03.jpg","se":"sounds/se_page03.mp3","seVolume":0.15},{"name":"IMG_0225.jpeg","data":"images/page04.jpg","se":"sounds/se_page04.mp3","seVolume":0.06},{"name":"IMG_0270.jpeg","data":"images/page05.jpg","se":"sounds/se_page05.mp3","seVolume":0.06},{"name":"IMG_0227.jpeg","data":"images/page06.jpg","se":"sounds/se_page06.mp3","seVolume":0.1},{"name":"IMG_0228.jpeg","data":"images/page07.jpg","se":"sounds/se_page07.mp3","seVolume":0.05},{"name":"IMG_0229.jpeg","data":"images/page08.jpg","se":"sounds/se_page08.mp3","seVolume":0.06},{"name":"IMG_0230.jpeg","data":"images/page09.jpg","se":"sounds/se_page09.mp3","seVolume":0.06},{"name":"IMG_0257.jpeg","data":"images/page10.jpg","se":"sounds/se_page10.mp3","seVolume":0.06},{"name":"IMG_0232.jpeg","data":"images/page11.jpg","se":"sounds/se_page11.mp3","seVolume":0.06},{"name":"IMG_0233.jpeg","data":"images/page12.jpg","se":"sounds/se_page12.mp3","seVolume":0.06},{"name":"IMG_0234.jpeg","data":"images/page13.jpg","se":"sounds/se_page13.mp3","seVolume":0.06},{"name":"IMG_0235.jpeg","data":"images/page14.jpg","se":"sounds/se_page14.mp3","seVolume":0.06},{"name":"IMG_0262.jpeg","data":"images/page15.jpg","se":"sounds/se_page15.mp3","seVolume":0.06},{"name":"IMG_0237.jpeg","data":"images/page16.jpg","se":"sounds/se_page16.mp3","seVolume":0.1},{"name":"IMG_0264.jpeg","data":"images/page17.jpg","se":"sounds/se_page17.mp3","seVolume":0.05},{"name":"IMG_0265.jpeg","data":"images/page18.jpg"}],bgmTracks=[],viewer=document.getElementById('viewer'),image=document.getElementById('image'),counter=document.getElementById('counter'),pageInfo=document.getElementById('pageInfo'),autoBtn=document.getElementById('autoBtn'),fullBtn=document.getElementById('fullBtn'),backBtn=document.getElementById('backBtn'),muteBtn=document.getElementById('muteBtn'),flipAudio=new Audio("sounds/flip.mp3"),bgmAudio=new Audio(),seAudio=new Audio();flipAudio.preload='auto';flipAudio.volume=0.1;bgmAudio.loop=true;let index=0,startX=0,startY=0,swiped=false,autoTimer=null,uiTimer=null,changing=false,muted=false,currentBgmData=null,started=false;function currentBgmFor(pageNum){let cur=null;for(const t of bgmTracks){if(t.fromPage<=pageNum)cur=t;}return cur}function updateBgm(){const t=currentBgmFor(index+1);const data=t?t.data:null;if(data===currentBgmData)return;currentBgmData=data;if(!data){bgmAudio.pause();bgmAudio.removeAttribute('src');return}bgmAudio.src=data;bgmAudio.volume=(t&&typeof t.volume==='number')?t.volume:.4;if(!muted){bgmAudio.play().catch(()=>{})}}function playSe(){seAudio.pause();seAudio.currentTime=0;const cur=images[index];const se=cur&&cur.se;if(!se||muted)return;try{seAudio.src=se;seAudio.volume=(typeof cur.seVolume==='number')?cur.seVolume:.7;seAudio.play().catch(()=>{})}catch(e){}}function primeAudio(){if(started)return;started=true;updateBgm()}function playFlip(){if(muted)return;try{flipAudio.pause();flipAudio.currentTime=0;flipAudio.play().catch(()=>{})}catch(e){}}function showUI(){document.body.classList.remove('ui-hidden');clearTimeout(uiTimer);uiTimer=setTimeout(()=>document.body.classList.add('ui-hidden'),1800)}function stopAuto(){if(autoTimer){clearInterval(autoTimer);autoTimer=null}autoBtn.innerHTML='<span class="icon-play" aria-hidden="true"></span><span>自動</span>'}function render(initial=false){index=(index+images.length)%images.length;if(initial){image.src=images[index].data;image.alt=images[index].name||('画像 '+(index+1));counter.textContent=(index+1)+' / '+images.length;pageInfo.textContent=counter.textContent;updateBgm();playSe();return}changing=true;image.style.opacity='0';setTimeout(()=>{image.src=images[index].data;image.alt=images[index].name||('画像 '+(index+1));counter.textContent=(index+1)+' / '+images.length;pageInfo.textContent=counter.textContent;updateBgm();playSe();requestAnimationFrame(()=>{image.style.opacity='1';changing=false})},80)}function move(n,fromAuto=false){if(changing)return;if(fromAuto&&index>=images.length-1){stopAuto();showUI();return}index=(index+n+images.length)%images.length;playFlip();render()}function toggleAuto(){if(autoTimer){stopAuto()}else{if(index>=images.length-1)index=-1;autoBtn.innerHTML='<span class="icon-pause" aria-hidden="true"></span><span>停止</span>';autoTimer=setInterval(()=>move(1,true),3000)}showUI()}function toggleFull(){if(!document.fullscreenElement){document.documentElement.requestFullscreen?.().catch(()=>{})}else{document.exitFullscreen?.().catch(()=>{})}showUI()}viewer.addEventListener('click',e=>{primeAudio();showUI();if(swiped){swiped=false;return}const r=viewer.getBoundingClientRect();move(e.clientX-r.left<r.width/2?-1:1)});viewer.addEventListener('touchstart',e=>{showUI();const t=e.changedTouches[0];startX=t.clientX;startY=t.clientY;swiped=false},{passive:true});viewer.addEventListener('touchend',e=>{const t=e.changedTouches[0],dx=t.clientX-startX,dy=t.clientY-startY;if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)){swiped=true;move(dx<0?1:-1)}},{passive:true});viewer.addEventListener('keydown',e=>{showUI();if(e.key==='ArrowRight'||e.key==='Enter'||e.key===' '){e.preventDefault();move(1)}else if(e.key==='ArrowLeft'){e.preventDefault();move(-1)}});autoBtn.addEventListener('click',e=>{e.stopPropagation();toggleAuto()});fullBtn.addEventListener('click',e=>{e.stopPropagation();toggleFull()});backBtn.addEventListener('click',e=>{e.stopPropagation();history.back()});muteBtn.addEventListener('click',e=>{e.stopPropagation();muted=!muted;muteBtn.textContent=muted?'音 OFF':'音 ON';if(muted){bgmAudio.pause()}else{primeAudio();if(currentBgmData)bgmAudio.play().catch(()=>{})}});document.addEventListener('fullscreenchange',()=>{fullBtn.textContent=document.fullscreenElement?'全画面終了':'全画面';showUI()});document.addEventListener('mousemove',showUI,{passive:true});render(true);showUI();viewer.focus()})();</script></body></html>
