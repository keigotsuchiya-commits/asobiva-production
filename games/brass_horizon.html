#game{position:absolute;image-rendering:pixelated;image-rendering:crisp-edges;display:block}
#dpad,#fire{position:absolute;display:none;pointer-events:none}
#back{position:absolute;display:none;margin:0;padding:0;width:64px;height:30px;border-radius:7px;border:1px solid #9AA0B0;background:#2E3038;color:#E4E8F0;font:500 15px "Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif;line-height:28px;cursor:pointer}
#back:focus-visible{outline:2px solid #E8C26A;outline-offset:2px}
#fit{position:fixed;left:0;top:0;width:0;height:0;visibility:hidden;pointer-events:none;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
</style>

<body>
<canvas id="game" width="480" height="360"></canvas>
<canvas id="dpad"></canvas>
<canvas id="fire"></canvas>
<button type="button" id="back" aria-label="戻る">‹ 戻る</button>
<div id="fit"></div>
<script>
(()=>{
'use strict';
// ===== 定数 =====
const GW=480,GH=360,AS=2,AW=240,AH=180,G_ART=160,GROUND_Y=G_ART*AS;
const OCN='#201830';
const M=12,GAP=8,COLMIN=100,DP=75,FB=45,BW=64,BH=30,CARD_W=720,CARD_COL=120;
const IN_CARD=(()=>{try{return window.self!==window.top}catch(e){return true}})();
const IS_TOUCH=matchMedia('(hover: none) and (pointer: coarse)').matches;
const cv=document.getElementById('game'),ctx=cv.getContext('2d');ctx.imageSmoothingEnabled=false;
const dpadCv=document.getElementById('dpad'),fireCv=document.getElementById('fire'),backBtn=document.getElementById('back');

// ===== 絵を描く道具（絵の単位＝1px） =====
function makeArt(w,h,fn){
  const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');
  const R=(a,b,ww,hh,col)=>{x.fillStyle=col;x.fillRect(a,b,ww,hh)};
  const D=(cx,cy,r,col)=>{x.fillStyle=col;for(let y=-r;y<=r;y++){const ww=Math.floor(Math.sqrt(r*r-y*y));x.fillRect(cx-ww,cy+y,ww*2+1,1)}};
  const OL=(px,oc)=>{const set=new Set(px.map(([a,b])=>a+','+b));px.forEach(([a,b])=>[[1,0],[-1,0],[0,1],[0,-1]].forEach(([dx,dy])=>{if(!set.has((a+dx)+','+(b+dy)))R(a+dx,b+dy,1,1,oc)}));px.forEach(([a,b,col])=>R(a,b,1,1,col))};
  const grid=new Map(),put=(a,y,col)=>grid.set(a+','+y,[a,y,col]),flush=()=>{const px=[...grid.values()];grid.clear();OL(px,OCN)};
  const inPoly=(x0,y0,P)=>{let c2=false;for(let i=0,j=P.length-1;i<P.length;j=i++){const[xi,yi]=P[i],[xj,yj]=P[j];if(((yi>y0)!=(yj>y0))&&(x0<(xj-xi)*(y0-yi)/(yj-yi)+xi))c2=!c2}return c2};
  const poly=(ox,oy,P,f)=>{const xs=P.map(p=>p[0]),ys=P.map(p=>p[1]);for(let y=Math.min(...ys);y<=Math.max(...ys);y++)for(let a=Math.min(...xs);a<=Math.max(...xs);a++)if(inPoly(a+0.5,y+0.5,P))put(ox+a,oy+y,f(a,y))};
  const disk=(ox,oy,cx,cy,r,f)=>{for(let y=-r;y<=r;y++)for(let a=-r;a<=r;a++)if(a*a+y*y<=r*r+r*0.6)put(ox+cx+a,oy+cy+y,f(cx+a,cy+y))};
  const S=(rows,ox,oy,map)=>rows.forEach((row,j)=>[...row].forEach((ch,i)=>{if(ch!=='.'){x.fillStyle=map[ch];x.fillRect(ox+i,oy+j,1,1)}}));
  fn({x,R,D,OL,put,flush,poly,disk,S});return c;
}
const P={k:'#201830',W:'#F8F8FF',R:'#E83838',B:'#F8A848',b:'#C06828',n:'#803818',y:'#F8E040',I:'#FFD040',i:'#D88010'};
const BIRD=["....kk......kk..","...kBBk....kBBk.","..kBBbbk..kbBBk.","..kBbbbbkkbbbBk.",".kykWBBBBBBBbbk.","kyykBBBBBBBBBk..",".kkbbBBBBBBbbbk.","...kbbbbbbbbnnk.","....kkbnkknbk...","......kk..kk...."];
const ITEM=["..kkkkkk..",".kIIIIIIk.","kIWWIIIIik","kIWIIRRIik","kIIIRIIRik","kIIIRRRIik","kIIIRIIIik","kiIIRIIiik",".kiiiiiik.","..kkkkkk.."];

// --- 自機（銅色の飛行船） 40×27 ---
const SHIP=makeArt(40,27,({R})=>{
  const W=40,H=27,g=[],solid=[];for(let y=0;y<H;y++){g.push(Array(W).fill(null));solid.push(Array(W).fill(false))}
  const put=(a,b,c,so=true)=>{if(a>=0&&a<W&&b>=0&&b<H){g[b][a]=c;solid[b][a]=so}};
  const cy=11,x0=6,L=28;
  for(let u=0;u<=L;u++){let hh;if(u<3)hh=[4,6,7][u];else if(u<=18)hh=7;else hh=Math.max(1,Math.round(7*Math.pow(1-(u-18)/(L-17),0.75)));const xx=x0+u;
    for(let y=cy-hh;y<=cy+hh;y++){const r=(y-(cy-hh))/(2*hh||1);let c=r<0.22?'#E8A060':r<0.62?'#C06828':'#8C4418';if(((xx*7+y*13)%23)===0&&r>0.3)c='#6C3010';put(xx,y,c)}
    if([4,9,14,19].includes(u)){for(let y=cy-hh;y<=cy+hh;y++){const r=(y-(cy-hh))/(2*hh);put(xx,y,r<0.5?'#E0BC78':'#9C7838')}put(xx,cy-hh+1,'#FFE8B0');put(xx,cy,'#FFE8B0');put(xx,cy+hh-1,'#FFE8B0')}}
  put(x0+L+1,cy,'#A0A0B0');put(x0+L+2,cy,'#E0E0F0');
  put(x0+24,cy-1,'#70E8F8');put(x0+24,cy,'#2890C8');put(x0+23,cy-1,'#2890C8');put(x0+23,cy,'#205878');
  for(let y=cy-6;y<=cy+6;y++)put(x0-1,y,y<cy?'#E0BC78':'#9C7838');
  for(let y=cy-2;y<=cy+2;y++)put(x0-2,y,'#7C7C8C');put(x0-3,cy,'#7C7C8C');
  for(let y=cy-6;y<=cy+6;y++){if(y!==cy)put(x0-4,y,Math.abs(y-cy)%2?'#E0E0F0':'#9898A8')}
  for(let a=x0+10;a<=x0+17;a++)for(let y=cy-10;y<=cy-8;y++)put(a,y,y===cy-10?'#B8B8C8':'#7C7C8C');
  put(x0+11,cy-9,'#F8D060');put(x0+14,cy-9,'#F8D060');
  for(let y=cy-13;y<=cy-11;y++)put(x0+12,y,'#6C6C7C');put(x0+12,cy-14,'#C8C8D8');
  for(let y=cy-12;y<=cy-8;y++)put(x0+20,y,'#9C7838');put(x0+19,cy-12,'#9C7838');
  const gy=cy+11;
  for(let k=1;k<=3;k++){put(x0+9+k,cy+7+k,'#5C4030',false);put(x0+19-k,cy+7+k,'#5C4030',false);put(x0+14,cy+7+k,'#5C4030',false)}
  for(let a=x0+10;a<=x0+18;a++)for(let y=gy;y<=gy+2;y++)put(a,y,y===gy?'#B87838':'#7C4420');
  [x0+11,x0+14,x0+17].forEach(a=>put(a,gy+1,'#70E8F8'));
  for(let a=x0+12;a<=x0+16;a++)put(a,gy+3,'#C06828');put(x0+14,gy+4,'#8C4418');
  const out=[];for(let y=0;y<H;y++)for(let a=0;a<W;a++){if(g[y][a])continue;const n=[[1,0],[-1,0],[0,1],[0,-1]].some(([dx,dy])=>{const yy=y+dy,xx=a+dx;return yy>=0&&yy<H&&xx>=0&&xx<W&&solid[yy][xx]});if(n)out.push([a,y])}
  out.forEach(([a,y])=>R(a,y,1,1,OCN));
  for(let y=0;y<H;y++)for(let a=0;a<W;a++)if(g[y][a])R(a,y,1,1,g[y][a]);
});
// --- 鳥 16×10、アイテム 10×10 ---
const BIRD_ART=makeArt(16,10,({S})=>S(BIRD,0,0,P));
const ITEM_ART=makeArt(10,10,({S})=>S(ITEM,0,0,P));
// --- 大きめの青い鳥 ---
const BB_OX=6,BB_OY=11;
const BLUEBIRD=makeArt(42,32,({R,put,flush,poly,disk})=>{
  const ox=BB_OX,oy=BB_OY;
  poly(ox,oy,[[14,4],[22,-8],[30,-10],[28,0],[24,6]],()=>'#3050A0');
  for(let y=2;y<=16;y++)for(let a=4;a<=26;a++)if(((a-15)/11)**2+((y-9)/7)**2<=1)put(ox+a,oy+y,y>11&&a<20?'#A8C8F0':'#4868C8');
  disk(ox,oy,6,6,5,()=>'#4868C8');
  poly(ox,oy,[[1,5],[-5,7],[1,9]],()=>'#F8C040');
  poly(ox,oy,[[25,7],[33,3],[34,10],[26,12]],()=>'#3050A0');
  [[12,17],[17,17]].forEach(([a,y])=>{put(ox+a,oy+y,'#F8C040');put(ox+a,oy+y+1,'#F8C040')});
  flush();R(ox+4,oy+4,2,2,'#FFFFFF');R(ox+4,oy+5,1,1,OCN);R(ox+3,oy+2,4,1,OCN);
});
// --- ボス：巨大な怪鳥 ---
const BO_OX=6,BO_OY=8;
function bossArt(flash){return makeArt(72,56,({R,put,flush,poly,disk})=>{
  const ox=BO_OX,oy=BO_OY,f=c=>flash?'#FFFFFF':c;
  poly(ox,oy,[[44,26],[58,18],[62,28],[58,38],[44,34]],(a,y)=>f(y%4===0?'#7C2840':'#9C3850'));
  for(let y=18;y<=42;y++)for(let a=13;a<=47;a++)if(((a-30)/17)**2+((y-30)/12)**2<=1)put(ox+a,oy+y,f((y>33&&a<38)?'#F0D0B0':'#C0506A'));
  disk(ox,oy,13,22,8,()=>f('#C0506A'));
  poly(ox,oy,[[7,15],[9,9],[12,14]],()=>f('#F8C040'));poly(ox,oy,[[11,14],[14,8],[16,14]],()=>f('#F8C040'));
  poly(ox,oy,[[6,20],[-4,23],[6,23]],()=>f('#F8C040'));poly(ox,oy,[[6,23],[-2,24],[6,26]],()=>f('#C88820'));
  poly(ox,oy,[[20,24],[30,6],[42,-6],[56,-4],[52,8],[46,18],[40,26]],(a,y)=>f((y%5===0&&y<20)?'#7C2840':'#9C3850'));
  [[26,43],[33,43]].forEach(([a,y])=>{for(let k=0;k<3;k++)put(ox+a,oy+y+k,f('#F8C040'));put(ox+a-1,oy+y+2,f('#F8C040'));put(ox+a+1,oy+y+2,f('#F8C040'))});
  flush();
  R(ox+10,oy+19,3,3,'#FFFFFF');R(ox+10,oy+20,2,2,OCN);for(let k=0;k<5;k++)R(ox+8+k,oy+17+(k>>1),1,1,OCN);
})}
const BOSS_ART=bossArt(false),BOSS_FLASH=bossArt(true);

// --- 背景（1面 空） ---
const CLOUDS=makeArt(AW,AH,({R,D})=>{
  const cl=(a,b,s)=>{const L=[[0,0,6],[7,-4,8],[16,-6,9],[25,-2,7],[32,1,5]].map(([u,v,r])=>[a+u*s,b+v*s,Math.round(r*s)]);const W=Math.round(36*s);L.forEach(([u,v,r])=>D(u,v+1,r,'#C8D8F8'));R(a,b+1,W,Math.round(6*s),'#C8D8F8');L.forEach(([u,v,r])=>D(u,v,r,'#FFFFFF'));R(a,b,W,Math.round(5*s),'#FFFFFF')};
  cl(25,42,0.6);cl(139,62,0.75);
});
const fx=a=>Math.round(a*AW/293);
const FAR=makeArt(AW,AH,({R,D})=>{
  const G=G_ART;const MT=[[fx(78),34,48],[fx(236),18,34]];
  const hy=(a,px,h,hw)=>{const d=Math.abs(a-px);if(d>=hw)return G;return Math.round(G-h*(1-Math.pow(d/hw,1.6)))};
  const top=[];for(let a=0;a<=AW;a++){let t=G;MT.forEach(([px,h,hw])=>{t=Math.min(t,hy(a,px,h,hw))});top[a]=t}
  for(let a=0;a<AW;a++){const t=top[a];if(t<G)R(a,t,1,G-t,'#3CAC3C')}
  for(let a=0;a<AW;a++){const t=top[a];if(t>=G)continue;const p=a>0?top[a-1]:G;const lo=Math.min(t,p),hi=Math.max(t,p);R(a,lo,1,Math.max(1,hi-lo),'#103810');R(a,t,1,1,'#103810')}
  const inM=(a,y)=>a>=0&&a<AW&&top[a]<G&&y>top[a]+2&&y<G-1;
  const tuft=(a,y)=>{if(inM(a,y)&&inM(a+3,y)){R(a,y,1,1,'#1E6A24');R(a+1,y-1,1,2,'#1E6A24');R(a+2,y,1,1,'#1E6A24')}};
  const rock=(a,y)=>{if(inM(a,y)&&inM(a+2,y+1)){R(a,y,2,1,'#103810');R(a,y+1,3,1,'#103810');R(a,y,1,1,'#1E6A24')}};
  [[-28,14,'t'],[-16,22,'r'],[-4,12,'t'],[8,24,'t'],[18,16,'r'],[30,26,'t']].forEach(([u,v,k])=>{const a=MT[0][0]+u,y=G-34+v;(k==='t'?tuft:rock)(a,y)});
  [[-14,10,'t'],[2,12,'r'],[16,13,'t']].forEach(([u,v,k])=>{const a=MT[1][0]+u,y=G-18+v;(k==='t'?tuft:rock)(a,y)});
  const tree=(a)=>{if(a<3||a>=AW-3||top[a]>=G)return;const b=top[a]+1;R(a,b-2,1,3,'#6C3C1C');D(a,b-5,3,'#103810');D(a,b-5,2,'#2E8C2E');R(a-1,b-6,1,1,'#6CCC5C')};
  [MT[0][0]-22,MT[0][0]-3,MT[0][0]+2,MT[0][0]+20,MT[1][0]-6,MT[1][0]+10].forEach(tree);
});
const GROUND=makeArt(AW,AH-G_ART,({R})=>{
  const G=0,h=AH-G_ART;
  R(0,G,AW,h,'#B86C30');
  R(0,G,AW,5,'#4CAC3C');R(0,G+1,AW,1,'#9CE05C');R(0,G,AW,1,OCN);
  for(let a=0;a<AW;a+=16){[[3,10],[9,13],[13,9],[6,16],[11,18]].forEach(([u,v])=>{R(a+u,G+v,2,1,'#8C4C20');R(a+u,G+v-1,2,1,'#D8945C')})}
});

// ===== ボタンの絵（黒×銀） =====
const COL={rim:'#2E3038',edge:'#9AA0B0',lab:'#E4E8F0'};
function cross(x,cx,cy,L,W,r){x.beginPath();x.roundRect(cx-W/2,cy-L/2,W,L,r);x.roundRect(cx-L/2,cy-W/2,L,W,r)}
function tri(x,cx,cy,dx,dy,s){x.beginPath();x.moveTo(cx+dx*s,cy+dy*s);x.lineTo(cx-dy*s*0.9-dx*s*0.2,cy+dx*s*0.9-dy*s*0.2);x.lineTo(cx+dy*s*0.9-dx*s*0.2,cy-dx*s*0.9-dy*s*0.2);x.closePath();x.fill()}
function drawDpad(x,dir){
  const cx=0,cy=0;
  x.fillStyle='rgba(0,0,0,0.35)';cross(x,cx+3,cy+4,104,40,6);x.fill();
  x.fillStyle=COL.edge;cross(x,cx-1,cy-1,104,40,6);x.fill();
  x.fillStyle=COL.rim;cross(x,cx+1,cy+1,102,38,6);x.fill();
  let g=x.createLinearGradient(0,cy-44,0,cy+44);g.addColorStop(0,'#3A3A42');g.addColorStop(1,'#0C0C10');
  x.fillStyle=g;cross(x,cx,cy,88,28,4);x.fill();
  x.fillStyle='#16161A';cross(x,cx,cy+1,84,24,3);x.fill();
  [[0,-1],[0,1],[-1,0],[1,0]].forEach(([dx,dy])=>{
    const on=(dx&&dir.x===dx)||(dy&&dir.y===dy);
    if(on){x.fillStyle='rgba(0,0,0,0.55)';x.fillRect(cx+dx*30-(dx?14:12),cy+dy*30-(dy?14:12),dx?28:24,dy?28:24)}
    const ax=cx+dx*31,ay=cy+dy*31;x.fillStyle=on?'#22222A':'#3A3A44';tri(x,ax-0.8,ay-0.8,dx,dy,7);x.fillStyle='#050507';tri(x,ax+0.6,ay+0.6,dx,dy,7)});
  x.fillStyle='#0A0A0C';x.beginPath();x.arc(cx,cy,9,0,7);x.fill();x.strokeStyle='#34343C';x.lineWidth=1.5;x.beginPath();x.arc(cx,cy,6,0.2,2.9);x.stroke();
}
function drawFire(x,pressed){
  const bx=0,by=0;
  x.fillStyle='rgba(0,0,0,0.35)';x.beginPath();x.arc(bx+3,by+4,31,0,7);x.fill();
  x.fillStyle=COL.edge;x.beginPath();x.arc(bx-1,by-1,31,0,7);x.fill();
  x.fillStyle=COL.rim;x.beginPath();x.arc(bx+1,by+1,30,0,7);x.fill();
  const o=pressed?1.5:0;
  const g=x.createRadialGradient(bx-8+o,by-9+o,2,bx+o,by+o,24);g.addColorStop(0,pressed?'#3A3A42':'#5E5E68');g.addColorStop(0.55,'#1C1C22');g.addColorStop(1,'#08080A');
  x.fillStyle=g;x.beginPath();x.arc(bx+o,by+o,23,0,7);x.fill();
  if(!pressed){x.fillStyle='rgba(255,255,255,0.22)';x.beginPath();x.ellipse(bx-7,by-11,8,4,-0.5,0,7);x.fill()}
  x.fillStyle=COL.rim;x.beginPath();x.roundRect(bx-20,by-56,40,20,10);x.fill();x.strokeStyle=COL.edge;x.lineWidth=1;x.stroke();
  x.font='12px "PS2P", monospace';x.textAlign='center';x.textBaseline='middle';x.fillStyle=COL.lab;x.fillText('A',bx+1,by-45);x.textAlign='start';
}

// ===== 画面の配置 =====
const L={gx:0,gy:0,gw:GW,gh:GH,left:null,right:null,btns:false,dpad:null,fire:null,back:null,dpr:1};
function insets(){const s=getComputedStyle(document.getElementById('fit'));return{t:parseFloat(s.paddingTop)||0,r:parseFloat(s.paddingRight)||0,b:parseFloat(s.paddingBottom)||0,l:parseFloat(s.paddingLeft)||0}}
function isPortrait(){return innerHeight>innerWidth}
function canPlay(){return !(IS_TOUCH&&isPortrait())}
function layout(){
  const vv=window.visualViewport;const W=Math.round(vv?vv.width:innerWidth),H=Math.round(vv?vv.height:innerHeight);
  L.dpr=Math.min(3,window.devicePixelRatio||1);
  L.dp=DP;L.fb=FB;L.bpad=16;
  if(IN_CARD){ // カード：ゲーム画面の左右に十字キーと発射ボタンを並べたデモ（全体 748×388 の比率）
    const u=W/(CARD_W+28),h=Math.round(W*(GH+28)/(CARD_W+28));
    document.documentElement.style.height=h+'px';document.body.style.height=h+'px';
    const gx=(14+CARD_COL)*u,gy=14*u,gw=GW*u,gh=GH*u;
    const left={x:14*u,y:gy,w:CARD_COL*u,h:gh},right={x:gx+gw,y:gy,w:CARD_COL*u,h:gh};
    L.dp=GH*u*DP/345;L.fb=GH*u*FB/345;L.bpad=16*u;
    const by=gy+gh-L.dp/2-L.bpad;
    Object.assign(L,{gx,gy,gw,gh,left,right,btns:true,back:null,dpad:{cx:left.x+left.w/2,cy:by},fire:{cx:right.x+right.w/2,cy:by}});
  }else{
    const ins=insets();const showBtns=IS_TOUCH&&!isPortrait();
    const aw=W-ins.l-ins.r-2*M;let ah=H-ins.t-ins.b-2*M;let top=0;
    let need=showBtns?2*(COLMIN+GAP):2*(BW+GAP);
    if(IS_TOUCH&&isPortrait()){need=0;top=BH+GAP}
    if(!IS_TOUCH&&(aw-need)*3/4<ah*0.85){need=0;top=BH+GAP} // PC で横に余白がないときは「戻る」を上に置く
    const gh=Math.max(60,Math.min(ah-top,(aw-need)*3/4)),gw=gh*4/3;
    const gx=ins.l+M+(aw-gw)/2,gy=ins.t+M+top+(ah-top-gh)/2;
    const left={x:ins.l+M,y:gy,w:gx-GAP-(ins.l+M),h:gh},right={x:gx+gw+GAP,y:gy,w:W-ins.r-M-(gx+gw+GAP),h:gh};
    let back;
    if(top>0)back={x:ins.l+M,y:ins.t+M,w:BW,h:BH};else back={x:left.x+(left.w-BW)/2,y:gy,w:BW,h:BH};
    Object.assign(L,{gx,gy,gw,gh,left,right,btns:showBtns,back});
    if(showBtns){const by=gy+gh-DP/2-16;L.dpad={cx:left.x+left.w/2,cy:by};L.fire={cx:right.x+right.w/2,cy:by}}else{L.dpad=L.fire=null}
  }
  Object.assign(cv.style,{left:L.gx+'px',top:L.gy+'px',width:L.gw+'px',height:L.gh+'px'});
  if(L.back&&!IN_CARD){Object.assign(backBtn.style,{display:'block',left:L.back.x+'px',top:L.back.y+'px'})}else backBtn.style.display='none';

  W.eb.forEach(b=>{
    if(b.kind==='feather'){const a=Math.atan2(b.vy,b.vx);ctx.save();ctx.translate(b.x,b.y);ctx.rotate(a);ctx.fillStyle='rgba(248,120,160,0.4)';ctx.beginPath();ctx.arc(0,0,10,0,7);ctx.fill();ctx.fillStyle='#F890B0';ctx.fillRect(-9,-3,18,6);ctx.fillStyle='#E04870';ctx.fillRect(5,-3,4,6);ctx.fillStyle='#FFFFFF';ctx.fillRect(-9,-1,14,2);ctx.restore()}
    else{ctx.fillStyle='rgba(120,200,255,0.45)';ctx.beginPath();ctx.arc(b.x,b.y,8,0,7);ctx.fill();ctx.fillStyle='#9CE0FF';ctx.beginPath();ctx.arc(b.x,b.y,4,0,7);ctx.fill();ctx.fillStyle='#FFFFFF';ctx.fillRect(Math.round(b.x)-2,Math.round(b.y)-2,2,2)}});
  // 効果
  W.fx.forEach(p=>{ctx.globalAlpha=1-p.t/p.life;ctx.fillStyle=p.c;ctx.fillRect(Math.round(p.x-p.r/2),Math.round(p.y-p.r/2),Math.round(p.r),Math.round(p.r))});ctx.globalAlpha=1;
  // スコアの帯
  ['#0C1028','#141A3C','#1C2450'].forEach((c,i)=>{ctx.fillStyle=c;ctx.fillRect(0,i*8,GW,8)});ctx.fillStyle='#8098D0';ctx.fillRect(0,24,GW,2);
  ctx.font='14px "PS2P", monospace';ctx.textBaseline='middle';ctx.textAlign='left';
  T('SCORE',8,'#F8D060');T(pad6(W.score),84,'#F8F8FF');T('HI',184,'#F8D060');T(pad6(Math.max(hiScore,W.demo?0:W.score)),216,'#F8F8FF');
  for(let i=0;i<Math.max(0,Math.min(3,W.lives-(s&&s.dead?0:0)));i++){const l=306+i*15;ctx.fillStyle='#E83838';ctx.fillRect(l,7,12,9);ctx.fillStyle='#F8F8FF';ctx.fillRect(l+2,8,8,3);ctx.fillStyle='#70E8F8';ctx.fillRect(l+12,10,4,3)}
  ctx.textAlign='right';T('STAGE1'+(W.loop>=2?'-'+W.loop:''),476,'#70E8F8');ctx.textAlign='left';
  // 面クリア
  if(W.clearT>0){ctx.textAlign='center';ctx.font='24px "PS2P", monospace';TT('STAGE CLEAR',GW/2,GH/2-10,'#FFE868');ctx.font='14px "PS2P", monospace';ctx.textAlign='left'}
  // 状態ごとの表示
  if(state==='demo')drawDemoBand();
  if(state==='over')drawOver();
  if(paused)drawPause();
}
function band(y,h){ctx.fillStyle='rgba(12,16,40,0.78)';ctx.fillRect(0,y,GW,h);ctx.fillStyle='#8098D0';ctx.fillRect(0,y,GW,2);ctx.fillRect(0,y+h-2,GW,2)}
function jp(s,y,size,col){ctx.font='500 '+size+'px "Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif';ctx.textAlign='center';ctx.fillStyle='#000';ctx.fillText(s,GW/2+1,y+1);ctx.fillStyle=col;ctx.fillText(s,GW/2,y);ctx.textAlign='left'}
function drawDemoBand(){
  band(118,96);ctx.textAlign='center';ctx.font='24px "PS2P", monospace';TT('BRASS HORIZON',GW/2,148,'#E8C26A');ctx.font='14px "PS2P", monospace';
  const blink=Math.floor(performance.now()/500)%2===0;
  if(IN_CARD||canPlay()){if(blink)TT(IS_TOUCH||IN_CARD?'TAP TO PLAY':'CLICK OR PRESS SPACE',GW/2,190,'#F8F8FF')}
  else{const on=noteFlash>0?(Math.floor(noteFlash*8)%2===0):true;if(on)jp('横向きにするとプレイできます',190,18,noteFlash>0?'#FFE868':'#F8F8FF')}
  ctx.textAlign='left';
}
function drawOver(){
  band(110,112);ctx.textAlign='center';ctx.font='24px "PS2P", monospace';TT('GAME OVER',GW/2,140,'#E83838');
  ctx.font='14px "PS2P", monospace';
  if(overT>0.8){ctx.fillStyle='#2E3038';ctx.beginPath();ctx.roundRect(GW/2-70,168,140,36,8);ctx.fill();ctx.strokeStyle='#9AA0B0';ctx.lineWidth=2;ctx.stroke();TT('RETRY',GW/2,186,'#F8F8FF')}
  ctx.textAlign='left';
}
function drawPause(){ctx.fillStyle='rgba(8,10,24,0.82)';ctx.fillRect(0,0,GW,GH);ctx.textAlign='center';ctx.font='18px "PS2P", monospace';TT('PAUSE',GW/2,150,'#E8C26A');jp(document.hidden?'':'横向きに戻すと再開します',196,18,'#F8F8FF');ctx.textAlign='left'}

// ===== ループ =====
let acc=0,last=performance.now();
function frame(now){
  let dt=Math.min(0.1,(now-last)/1000);last=now;
  if(!paused){acc+=dt;while(acc>=1/60){update(1/60);acc-=1/60}}else{acc=0;input.fireQueue=0;if(noteFlash>0)noteFlash-=dt}
  if(state==='demo'&&W.demo&&W.t>STAGE_LEN+40){toDemo()}
  draw();redrawButtons();
  requestAnimationFrame(frame);
}
function refit(){layout()}
addEventListener('resize',refit);addEventListener('orientationchange',()=>setTimeout(refit,60));if(window.visualViewport)visualViewport.addEventListener('resize',refit);

// ===== 開始 =====
function boot(){
  toDemo();layout();
  if(!IN_CARD&&location.hash==='#play'){if(canPlay())startPlay();else wantPlayOnRotate=true}
  requestAnimationFrame(t=>{last=t;frame(t)});
}
(document.fonts&&document.fonts.load?Promise.all([document.fonts.load('14px "PS2P"'),document.fonts.load('24px "PS2P"')]).catch(()=>{}):Promise.resolve()).then(boot,boot);
})();
</script>
