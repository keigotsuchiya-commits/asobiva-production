<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>数秘術｜カトリーヌ・和子の占い手帖</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500&family=Zen+Kaku+Gothic+New:wght@400;500&display=swap">
<style>
/* 幅360を基準に、大きさはすべて窓の幅に対する割合。カードは横1：縦1.7で固定（彼女の絵と言葉 0.85 ／ 道具の面 0.85） */
:root {
  --u: calc(100vw / 360);
  --night: #0B1222;   /* 彼女の絵の下側の色 */
  --gold: #BD965D;    /* 星図の金 */
  --gold-ink: #7A5C2E;
  --paper: #F3ECDC;
  --ink: #1E2533;
  --pen: #24304A;
  --sub: #5C5A63;
  --moon: #EDE4CE;
}
html, body { margin: 0; padding: 0; background: var(--night); }
body { width: 100vw; height: calc(var(--u) * 612); overflow: hidden; font-family: 'Zen Kaku Gothic New', 'Hiragino Sans', sans-serif; color: var(--moon); -webkit-text-size-adjust: 100%; }
p { margin: 0; }
button, select { font: inherit; }
[hidden] { display: none !important; }

/* 開く前 */
.cover { height: 100%; display: flex; flex-direction: column; }
.cover .art { position: relative; height: calc(var(--u) * 360); flex-shrink: 0; }
.cover .art img { display: block; width: 100%; height: 100%; object-fit: cover; -webkit-mask-image: linear-gradient(to bottom, #000 80%, transparent); mask-image: linear-gradient(to bottom, #000 80%, transparent); }
.cover .rest { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: calc(var(--u) * 26); padding-bottom: calc(var(--u) * 10); }
.cover .eyebrow { font-size: calc(var(--u) * 10); letter-spacing: .4em; color: var(--gold); text-align: center; }
.cover h1 { margin: calc(var(--u) * 6) 0 0; font-family: 'Shippori Mincho', serif; font-weight: 500; font-size: calc(var(--u) * 30); letter-spacing: .18em; text-indent: .18em; color: var(--moon); text-align: center; }
.start { width: calc(var(--u) * 190); height: calc(var(--u) * 46); border: 1px solid var(--gold); border-radius: 999px; background: transparent; color: var(--gold); font-family: 'Shippori Mincho', serif; font-size: calc(var(--u) * 16); letter-spacing: .3em; text-indent: .3em; cursor: pointer; }

/* 占っている間 */
.stage { height: 100%; display: flex; flex-direction: column; }
.portrait { position: relative; height: calc(var(--u) * 306); flex-shrink: 0; overflow: hidden; }
.portrait .face { position: absolute; inset: 0; display: block; width: 100%; height: 100%; object-fit: cover; object-position: 50% 22%; opacity: 0; transition: opacity .7s ease; }
.portrait .face.on { opacity: 1; }
.talk { position: absolute; left: 0; right: 0; bottom: 0; height: calc(var(--u) * 96); box-sizing: border-box; padding: calc(var(--u) * 16) calc(var(--u) * 22) 0; pointer-events: none; }
.talk .who { font-size: calc(var(--u) * 9.5); letter-spacing: .25em; color: var(--gold); }
.talk .say { white-space: pre-line; margin-top: calc(var(--u) * 6); font-family: 'Shippori Mincho', serif; font-size: calc(var(--u) * 14.5); line-height: 1.75; color: var(--moon); }
.say.fade { animation: fade .5s ease; }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }

.tool { height: calc(var(--u) * 306); box-sizing: border-box; padding: calc(var(--u) * 8) calc(var(--u) * 14) calc(var(--u) * 14); }
.page { height: 100%; box-sizing: border-box; background: var(--paper); color: var(--ink); border: 1px solid var(--gold); border-radius: calc(var(--u) * 6); padding: calc(var(--u) * 16) calc(var(--u) * 18); display: flex; flex-direction: column; }
.page.scroll { overflow-y: auto; -webkit-overflow-scrolling: touch; display: block; }
.ph { font-size: calc(var(--u) * 9.5); letter-spacing: .3em; color: var(--gold-ink); text-align: center; }

.welcome { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: calc(var(--u) * 10); }
.welcome .big { font-family: 'Shippori Mincho', serif; font-size: calc(var(--u) * 22); letter-spacing: .16em; text-indent: .16em; color: var(--ink); }
.welcome .line { width: calc(var(--u) * 60); height: 1px; background: var(--gold); }
.welcome .s { font-size: calc(var(--u) * 11.5); color: var(--sub); }

.ask { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: calc(var(--u) * 14); }
.dates { display: grid; grid-template-columns: 1.5fr 1fr 1fr; gap: calc(var(--u) * 8); }
.sel { display: flex; flex-direction: column; gap: calc(var(--u) * 5); min-width: 0; }
.sel label { font-size: calc(var(--u) * 11); color: var(--sub); }
.sel select { -webkit-appearance: none; appearance: none; display: block; width: 100%; min-width: 0; box-sizing: border-box; height: calc(var(--u) * 42); padding: 0 calc(var(--u) * 10); border: 1px solid var(--gold); border-radius: calc(var(--u) * 6); background: #FBF7EE; color: var(--ink); font-size: calc(var(--u) * 16); }
.err { font-size: calc(var(--u) * 11); color: #9A2F2F; text-align: center; }
.note { font-size: calc(var(--u) * 10); line-height: 1.7; color: var(--sub); }
.nextbtn { align-self: center; flex-shrink: 0; margin-top: calc(var(--u) * 16); width: calc(var(--u) * 150); height: calc(var(--u) * 38); border: 1px solid var(--gold); border-radius: 999px; background: transparent; color: var(--gold-ink); font-family: 'Shippori Mincho', serif; font-size: calc(var(--u) * 13); letter-spacing: .2em; text-indent: .2em; cursor: pointer; }
.nextbtn.wait { visibility: hidden; }
.go { height: calc(var(--u) * 44); border: none; border-radius: 999px; background: var(--night); color: var(--moon); font-family: 'Shippori Mincho', serif; font-size: calc(var(--u) * 15); letter-spacing: .15em; cursor: pointer; }

.write { flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: calc(var(--u) * 4); font-family: 'Shippori Mincho', serif; color: var(--pen); }
.write .w { font-size: calc(var(--u) * 15); letter-spacing: .04em; opacity: 0; transition: opacity .5s ease; font-variant-numeric: tabular-nums; text-align: center; }
.write .w.on { opacity: 1; }
.write .arrow { font-size: calc(var(--u) * 11); color: var(--gold-ink); }
.write .final { position: relative; flex-shrink: 0; margin-top: calc(var(--u) * 6); width: calc(var(--u) * 58); height: calc(var(--u) * 58); display: flex; align-items: center; justify-content: center; font-family: 'Shippori Mincho', serif; font-weight: 500; font-size: calc(var(--u) * 30); line-height: 1; color: var(--pen); opacity: 0; transform: scale(.92); transition: opacity .8s ease, transform .8s ease; }
.write .final.on { opacity: 1; transform: none; }
.write .final::before, .write .final::after { content: ''; position: absolute; border-radius: 50%; border: 1px solid var(--gold); }
.write .final::before { inset: 0; }
.write .final::after { inset: calc(var(--u) * 4); }

.sheet .head { text-align: center; padding-bottom: calc(var(--u) * 12); border-bottom: 1px solid rgba(189, 150, 93, .6); }
.sheet .num { font-family: 'Shippori Mincho', serif; font-size: calc(var(--u) * 46); line-height: 1.1; color: var(--gold-ink); }
.sheet .nm { font-family: 'Shippori Mincho', serif; font-size: calc(var(--u) * 17); letter-spacing: .1em; color: var(--ink); }
.sheet h3 { margin: calc(var(--u) * 16) 0 calc(var(--u) * 6); font-size: calc(var(--u) * 11); font-weight: 500; letter-spacing: .15em; color: var(--gold-ink); }
.sheet .tx { font-size: calc(var(--u) * 13); line-height: 1.95; color: var(--ink); }
.sheet .word { font-family: 'Shippori Mincho', serif; font-size: calc(var(--u) * 13.5); line-height: 1.9; color: var(--pen); }
.sheet .sep { margin: calc(var(--u) * 20) 0 0; padding-top: calc(var(--u) * 14); border-top: 1px solid rgba(189, 150, 93, .6); text-align: center; }
.sheet .sep .num { font-size: calc(var(--u) * 34); }
.sheet .again { display: block; margin: calc(var(--u) * 22) auto calc(var(--u) * 4); width: calc(var(--u) * 170); height: calc(var(--u) * 40); border: 1px solid var(--gold); border-radius: 999px; background: transparent; color: var(--gold-ink); font-family: 'Shippori Mincho', serif; font-size: calc(var(--u) * 13); cursor: pointer; }
</style>
</head>

  var T = {"LP": {"1": ["始まりの数", "古くから「1」は、すべての始まりを告げる数とされてきました。あなたの内には、夜明けの最初の光のような力が宿っています。誰も歩いていない道を前にしたとき、あなたの心は怖れよりも先に、高鳴りを覚えるのです。", "自分で決め、自分の足で踏み出せる強さがあります。あなたが一歩を踏み出すと、その背中を見て、後に続く人が現れます。", "先を急ぐあまり、隣を歩く人の足音が聞こえなくなることがあります。ときには振り返って、誰かと歩幅を合わせてみてください。ひとりで開いた道も、ふたりで歩けば、景色が変わって見えるものです。", "山あいの村で、朝いちばんに鐘を鳴らす役目の少年に会いました。「誰かが最初に鳴らさないと、村の朝は来ないんだ」と胸を張っていましたよ。あなたもきっと、そういう役目を持って生まれた人です。"], "2": ["調和の数", "「2」は、ふたつのものを結び、つなぐ数とされてきました。あなたの内には、水面に映る月のような、静かでやわらかな感受性があります。言葉にならない誰かの気持ちを、あなたは風の揺らぎのように感じ取ることができます。", "人と人のあいだに立ち、橋をかける力があります。あなたがそばにいるだけで、張りつめていた空気がふっとほどけていくのです。", "人の心に寄り添いすぎると、自分の心の声が遠くなってしまうことがあります。一日の終わりに、「私はどう感じたのだろう」とそっと問いかけてみてください。あなた自身の気持ちも、同じように大切にされてよいものです。", "川をはさんだふたつの町を、小舟でつなぐ渡し守のおばあさんがいました。「私はどちらの岸にも住んでいないけれど、どちらの町の人のことも知っているの」と笑っていましたよ。あなたの居場所も、きっとそういう、つなぐところにあるのでしょう。"], "3": ["歓びの数", "「3」は、ひとつとふたつが出会って生まれる、創造の数とされてきました。あなたの内には、春の野にいっせいに花が開くような、明るい生命の力があります。あなたの言葉や笑い声は、まわりの空気に色をつけていきます。", "心に浮かんだものを、言葉や形にして人に届ける力があります。あなたが楽しんでいるとき、その楽しさは不思議と人から人へ広がっていきます。", "心が向くままに花から花へと移るうちに、ひとつの実を育てる前に季節が過ぎてしまうことがあります。いちばん心が動いたものをひとつだけ選んで、しばらく水をやり続けてみてください。実りのときは、思っているより早く訪れます。", "港町の広場で、毎晩ちがう歌をうたう流しの楽師に会いました。「同じ歌はつまらないけれど、同じ広場には毎晩来るんだ」と言っていましたよ。自由に咲くことと、根を張ることは、ちゃんと両立できるのです。"], "4": ["礎の数", "「4」は、東西南北や四季のように、世界を形づくる土台の数とされてきました。あなたの内には、長い年月をかけて積み上げられた石垣のような、揺るがない確かさがあります。目の前のことを一つずつ丁寧に積み重ねていくことに、静かな喜びを感じる人です。", "約束を守り、決めたことを最後までやり遂げる力があります。あなたが築いたものは、嵐の日にも人の拠りどころになります。", "決めた形を大切にするあまり、思いがけない風が吹いたときに戸惑ってしまうことがあります。予定どおりに進まない日は、少しだけ窓を開けてみてください。外から入ってくる風が、あなたの石垣をさらに強くしてくれることもあります。", "古い石橋を、何十年も一人で手入れしている職人に会いました。「石は嘘をつかない。積んだぶんだけ、ちゃんと応えてくれる」と話してくれましたよ。あなたの積み重ねも、同じように応えてくれるはずです。"], "5": ["風の数", "「5」は、五つの感覚を通して世界を味わう、変化と自由の数とされてきました。あなたの内には、ひとところにとどまらない風のような魂が息づいています。新しい土地、新しい人、新しい考えに出会うたびに、あなたの目は輝きを増していきます。", "変化を怖れず、どんな場所にもすっとなじんでいける軽やかさがあります。あなたが運んでくる新しい風は、止まっていた物ごとを動かすきっかけになります。", "次の景色が気になるあまり、今いる場所の美しさを見過ごしてしまうことがあります。出発の前に一度だけ、今の場所で心に残ったことを書き留めてみてください。その一行が、あとで大切な地図になります。", "私も若い頃は、ひとつの町に三日といられない旅人でした。ある宿の主人に「急ぐ旅ほど、靴ひもを結び直す時間を持ちなさい」と言われたことを、今でも思い出しますよ。"], "6": ["慈しみの数", "「6」は、六角形の蜂の巣のように、調和と守りを表す数とされてきました。あなたの内には、冬の夜に灯る暖炉のような、あたたかな光があります。大切な人が安心して笑っていられることが、あなたにとって何よりの幸せなのです。", "人を思いやり、居心地のよい場所をつくる力があります。あなたのそばにいると、人は自然と肩の力を抜くことができます。", "誰かのために灯をともし続けるうちに、自分の薪が尽きかけていることに気づかないことがあります。ときには、自分のためだけに火をおこす時間をつくってください。満たされたあなたの灯は、もっと遠くまで届くようになります。", "雪深い村の宿で、旅人みんなにスープをふるまうおかみさんに出会いました。でも、最後の一杯だけは自分のために取っておくのだそうです。「空っぽの鍋では、誰もあたためられないからね」と笑っていましたよ。"], "7": ["探求の数", "古くから「7」は、目に見えないものの奥をのぞく数とされてきました。あなたの内には、静かな湖のような深さがあります。人の言葉より、自分の内側から聞こえる声を信じて進む人です。夜の静けさの中でこそ、あなたの考えは澄んでいきます。", "ほかの人が通り過ぎてしまうものの前で、あなたは立ち止まることができます。その小さな違和感の中に、真実への入口が隠れていることを、あなたの魂は知っているのです。", "深い森に入りすぎると、帰り道が見えなくなることがあります。ひとりで抱えた思いは、ときどき誰かに手渡してみてください。言葉にした瞬間、閉じていた扉がふっと開くことがあります。", "砂漠の町で出会った老人が、こう教えてくれました。「答えは探す者のところにではなく、待つことを知る者のところに来る」と。あなたにも、きっとその時が訪れますよ。"], "8": ["実りの数", "「8」は、横に倒すと無限を表す形になることから、尽きることのない力と循環の数とされてきました。あなたの内には、大河の流れのような、大きく力強いうねりがあります。目指す場所を定めたとき、あなたは驚くほどの粘り強さで、そこへ向かって進んでいきます。", "物ごとを大きく動かし、形ある成果へと結びつける力があります。あなたが本気になったとき、人も物も、自然とその流れに集まってきます。", "流れが強いほど、岸辺に咲く小さな花を押し流してしまうことがあります。成果を手にしたときこそ、一緒に歩んでくれた人に目を向けてみてください。分かち合った実りは、次の季節にもっと大きく育ちます。", "大きな市場を取り仕切る商人の家に、しばらく泊めてもらったことがあります。主人は毎晩、帳簿を閉じたあとに、その日いちばん助けてくれた人の名前を書き添えていました。「これがいちばん大事な数字なんだ」と言っていましたよ。"], "9": ["円環の数", "「9」は、一桁の数のいちばん最後にある、完成と締めくくりの数とされてきました。あなたの内には、すべての色を溶かし込んだ夕暮れの空のような、深く広い心があります。遠い国の誰かの悲しみにも、自分のことのように胸を痛めることができる人です。", "立場や違いをこえて、人を受け入れる大きな器があります。あなたの言葉は、迷っている人の心に、静かな安らぎをもたらします。", "遠くを見つめるあまり、足もとの小さな願いをあとまわしにしてしまうことがあります。大きな理想と同じくらい、今日のささやかな楽しみも大切にしてください。あなたが満ち足りていることが、まわりへのいちばんの贈りものになります。", "長い旅の途中で、海辺の灯台守と夕日を眺めたことがあります。「灯台は遠くの船のためにあるけれど、灯台守がいちばん好きなのは、この夕日なんですよ」と教えてくれました。あなたにも、そんな自分だけの夕日があるとよいですね。"], "11": ["天啓の数", "「11」は、ふたつの「1」が向かい合う、特別な数とされてきました。あなたの内には、夜空と地上をつなぐ細い光の柱のような、鋭い感受性が宿っています。理由はわからないのに「こうだ」とわかる瞬間が、あなたには人より多く訪れるでしょう。", "目に見えない流れを感じ取り、ひらめきとして形にする力があります。あなたのふとしたひと言が、誰かの迷いを照らす灯になることがあります。", "感じ取る力が強いぶん、人や場所の空気に疲れてしまうことがあります。にぎやかな場所から帰った日は、静かな音楽や温かい飲みもので、心を休ませてあげてください。澄んだ水面にこそ、星はくっきりと映ります。", "北の国の古い修道院で、見た夢を毎朝ノートに書き留めている修道女に会いました。「夢は答えではなく、問いを運んでくるのよ」と話してくれましたよ。あなたに訪れるひらめきも、きっと大切な問いの入口です。"], "22": ["建立の数", "「22」は、ふたつの「2」が重なり、大きな夢を地上に築く数とされてきました。あなたの内には、遠い未来まで残る大聖堂の設計図のような、壮大な構想が眠っています。思い描くだけでなく、それを本当に形にしたいと願うのが、あなたという人です。", "大きな理想と、それを支える現実的な力を、あわせ持っています。あなたが手がけたものは、一人の力をこえて、多くの人の役に立つものへと育っていきます。", "描く夢が大きいほど、ひとりで背負い込んで、その重さに膝をつきそうになることがあります。設計図を広げて、手伝ってくれる人に見せてみてください。どんな大聖堂も、たくさんの手で一つずつ石を積んで建てられたのです。", "百年以上かけて、今も建てられ続けている教会を見上げたことがあります。案内してくれた石工は「私は完成を見られないけれど、この石は確かに私が置いた」と誇らしげでしたよ。"], "33": ["慈愛の数", "「33」は、ふたつの「3」が重なる、限りない慈しみの数とされてきました。あなたの内には、すべての命をやさしく照らす満月のような、大きな愛があります。見返りを求めずに人に手を差し伸べることが、あなたにとってはごく自然なことなのです。", "人の痛みに寄り添い、その人が自分で立ち上がる力を、そっと引き出すことができます。あなたと出会った人は、少しだけ自分のことを好きになって帰っていきます。", "すべての人を照らそうとするあまり、自分の心が欠けていくことに気づかないことがあります。月にも満ち欠けがあるように、休む時期があってよいのです。あなたが休んでいるあいだも、あなたが照らした人たちは、ちゃんと歩いています。", "南の島で、子どもたちに読み書きを教えながら暮らす老婦人に出会いました。「教えているつもりが、毎日いちばん教わっているのは私なのよ」と目を細めていましたよ。あなたの与える愛も、きっと同じように、あなたへ巡って返ってきます。"]}, "PY": {"1": ["種まきの年", "新しい九年の巡りが、ここから始まります。古くから「1」の年は、まだ見ぬ物語の最初のページをめくる年とされてきました。心の中で温めてきたことがあれば、小さな種として土に埋めてみるのにふさわしい時です。", "大きな計画より、今日できる小さな一歩を選んでください。手帖の最初のページに、今年はじめたいことを一つだけ書いておくと、一年の道しるべになります。"], "2": ["芽吹きを待つ年", "昨年まいた種が、土の中で静かに根を伸ばしている年です。目に見える変化は少なくても、見えないところで大切なものが育っています。人との出会いや、つながりが深まっていく巡りとされています。", "急がず、待つことを楽しんでください。誰かの話にじっくり耳を傾けると、思いがけない縁が結ばれることがあります。"], "3": ["花ひらく年", "育ってきたものが、色とりどりの花をつけはじめる年です。表現すること、楽しむこと、人と喜びを分かち合うことに、光があたる巡りとされています。", "心が動いたことは、言葉や形にして外に出してみてください。久しぶりの人に会いに行くのも、この年にふさわしい過ごし方です。"], "4": ["礎を固める年", "咲いた花を実へと育てるために、足もとの土を固める年です。地道な積み重ねが、この先の数年を支える礎になる巡りとされています。", "暮らしや仕事の中で、整えたいところを一つ選んで手入れしてみてください。毎日少しずつ続けられることが、この年のいちばんの味方になります。"], "5": ["風が吹く年", "九年の巡りのちょうど真ん中で、新しい風が吹き込む年です。思いがけない変化や、まだ知らない世界との出会いが訪れやすい巡りとされています。", "いつもと違う道を歩いてみてください。予定外の出来事も、旅の寄り道のように楽しむと、新しい扉が開きます。"], "6": ["灯をともす年", "大切な人とのつながりや、自分の居場所に目が向く年です。家族や身近な人を慈しみ、また慈しまれる巡りとされています。", "身のまわりの人に、感謝の言葉を一つ届けてみてください。そして、自分自身を休ませることも、同じくらい大切にしてください。"], "7": ["内なる泉をのぞく年", "外へ向かっていた心を、内側へと向ける年です。学び、考え、自分の奥にある泉をのぞき込むのにふさわしい巡りとされています。", "ひとりで過ごす静かな時間を、意識してつくってください。気になっていた本を開くと、そこに今のあなたへの言葉が待っているかもしれません。"], "8": ["実りを手にする年", "これまで育ててきたものが、実りとなって手もとに届きやすい年です。力が満ち、物ごとを大きく動かしていける巡りとされています。", "実ったものは、遠慮せずに受け取ってください。そして、ここまで支えてくれた人にも、その実りを少し分けてみてください。"], "9": ["巡りを結ぶ年", "九年の巡りが、ひとつの円を描いて結ばれる年です。役目を終えたものに感謝して手放し、次の始まりに備える巡りとされています。", "身のまわりや心の中で、もう持っていなくてよいものを、そっと手放してみてください。空いた場所に、来年の新しい種がまかれます。"]}, "BD": {"1": ["先頭に立つ才", "「1」の日に生まれたあなたには、迷わず最初の一歩を踏み出す才が宿っています。誰かが決めてくれるのを待つより、自分で道を選ぶときに、あなたの力はいちばん輝きます。"], "2": ["寄り添う才", "「2」の日に生まれたあなたには、人の気持ちの小さな揺れに気づく才が宿っています。言葉にされない思いをそっと受け止めることで、あなたは人と人のあいだに、静かな橋をかけていきます。"], "3": ["表す才", "「3」の日に生まれたあなたには、心の中にあるものを、言葉や形や笑顔にして外へ表す才が宿っています。あなたが楽しんで表したものは、見る人の心にも明かりをともします。"], "4": ["積み上げる才", "「4」の日に生まれたあなたには、ひとつずつ確かに積み上げていく才が宿っています。時間をかけて築いたものほど、あなたの手のなかで揺るがない形になっていきます。"], "5": ["飛び込む才", "「5」の日に生まれたあなたには、新しいことへ身軽に飛び込んでいく才が宿っています。知らない場所や考えに触れるたびに、あなたの中の可能性がひとつずつ開いていきます。"], "6": ["育む才", "「6」の日に生まれたあなたには、人や物を大切に育む才が宿っています。あなたが手をかけたものは、不思議と居心地のよい温かさをまとうようになります。"], "7": ["見抜く才", "「7」の日に生まれたあなたには、物ごとの奥にある本当の姿を、静かに見抜く才が宿っています。ひとりで考える時間が、その目をさらに澄ませてくれます。"], "8": ["動かす才", "「8」の日に生まれたあなたには、人や物ごとを大きくまとめ、前へ動かしていく才が宿っています。目標がはっきりしたとき、あなたのまわりには自然と流れが生まれます。"], "9": ["包み込む才", "「9」の日に生まれたあなたには、違いをこえて人を受け入れる、懐の深い才が宿っています。あなたのそばでは、多くの人が安心して自分の言葉を話せるのです。"], "11": ["感じ取る才", "「11」を持つあなたには、目に見えない流れを感じ取る、鋭い直感の才が宿っています。ふとしたひらめきや胸騒ぎを、軽く扱わずに受け止めてみてください。"], "22": ["築き上げる才", "「22」を持つあなたには、大きな構想を、現実の形として築き上げる才が宿っています。遠い夢を、確かな一歩の積み重ねに変えていけるのが、あなたの力です。"]}, "PM": {"1": ["始める月", "新しいことを始めるのに向いた月です。小さな計画をひとつ立てて、月の前半のうちに動き出してみてください。"], "2": ["寄り添う月", "人との協力や話し合いが実を結びやすい月です。急がずに、相手の話にじっくり耳を傾けてみてください。"], "3": ["楽しむ月", "表現することや人との交流に光があたる月です。気になる場所へ出かけ、心が動いたことを誰かに話してみてください。"], "4": ["整える月", "足もとを固めるのに向いた月です。部屋や予定など、身のまわりをひとつ整えると、流れがよくなります。"], "5": ["変わる月", "変化が訪れやすい月です。予定外の出来事も、新しい道への入口として受け取ってみてください。"], "6": ["慈しむ月", "身近な人との時間を大切にしたい月です。感謝を言葉にして、自分を休ませることも忘れずに。"], "7": ["見つめる月", "心の内側を見つめるのに向いた月です。ひとりの静かな時間を持ち、本や考えごとにゆっくり浸ってみてください。"], "8": ["実る月", "これまでの努力が形になりやすい月です。遠慮せずに力を出し、手にしたものをまわりとも分かち合ってみてください。"], "9": ["締めくくる月", "ひと区切りをつけるのに向いた月です。終わらせたいこと、手放したいものをひとつ選んでみてください。"]}, "PD": {"1": ["はじめの日", "新しいことに手をつけるのによい日です。後回しにしていたことを、今日ひとつだけ始めてみてください。"], "2": ["ゆずる日", "人の話を聞き、ゆずることで、思いがけない助けが返ってくる日です。"], "3": ["笑う日", "楽しいことを選んでよい日です。好きなものに触れる時間を、少しだけ持ってみてください。"], "4": ["こつこつの日", "目の前のことを丁寧に進めたい日です。地味なひと手間が、あとで効いてきます。"], "5": ["寄り道の日", "いつもと違う道やお店を選んでみてください。小さな発見が待っている日です。"], "6": ["やさしい日", "身近な人に、ひと声かけてみてください。温かいやりとりが、一日を照らしてくれます。"], "7": ["静かな日", "ひとりで考えごとをするのによい日です。夜は早めに休んで、心を澄ませてください。"], "8": ["力の出る日", "大事な用事に向いた日です。迷っていたことに、思い切って一歩踏み込んでみてください。"], "9": ["手放す日", "片づけや見直しに向いた日です。要らないものをひとつ手放すと、気持ちが軽くなります。"]}};
  var $ = function (id) { return document.getElementById(id); };
  var year = new Date().getFullYear();
  var pages = ['pWelcome', 'pAsk', 'pWrite', 'pSheet'];
  var timers = [];
  function page(id) { pages.forEach(function (p) { $(p).hidden = (p !== id); }); }
  function say(text) {
    var el = $('say'); el.textContent = text; el.classList.remove('fade'); void el.offsetWidth; el.classList.add('fade');
  }
  function face(id) { ['f_base', 'f_write', 'f_tell', 'f_give'].forEach(function (f) { $(f).classList.toggle('on', f === id); }); }
  var after = null;
  function clearTimers() { timers.forEach(clearTimeout); timers = []; }
  $('n1').addEventListener('click', function () { scene2(); });
  $('n2').addEventListener('click', function () { if (after) { var f = after; after = null; f(); } });

  function opt(sel, text, val) { var o = document.createElement('option'); o.textContent = text; o.value = val; sel.appendChild(o); }
  opt($('y'), '----', ''); for (var yy = year; yy >= 1900; yy--) opt($('y'), yy, yy);
  opt($('m'), '--', ''); for (var mm = 1; mm <= 12; mm++) opt($('m'), mm, mm);
  function fillDays() {
    var cur = $('d').value, y = +$('y').value || 2000, m = +$('m').value || 1, max = new Date(y, m, 0).getDate();
    $('d').textContent = ''; opt($('d'), '--', '');
    for (var dd = 1; dd <= max; dd++) opt($('d'), dd, dd);
    if (cur && +cur <= max) $('d').value = cur;
  }
  fillDays();
  ['y', 'm'].forEach(function (id) { $(id).addEventListener('change', function () { fillDays(); $('err').hidden = true; }); });
  $('d').addEventListener('change', function () { $('err').hidden = true; });

  function sum(a) { return a.reduce(function (x, y) { return x + y; }, 0); }
  function two(n) { return (n < 10 ? '0' : '') + n; }

  function scene1() {
    clearTimers(); page('pWelcome'); face('f_base');
    say('ようこそ。さあ、こちらへお掛けなさい。');
  }
  function scene2() {
    clearTimers(); page('pAsk'); face('f_base');
    say('あなたの生まれた日を、教えてくださる？');
  }
  $('tell').addEventListener('click', function () {
    if (!$('y').value || !$('m').value || !$('d').value) { $('err').hidden = false; return; }
    var Y = String($('y').value), M = two(+$('m').value), D = two(+$('d').value);
    var digits = (Y + M + D).split('').map(Number);
    var n = sum(digits), steps = [digits.join(' + ') + ' = ' + n];
    while (n > 9 && n !== 11 && n !== 22 && n !== 33) { var e = String(n).split('').map(Number); var k = sum(e); steps.push(e.join(' + ') + ' = ' + k); n = k; }
    var red9 = function (x) { while (x > 9) x = sum(String(x).split('').map(Number)); return x; };
    var p = red9(sum((String(year) + M + D).split('').map(Number)));
    var b = sum(D.split('').map(Number)); while (b > 9 && b !== 11 && b !== 22) b = sum(String(b).split('').map(Number));
    var now = new Date(), pm = red9(p + now.getMonth() + 1), pdy = red9(pm + now.getDate());
    scene3(Y + '年 ' + (+M) + '月 ' + (+D) + '日', steps, { n: n, p: p, b: b, pm: pm, pd: pdy, mon: now.getMonth() + 1, day: now.getDate() });
  });
  function scene3(dateText, steps, r) {
    var n = r.n; page('pWrite'); face('f_write'); $('n2').classList.add('wait');
    say('ありがとう。では、手帖に書き留めますね。');
    var w = $('write'); w.textContent = '';
    var items = [dateText].concat(steps);
    var nodes = items.map(function (t, i) {
      if (i > 0) { var a = document.createElement('p'); a.className = 'w arrow'; a.textContent = '↓'; w.appendChild(a); }
      var el = document.createElement('p'); el.className = 'w'; el.textContent = t; w.appendChild(el); return el;
    });
    var fin = document.createElement('div'); fin.className = 'final';
    var fn = document.createElement('span'); fn.textContent = n; fin.appendChild(fn); w.appendChild(fin);
    var all = Array.prototype.slice.call(w.children);
    all.forEach(function (el, i) { timers.push(setTimeout(function () { el.classList.add('on'); }, 500 + i * 550)); });
    timers.push(setTimeout(function () {
      var L = T.LP[n]; face('f_tell');
      say('あなたの数は「' + n + '」。' + L[0] + 'です。');
      after = function () { scene4(r); }; $('n2').classList.remove('wait');
    }, 700 + all.length * 550 + 800));
  }
  function scene4(r) {
    var n = r.n, p = r.p, L = T.LP[n], P = T.PY[p], B = T.BD[r.b], PM = T.PM[r.pm], PD = T.PD[r.pd];
    $('bNum').textContent = r.b; $('bName').textContent = B[0]; $('bT').textContent = B[1];
    $('mLabel').textContent = r.mon + '月の流れ'; $('mNum').textContent = r.pm; $('mName').textContent = PM[0]; $('mT').textContent = PM[1];
    $('dLabel').textContent = '今日（' + r.mon + '月' + r.day + '日）の流れ'; $('dNum').textContent = r.pd; $('dName').textContent = PD[0]; $('dT').textContent = PD[1];
    $('sNum').textContent = n; $('sName').textContent = L[0];
    $('sT1').textContent = L[1]; $('sT2').textContent = L[2]; $('sT3').textContent = L[3]; $('sT4').textContent = L[4];
    $('yLabel').textContent = year + '年の流れ'; $('yNum').textContent = p; $('yName').textContent = P[0];
    $('yT1').textContent = P[1]; $('yT2').textContent = P[2];
    page('pSheet'); $('pSheet').scrollTop = 0; face('f_give');
    say('あなたのために、書き留めておきました。\nゆっくり読んでくださいね。');
  }
  $('again').addEventListener('click', function () { clearTimers(); $('stage').hidden = true; $('cover').hidden = false; face('f_base'); });
  $('start').addEventListener('click', function () { $('cover').hidden = true; $('stage').hidden = false; scene1(); });
})();
</script>
</body>
</html>
