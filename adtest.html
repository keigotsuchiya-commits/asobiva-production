/* ASOBIVA の広告カードと同じ作り（v7.0.1） */
.ad-card { text-align: center; overflow: hidden; outline: 1px dashed #ddd; }
.ad-card > * { max-width: 100%; }
.ad-card > .ad-in { display: inline-block; vertical-align: top; max-width: none; }
/* サイズ可変を試す枠：囲みを最初から幅いっぱい・左から置く（AdMax が自分で広がれる） */
.ad-card.wide > .ad-in { display: block; text-align: left; }
.size { font-size: 11px; color: #aaa; margin-top: 4px; text-align: center; }

<script>
function asobivaAdFit() {
  var C = document.querySelectorAll('.ad-card'), i;
  function fit(c) {
    var a = c.querySelector('.ad-in'); if (!a) return;
    var cs = getComputedStyle(c), cw = c.clientWidth - parseFloat(cs.paddingLeft || 0) - parseFloat(cs.paddingRight || 0);
    var w = a.offsetWidth, h = a.offsetHeight, s = (w > cw + 1 && cw > 0) ? cw / w : 1;
    var t = s < 1 ? 'scale(' + s + ')' : '';
    if (a.style.transform === t && a.getAttribute('data-w') === String(w) && a.getAttribute('data-h') === String(h)) return;
    a.setAttribute('data-w', w); a.setAttribute('data-h', h);
    a.style.transformOrigin = '0 0'; a.style.transform = t;
    a.style.marginRight = s < 1 ? (-(w * (1 - s))) + 'px' : '';
    a.style.marginBottom = s < 1 ? (-(h * (1 - s))) + 'px' : '';
  }
  function all() { for (var j = 0; j < C.length; j++) fit(C[j]); }
  if (window.ResizeObserver) { var ro = new ResizeObserver(all); for (i = 0; i < C.length; i++) { ro.observe(C[i]); var a = C[i].querySelector('.ad-in'); if (a) ro.observe(a); } }
  window.addEventListener('resize', all); window.addEventListener('load', all);
  var k = 0, tm = setInterval(function () { all(); if (++k > 20) clearInterval(tm); }, 500);
  all();
}
asobivaAdFit();
// 出ている大きさを表示する（確認用）
(function () {
  function show() {
    var C = document.querySelectorAll('.ad-card');
    for (var i = 0; i < C.length; i++) {
      // 広告の中身（画像・iframe など）が実際に占めている範囲を測る
      var E = C[i].querySelectorAll('.ad-in *'), L = 1e9, T = 1e9, R = -1e9, B = -1e9, s = C[i].nextElementSibling;
      for (var j = 0; j < E.length; j++) {
        if (/^(SCRIPT|STYLE|NOSCRIPT)$/.test(E[j].tagName)) continue;
        var r = E[j].getBoundingClientRect(); if (r.width < 2 || r.height < 2) continue;
        L = Math.min(L, r.left); T = Math.min(T, r.top); R = Math.max(R, r.right); B = Math.max(B, r.bottom);
      }
      if (s) s.textContent = R > L ? Math.round(R - L) + ' × ' + Math.round(B - T) + '（カードの幅 ' + Math.round(C[i].clientWidth) + '）' : '（まだ出ていません）';
    }
  }
  var k = 0, t = setInterval(function () { show(); if (++k > 30) clearInterval(t); }, 500);
  window.addEventListener('resize', show);
})();
</script>
