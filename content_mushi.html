<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>蟲屋Nの昆虫図鑑</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #e0e0e0;
  --white: #ffffff;
  --ink: #1a1a1a;
  --ink-soft: #888;
  --border: #e0e0e0;
}
html, body {
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--bg);
  color: var(--ink);
  min-height: 100vh;
}
.wrap {
  max-width: 480px;
  margin: 0 auto;
  background: var(--bg);
  min-height: 100vh;
}

/* ── SITE HEADER ── */
.site-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 16px;
  background: var(--white);
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  z-index: 100;
}
.back-link {
  font-size: 12px;
  font-weight: 500;
  letter-spacing: 0.04em;
  color: var(--ink-soft);
  text-decoration: none;
}
.admin-btn {
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.06em;
  background: none;
  border: 1px solid var(--border);
  padding: 6px 14px;
  border-radius: 20px;
  cursor: pointer;
  color: var(--ink-soft);
  transition: all 0.15s;
}
.admin-btn.active { background: var(--ink); color: var(--white); border-color: var(--ink); }

/* ── BURGER MENU ── */
.burger-btn {
  background: none;
  border: none;
  cursor: pointer;
  padding: 4px;
  display: flex;
  flex-direction: column;
  gap: 5px;
  align-items: flex-end;
}
.burger-btn span { display: block; height: 1.5px; background: var(--ink); border-radius: 1px; }
.burger-btn span:nth-child(1) { width: 20px; }
.burger-btn span:nth-child(2) { width: 14px; }
.burger-btn span:nth-child(3) { width: 20px; }
.burger-menu {
  display: none;
  position: absolute;
  top: 100%;
  right: 12px;
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: 10px;
  box-shadow: 0 4px 16px rgba(0,0,0,0.1);
  overflow: hidden;
  z-index: 200;
  min-width: 200px;
}
.burger-menu.open { display: block; }
.burger-menu-item {
  display: block;
  width: 100%;
  padding: 14px 20px;
  background: none;
  border: none;
  border-bottom: 1px solid var(--border);
  font-size: 13px;
  font-weight: 500;
  color: var(--ink);
  cursor: pointer;
  text-align: left;
}
.burger-menu-item:last-child { border-bottom: none; }
.burger-menu-divider { height: 1px; background: var(--border); }
.admin-only { display: none; }
body.admin-mode .admin-only { display: block; }

/* ── BANNER ── */
.banner-slot {
  width: 100%;
  position: relative;
  background: var(--white);
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 80px;
}
.banner-slot img { width: 100%; height: auto; display: block; }
.slot-label { font-size: 10px; letter-spacing: 0.12em; color: #ccc; }
.banner-edit {
  display: none;
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0.25);
  align-items: center;
  justify-content: center;
  cursor: pointer;
  z-index: 2;
}
.banner-edit span {
  font-size: 11px;
  font-weight: 600;
  color: #fff;
  background: rgba(0,0,0,0.45);
  padding: 8px 18px;
  border-radius: 20px;
}
body.admin-mode .banner-slot .banner-edit { display: flex; }
.banner-file { display: none; }

/* ── INTRO SECTION ── */
.intro-section {
  position: relative;
  background: var(--white);
  border-bottom: 1px solid var(--border);
}
.intro-content {
  width: 100%;
  min-height: 60px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
}
.intro-content iframe {
  display: block;
  width: 100%;
  border: none;
  background: var(--white);
  min-height: 60px;
  overflow: hidden;
}
.intro-placeholder {
  font-size: 11px;
  color: #ccc;
  letter-spacing: 0.08em;
}
.intro-edit {
  display: none;
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0.2);
  align-items: center;
  justify-content: center;
  cursor: pointer;
  z-index: 2;
}
.intro-edit span {
  font-size: 11px;
  font-weight: 600;
  color: #fff;
  background: rgba(0,0,0,0.45);
  padding: 8px 18px;
  border-radius: 20px;
}
body.admin-mode .intro-section .intro-edit { display: flex; }
.intro-file { display: none; }

/* ── COMMON SECTION (タブ外下) ── */
.common-section {
  background: var(--bg);
}

/* ── MAIN TABS (大カテゴリー) ── */
.main-tab-bar {
  display: flex;
  background: var(--white);
  border-bottom: 1px solid var(--border);
  border-top: 10px solid var(--bg);
}
.main-tab-bar.no-gap { border-top: none; }
.main-tab-bar.line-gap { border-top: 1px solid var(--ink); }
.main-tab-btn {
  flex: 1;
  padding: 12px 4px;
  background: none;
  border: none;
  border-bottom: 2px solid transparent;
  font-size: 11px;
  font-weight: 500;
  color: var(--ink-soft);
  cursor: pointer;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  letter-spacing: 0.02em;
}
.main-tab-btn.active { color: var(--ink); border-bottom-color: var(--ink); font-weight: 700; }

/* ── SUB TABS (サブカテゴリー) ── */
.sub-tab-bar {
  display: flex;
  background: var(--white);
  border-bottom: 1px solid var(--border);
  min-height: 40px;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
}
.sub-tab-bar::-webkit-scrollbar { display: none; }
.sub-tab-btn {
  flex-shrink: 0;
  padding: 10px 14px;
  background: none;
  border: none;
  border-bottom: 2px solid transparent;
  font-size: 11px;
  font-weight: 500;
  color: var(--ink-soft);
  cursor: pointer;
  white-space: nowrap;
  letter-spacing: 0.02em;
}
.sub-tab-btn.active { color: var(--ink); border-bottom-color: var(--ink); font-weight: 700; }

/* 管理モード: タブ編集ボタン */
.tab-edit-bar {
  display: none;
  padding: 8px 12px;
  background: var(--white);
  border-bottom: 1px solid var(--border);
  gap: 8px;
  flex-wrap: wrap;
}
body.admin-mode .tab-edit-bar { display: flex; }
.intro-gap-btn {
  font-size: 11px;
  padding: 5px 12px;
  background: none;
  border: 1px solid var(--border);
  border-radius: 12px;
  color: var(--ink-soft);
  cursor: pointer;
}
.intro-gap-btn:hover { border-color: var(--ink); color: var(--ink); }
.tab-edit-btn {
  font-size: 11px;
  padding: 5px 12px;
  background: none;
  border: 1px solid var(--border);
  border-radius: 12px;
  color: var(--ink-soft);
  cursor: pointer;
}
.tab-edit-btn:hover { border-color: var(--ink); color: var(--ink); }

/* ── CARDS ── */
.card-section { background: var(--bg); padding-top: 10px; }
.card-section.no-gap { background: var(--white); padding-top: 0; }
.card-section.line-gap { background: var(--white); padding-top: 0; border-top: 1px solid var(--ink); }
.card { width: 100%; display: block; text-decoration: none; background: var(--white); overflow: hidden; position: relative; }
.card img { width: 100%; height: auto; display: block; }

/* ── HTML CARD ── */
.html-card { display: block; width: 100%; position: relative; background: var(--white); overflow: hidden; text-decoration: none; }
.html-card iframe { display: block; width: 100%; height: 60px; border: none; background: var(--white); overflow: hidden; }
.html-card-label { display: none; padding: 8px 16px; font-size: 10px; letter-spacing: 0.08em; color: var(--ink-soft); background: var(--white); border-bottom: 1px solid var(--border); }
body.admin-mode .html-card-label { display: block; }

/* ── HTML CAROUSEL ── */
.html-carousel-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 6px 12px;
  background: var(--white);
  border-top: 1px solid var(--border);
  font-size: 11px;
  letter-spacing: 0.08em;
  color: var(--ink-soft);
}
.html-carousel-footer span { font-size: 11px; letter-spacing: 0.08em; color: var(--ink-soft); }
.html-carousel-nav {
  background: none; color: var(--ink); border: none;
  width: 32px; height: 32px; font-size: 20px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  opacity: 0.5; transition: opacity 0.15s;
}
.html-carousel-nav:hover { opacity: 1; }

/* ── IMAGE CAROUSEL ── */
.carousel-card { width: 100%; background: var(--white); overflow: hidden; position: relative; }
.carousel-card img { width: 100%; height: auto; display: block; }
.carousel-footer {
  display: flex; align-items: center; justify-content: space-between;
  padding: 6px 12px; background: var(--white); border-top: 1px solid var(--border);
  font-size: 11px; letter-spacing: 0.08em; color: var(--ink-soft);
}
.carousel-footer span { font-size: 11px; letter-spacing: 0.08em; color: var(--ink-soft); }
.carousel-nav {
  background: none; color: var(--ink); border: none;
  width: 32px; height: 32px; font-size: 20px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  opacity: 0.5; transition: opacity 0.15s;
}
.carousel-nav:hover { opacity: 1; }

/* ── ADMIN CONTROLS ── */
.card-del {
  display: none;
  position: absolute;
  top: 10px; right: 10px;
  width: 30px; height: 30px;
  background: rgba(0,0,0,0.5);
  color: #fff; border: none;
  border-radius: 50%; font-size: 16px;
  cursor: pointer; align-items: center; justify-content: center; z-index: 5;
}
.card-del:hover { background: #c0392b; }
body.admin-mode .card-del { display: flex; }
.card-move {
  display: none;
  position: absolute;
  bottom: 10px; right: 50px;
  flex-direction: row;
  gap: 6px;
  z-index: 5;
}
.card-move button {
  width: 30px; height: 30px;
  background: rgba(0,0,0,0.5);
  color: #fff;
  border: none;
  border-radius: 50%;
  font-size: 14px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.15s;
}
.card-move button:hover { background: #444; }
.card-move button:disabled { opacity: 0.3; cursor: default; }
body.admin-mode .card-move { display: flex; }

.card-replace {
  display: none;
  position: absolute;
  top: 10px; right: 48px;
  width: 30px; height: 30px;
  background: rgba(0,0,0,0.5);
  color: #fff; border: none;
  border-radius: 50%; font-size: 14px;
  cursor: pointer; align-items: center; justify-content: center; z-index: 5;
}
.card-replace:hover { background: #1a6e3c; }
body.admin-mode .card-replace { display: flex; }
.card-replace-input { display: none; }
.card-link-btn {
  display: none;
  position: absolute;
  top: 10px; right: 88px;
  width: 30px; height: 30px;
  background: rgba(0,0,0,0.5);
  color: #fff;
  border: none;
  border-radius: 50%;
  font-size: 13px;
  cursor: pointer;
  align-items: center;
  justify-content: center;
  z-index: 5;
  transition: background 0.15s;
}
.card-link-btn:hover { background: #2266cc; }
.card-link-btn.has-link { background: rgba(34,102,204,0.85); }
body.admin-mode .card-link-btn { display: flex; }
.card-gap-btn {
  display: none;
  position: absolute;
  bottom: 10px; left: 10px;
  height: 28px; padding: 0 10px;
  background: rgba(0,0,0,0.5);
  color: #fff; border: none; border-radius: 14px;
  font-size: 10px; font-weight: 500; letter-spacing: 0.04em;
  cursor: pointer; align-items: center; justify-content: center;
  z-index: 5; transition: background 0.15s; white-space: nowrap;
}
.card-gap-btn:hover { background: rgba(0,0,0,0.75); }
body.admin-mode .card-gap-btn { display: flex; }

/* ── EMPTY STATE ── */
.empty-section { background: var(--bg); padding-top: 10px; }
.empty-state {
  padding: 60px 24px; text-align: center;
  color: var(--ink-soft); font-size: 13px; line-height: 2;
  background: var(--white);
}
.empty-state strong { display: block; font-size: 14px; font-weight: 600; color: var(--ink); margin-bottom: 6px; }

/* ── ADD BUTTON ── */
.add-section { background: var(--bg); padding-top: 10px; }
.add-card-btn {
  display: flex; width: 100%; padding: 22px 16px;
  background: var(--white); border: none; cursor: pointer;
  align-items: center; justify-content: center;
  gap: 8px; font-size: 11px; font-weight: 500;
  letter-spacing: 0.08em; color: var(--ink-soft);
  transition: color 0.15s;
}
.add-card-btn:hover { color: var(--ink); }

/* ── PANEL ── */
.overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 200; }
.overlay.open { display: block; }
.panel {
  position: fixed; bottom: 0; left: 0; right: 0;
  background: var(--white); border-radius: 16px 16px 0 0;
  padding: 28px 20px 48px; z-index: 201;
  transform: translateY(100%);
  transition: transform 0.3s cubic-bezier(0.34,1.2,0.64,1);
  max-width: 480px; margin: 0 auto;
}
.panel.open { transform: translateY(0); }
.panel-handle { width: 36px; height: 4px; background: var(--border); border-radius: 2px; margin: 0 auto 22px; }
.panel-title { font-size: 14px; font-weight: 700; letter-spacing: 0.06em; margin-bottom: 20px; }
.drop-zone {
  border: 1.5px dashed var(--border); border-radius: 12px;
  padding: 28px 16px; text-align: center; cursor: pointer;
  margin-bottom: 16px; transition: border-color 0.15s;
}
.drop-zone:hover { border-color: var(--ink); }
.dz-icon { font-size: 28px; margin-bottom: 8px; }
.dz-label { font-size: 13px; font-weight: 500; color: var(--ink); }
.dz-hint { display: block; font-size: 11px; color: var(--ink-soft); margin-top: 4px; }
.preview-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; margin-bottom: 16px; }
.p-thumb { aspect-ratio: 1; border-radius: 6px; overflow: hidden; position: relative; background: var(--border); display: flex; align-items: center; justify-content: center; }
.p-thumb img { width: 100%; height: 100%; object-fit: cover; }
.p-del { position: absolute; top: 4px; right: 4px; width: 20px; height: 20px; background: rgba(0,0,0,0.6); color: #fff; border: none; border-radius: 50%; font-size: 11px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
.carousel-toggle-wrap { display: none; align-items: center; gap: 10px; margin-bottom: 16px; font-size: 12px; color: var(--ink-soft); }
.field-label { display: block; font-size: 11px; font-weight: 600; letter-spacing: 0.08em; color: var(--ink-soft); margin-bottom: 8px; }
.field-input { width: 100%; font-size: 14px; padding: 12px 14px; border: 1px solid var(--border); border-radius: 10px; outline: none; margin-bottom: 16px; }
.field-input:focus { border-color: var(--ink); }
.btn-add { width: 100%; padding: 16px; background: var(--ink); color: var(--white); border: none; border-radius: 12px; font-size: 14px; font-weight: 600; letter-spacing: 0.06em; cursor: pointer; }
.btn-add:disabled { opacity: 0.3; cursor: default; }

/* ── TAB EDIT PANEL ── */
.tab-panel {
  position: fixed; bottom: 0; left: 0; right: 0;
  background: var(--white); border-radius: 16px 16px 0 0;
  padding: 28px 20px 48px; z-index: 201;
  transform: translateY(100%);
  transition: transform 0.3s cubic-bezier(0.34,1.2,0.64,1);
  max-width: 480px; margin: 0 auto;
}
.tab-panel.open { transform: translateY(0); }
.tab-list-item {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 0; border-bottom: 1px solid var(--border);
}
.tab-list-item input {
  flex: 1; font-size: 13px; padding: 6px 10px;
  border: 1px solid var(--border); border-radius: 8px; outline: none;
}
.tab-list-item input:focus { border-color: var(--ink); }
.tab-del-btn {
  width: 28px; height: 28px; background: none; border: 1px solid var(--border);
  border-radius: 50%; cursor: pointer; color: var(--ink-soft); font-size: 14px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.tab-del-btn:hover { background: #c0392b; color: #fff; border-color: #c0392b; }
.add-tab-btn {
  width: 100%; padding: 12px; background: none; border: 1px dashed var(--border);
  border-radius: 10px; font-size: 12px; color: var(--ink-soft); cursor: pointer; margin-top: 12px;
}
.add-tab-btn:hover { border-color: var(--ink); color: var(--ink); }

/* ── FOOTER ── */
.footer-section { background: var(--bg); padding-top: 10px; }
.footer-section.no-gap { padding-top: 0; }
.footer-section.line-gap { padding-top: 0; background: var(--white); border-top: 1px solid var(--ink); }
.footer-section.dot-gap { padding-top: 0; background: var(--white); border-top: 1px dashed rgba(0,0,0,0.2); }
footer { padding: 16px; text-align: center; font-size: 10px; letter-spacing: 0.1em; color: var(--ink); background: var(--white); }
.footer-edit-btn { display: none; cursor: pointer; background: none; border: none; font-size: 10px; letter-spacing: 0.1em; color: var(--ink-soft); padding: 4px 8px; border-radius: 4px; text-decoration: underline; }
body.admin-mode .footer-edit-btn { display: inline-block; }
.footer-gap-btn { display: none; background: none; border: none; font-size: 10px; color: var(--ink-soft); cursor: pointer; text-decoration: underline; letter-spacing: 0.06em; margin-left: 8px; }
body.admin-mode .footer-gap-btn { display: inline-block; }
.footer-editor-panel {
  position: fixed; bottom: 0; left: 0; right: 0;
  background: var(--white); border-radius: 16px 16px 0 0;
  padding: 28px 20px 48px; z-index: 300;
  transform: translateY(100%);
  transition: transform 0.3s cubic-bezier(0.34,1.2,0.64,1);
  max-width: 480px; margin: 0 auto;
}
.footer-editor-panel.open { transform: translateY(0); }

/* ── LOADING ── */
#loading {
  position: fixed; inset: 0; background: var(--white);
  display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 999;
}
.loading-bar-wrap { width: 120px; height: 2px; background: var(--border); border-radius: 1px; margin-top: 16px; }
.loading-bar { height: 100%; background: var(--ink); border-radius: 1px; width: 0; transition: width 0.3s; }

/* ── NAV EDITOR ── */
.nav-editor-panel {
  position: fixed; bottom: 0; left: 0; right: 0;
  background: var(--white); border-radius: 16px 16px 0 0;
  padding: 28px 20px 48px; z-index: 201;
  transform: translateY(100%);
  transition: transform 0.3s cubic-bezier(0.34,1.2,0.64,1);
  max-width: 480px; margin: 0 auto;
}
.nav-editor-panel.open { transform: translateY(0); }
.nav-item-row { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--border); }
.nav-item-row input { flex: 1; font-size: 12px; padding: 6px 10px; border: 1px solid var(--border); border-radius: 8px; outline: none; }
.nav-del-btn { width: 26px; height: 26px; background: none; border: 1px solid var(--border); border-radius: 50%; cursor: pointer; color: var(--ink-soft); font-size: 12px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.nav-add-btn { width: 100%; padding: 10px; background: none; border: 1px dashed var(--border); border-radius: 10px; font-size: 12px; color: var(--ink-soft); cursor: pointer; margin-top: 10px; }
.nav-save-btn { width: 100%; padding: 14px; background: var(--ink); color: #fff; border: none; border-radius: 12px; font-size: 14px; font-weight: 600; cursor: pointer; margin-top: 14px; }
.nav-link-item { display: block; padding: 14px 20px; border-bottom: 1px solid var(--border); font-size: 13px; font-weight: 500; color: var(--ink); text-decoration: none; }
.nav-link-item:last-child { border-bottom: none; }
</style>
</head>
<body>
<div id="loading">
  <div class="loading-bar-wrap"><div class="loading-bar" id="loadingBar"></div></div>
</div>

<div class="wrap">
  <div class="site-header">
    <a href="asobiva.html" class="back-link">← トップへ戻る</a>
    <div style="position:relative;">
      <button class="burger-btn" id="burgerBtn" onclick="toggleBurgerMenu()">
        <span></span><span></span><span></span>
      </button>
      <div class="burger-menu" id="burgerMenu">
        <div class="burger-menu-divider"></div>
        <button class="burger-menu-item" id="adminBtn" onclick="toggleAdmin()">管理</button>
        <button class="burger-menu-item admin-only" onclick="openNavEditor(); closeBurgerMenu()">メニューを編集</button>
        <button class="burger-menu-item admin-only" onclick="downloadEditHTML(); closeBurgerMenu()">編集用保存</button>
        <button class="burger-menu-item admin-only" id="downloadHtmlBtn" onclick="handleDownloadClick()">公開用保存</button>
        <div class="burger-menu-item admin-only" style="font-size:10px;color:#aaa;text-align:right;padding:8px 20px;cursor:default;border:none;">v2.1</div>
      </div>
    </div>
  </div>

  <div class="banner-slot" id="banner1">
    <span class="slot-label">HEADER</span>
    <div class="banner-edit" onclick="triggerBanner()"><span>画像を設定</span></div>
    <input type="file" class="banner-file" id="bannerFile1" accept="image/*" onchange="onBannerFile(this)">
  </div>

  <!-- 紹介エリア -->
  <div class="intro-section" id="introSection">
    <div class="intro-content" id="introContent">

<script>
// ── DB ────────────────────────────────────────
const DB_NAME = 'asobiva_mushi_v3';
let db = null;

function openDB() {
  return new Promise((res) => {
    try {
      const req = indexedDB.open(DB_NAME, 1);
      req.onupgradeneeded = e => {
        const d = e.target.result;
        if (!d.objectStoreNames.contains('cards'))
          d.createObjectStore('cards', { keyPath: 'id', autoIncrement: true });
        if (!d.objectStoreNames.contains('banners'))
          d.createObjectStore('banners', { keyPath: 'slot' });
        if (!d.objectStoreNames.contains('tabs'))
          d.createObjectStore('tabs', { keyPath: 'key' });
      };
      req.onsuccess = e => { db = e.target.result; res(); };
      req.onerror = () => { db = null; res(); };
    } catch { db = null; res(); }
  });
}

function dbOp(store, mode, fn) {
  return new Promise((res, rej) => {
    if (!db) return res(null);
    try {
      const tx = db.transaction(store, mode);
      const s = tx.objectStore(store);
      const req = fn(s);
      if (req) {
        req.onsuccess = e => res(e.target.result);
        req.onerror = e => rej(e.target.error);
      } else {
        tx.oncomplete = () => res(null);
        tx.onerror = e => rej(e.target.error);
      }
    } catch(err) { rej(err); }
  });
}

// ── State ─────────────────────────────────────
const DEFAULT_MAIN_TABS = [
  { id: 'insecta', label: '昆虫綱' },
  { id: 'arachnida', label: '蛛形綱' },
  { id: 'crustacea', label: '甲殻類・三葉虫型' },
];
const DEFAULT_SUB_TABS = {
  insecta: [
    { id: 'lepidoptera', label: 'チョウ目' },
    { id: 'odonata', label: 'トンボ目' },
    { id: 'diptera', label: 'ハエ目' },
    { id: 'coleoptera', label: 'コウチュウ目' },
    { id: 'hemiptera', label: 'カメムシ目' },
    { id: 'blattodea', label: 'ゴキブリ目' },
  ],
  arachnida: [],
  crustacea: [],
};

let mainTabs = JSON.parse(JSON.stringify(DEFAULT_MAIN_TABS));
let subTabs = JSON.parse(JSON.stringify(DEFAULT_SUB_TABS));
let activeMain = mainTabs[0].id;
let activeSub = null;
let cards = [];
let bannerB64 = null;
let introHTML = null;
let pendingFiles = [];
let adminMode = false;

// ── Init ──────────────────────────────────────
function setLoadingBar(pct) {
  document.getElementById('loadingBar').style.width = pct + '%';
}

async function init() {
  setLoadingBar(10);
  await openDB();
  // 編集用保存データの読み込み
  if (window.__MUSHI_INIT__) {
    const d = window.__MUSHI_INIT__;
    if (d.banners) {
      if (d.banners[1]) { bannerB64 = d.banners[1]; applyBanner(d.banners[1]); }
    }
    if (d.mainTabs) mainTabs = d.mainTabs;
    if (d.subTabs) subTabs = d.subTabs;
    if (d.cards) {
      cards = d.cards;
      // IndexedDBにも保存
      for (const c of cards) {
        try { await dbOp('cards', 'readwrite', s => s.put(c)); } catch {}
      }
    }
    window.__MUSHI_INIT__ = null;
  }

  setLoadingBar(30);

  // Load tabs
  try {
    const mt = await dbOp('tabs', 'readonly', s => s.get('mainTabs'));
    if (mt?.value) mainTabs = mt.value;
    const st = await dbOp('tabs', 'readonly', s => s.get('subTabs'));
    if (st?.value) subTabs = st.value;
  } catch {}

  // Set default activeSub
  activeMain = mainTabs[0]?.id || null;
  const subs = subTabs[activeMain] || [];
  activeSub = subs.length > 0 ? subs[0].id : null;

  // Load banner
  try {
    const row = await dbOp('banners', 'readonly', s => s.get(1));
    if (row?.base64) { bannerB64 = row.base64; applyBanner(row.base64); }
  } catch {}

  // Load intro
  try {
    const row = await dbOp('banners', 'readonly', s => s.get(2));
    if (row?.html) { introHTML = row.html; applyIntro(row.html); }
  } catch {}

  // Load cards
  setLoadingBar(60);
  try {
    const rows = await dbOp('cards', 'readonly', s => s.getAll());
    cards = (rows || []).map(r => ({
      id: r.id,
      type: r.type || (r.base64 ? 'image' : r.htmls ? 'html-carousel' : 'html'),
      html: r.html,
      base64: r.base64,
      images: r.images,
      htmls: r.htmls,
      name: r.name || '',
      link: r.link || '',
      gap: r.gap !== undefined ? r.gap : true,
      mainTab: r.mainTab,
      subTab: r.subTab,
      names: r.names,
      ytId: r.ytId,
      title: r.title || '',
      thumbB64: r.thumbB64 || null,
      musicUrl: r.musicUrl || '',
      artist: r.artist || '',
    }));
  } catch {}

  setLoadingBar(100);
  setTimeout(() => {
    document.getElementById('loading').style.display = 'none';
    renderTabs();
    render();
    renderNavLinks();
    loadFooterText();
    loadFooterGap();
    loadIntroGap();
  }, 200);
}

// ── Tabs ──────────────────────────────────────
function renderTabs() {
  // 大カテゴリー
  const mainBar = document.getElementById('mainTabBar');
  mainBar.innerHTML = '';
  mainTabs.forEach(t => {
    const btn = document.createElement('button');
    btn.className = 'main-tab-btn' + (t.id === activeMain ? ' active' : '');
    btn.textContent = t.label;
    btn.onclick = () => switchMainTab(t.id);
    mainBar.appendChild(btn);
  });

  // サブカテゴリー
  renderSubTabs();
}

function renderSubTabs() {
  const subBar = document.getElementById('subTabBar');
  subBar.innerHTML = '';
  const subs = subTabs[activeMain] || [];

  if (subs.length > 0) {
    subs.forEach(t => {
      const btn = document.createElement('button');
      btn.className = 'sub-tab-btn' + (t.id === activeSub ? ' active' : '');
      btn.textContent = t.label;
      btn.onclick = () => switchSubTab(t.id);
      subBar.appendChild(btn);
    });
  }
  // サブタブがない場合は空白（高さ維持のためmin-heightをCSSで確保済み）

  // サブカテゴリー編集ボタンの表示制御
  const subEditBtn = document.getElementById('subTabEditBtn');
  if (subEditBtn) {
    subEditBtn.textContent = `「${mainTabs.find(t=>t.id===activeMain)?.label}」のサブカテゴリーを編集`;
  }
}

function switchMainTab(id) {
  activeMain = id;
  const subs = subTabs[id] || [];
  activeSub = subs.length > 0 ? subs[0].id : null;
  renderTabs();
  render();
}

function switchSubTab(id) {
  activeSub = id;
  renderSubTabs();
  render();
}

// ── Render ────────────────────────────────────
function isExternalLink(url) {
  if (!url) return false;
  if (!/^https?:\/\//i.test(url)) return false;
  try {
    const host = new URL(url).hostname;
    return !host.endsWith('i-roiro.com');
  } catch (e) {
    return true;
  }
}

function render() {
  const container = document.getElementById('cardContainer');
  container.innerHTML = '';

  // 現在のタブのカードをフィルタ
  const filtered = cards.filter(c => {
    if (c.mainTab !== activeMain) return false;
    const subs = subTabs[activeMain] || [];
    if (subs.length === 0) return true; // サブタブなし
    return c.subTab === activeSub;
  });

  if (filtered.length === 0 && !adminMode) {
    const sec = document.createElement('div');
    sec.className = 'empty-section';
    sec.innerHTML = '<div class="empty-state"><strong>まだカードがありません</strong><br>右上の「管理」から追加できます</div>';
    container.appendChild(sec);
  }

  try {
    filtered.forEach((c, idx) => {
      const sec = document.createElement('div');
      const gapClass = c.gap === false || c.gap === 'nogap' ? ' no-gap' : c.gap === 'line' ? ' line-gap' : c.gap === 'dot' ? ' dot-gap' : '';
      sec.className = 'card-section' + gapClass;

      let wrap, supportsReplace = true;

      if (c.type === 'html-carousel') {
        wrap = document.createElement('div');
        wrap.className = 'carousel-card';
        wrap.dataset.index = '0';

        const iframe = document.createElement('iframe');
        iframe.srcdoc = injectAutoResize(c.htmls[0]);
        iframe.loading = 'lazy';
        iframe.scrolling = 'no';
        iframe.style.cssText = 'width:100%;border:none;height:60px;display:block;overflow:hidden;';
        iframe.sandbox = 'allow-scripts allow-popups allow-forms allow-same-origin';
        iframe.addEventListener('load', function() {
          try {
            const h = iframe.contentDocument.documentElement.scrollHeight || iframe.contentDocument.body.scrollHeight;
            if (h > 0) iframe.style.height = h + 'px';
          } catch(e) {}
          iframe.contentWindow.postMessage({ type: 'asobiva-init' }, '*');
        });
        wrap.appendChild(iframe);

        if (c.htmls.length > 1) {
          const footer = document.createElement('div');
          footer.className = 'html-carousel-footer';
          const prevBtn = document.createElement('button');
          prevBtn.className = 'html-carousel-nav';
          prevBtn.textContent = '‹';
          const count = document.createElement('span');
          count.textContent = `1 / ${c.htmls.length}`;
          const nextBtn = document.createElement('button');
          nextBtn.className = 'html-carousel-nav';
          nextBtn.textContent = '›';
          footer.appendChild(prevBtn);
          footer.appendChild(count);
          footer.appendChild(nextBtn);
          wrap.appendChild(footer);
          prevBtn.addEventListener('click', e => {
            e.preventDefault(); e.stopPropagation();
            let idx = (parseInt(wrap.dataset.index, 10) - 1 + c.htmls.length) % c.htmls.length;
            wrap.dataset.index = String(idx);
            iframe.srcdoc = injectAutoResize(c.htmls[idx]);
            count.textContent = `${idx + 1} / ${c.htmls.length}`;
          });
          nextBtn.addEventListener('click', e => {
            e.preventDefault(); e.stopPropagation();
            let idx = (parseInt(wrap.dataset.index, 10) + 1) % c.htmls.length;
            wrap.dataset.index = String(idx);
            iframe.srcdoc = injectAutoResize(c.htmls[idx]);
            count.textContent = `${idx + 1} / ${c.htmls.length}`;
          });
        }
        supportsReplace = false;

      } else if (c.type === 'carousel') {
        wrap = document.createElement('div');
        wrap.className = 'carousel-card';
        wrap.dataset.index = '0';

        const img = document.createElement('img');
        img.src = c.images[0];
        img.alt = '';
        wrap.appendChild(img);

        if (c.images.length > 1) {
          const footer = document.createElement('div');
          footer.className = 'carousel-footer';
          const prevBtn = document.createElement('button');
          prevBtn.className = 'carousel-nav';
          prevBtn.textContent = '‹';
          const count = document.createElement('span');
          count.textContent = `1 / ${c.images.length}`;
          const nextBtn = document.createElement('button');
          nextBtn.className = 'carousel-nav';
          nextBtn.textContent = '›';
          footer.appendChild(prevBtn);
          footer.appendChild(count);
          footer.appendChild(nextBtn);
          wrap.appendChild(footer);
          prevBtn.addEventListener('click', e => {
            e.preventDefault(); e.stopPropagation();
            let idx = (parseInt(wrap.dataset.index, 10) - 1 + c.images.length) % c.images.length;
            wrap.dataset.index = String(idx);
            img.src = c.images[idx];
            count.textContent = `${idx + 1} / ${c.images.length}`;
          });
          nextBtn.addEventListener('click', e => {
            e.preventDefault(); e.stopPropagation();
            let idx = (parseInt(wrap.dataset.index, 10) + 1) % c.images.length;
            wrap.dataset.index = String(idx);
            img.src = c.images[idx];
            count.textContent = `${idx + 1} / ${c.images.length}`;
          });
        }
        supportsReplace = false;

      } else if (c.type === 'html') {
        wrap = document.createElement('div');
        wrap.className = 'html-card';

        const label = document.createElement('div');
        label.className = 'html-card-label';
        label.textContent = c.name || '(無題)';

        const iframe = document.createElement('iframe');
        iframe.srcdoc = injectAutoResize(c.html);
        iframe.loading = 'lazy';
        iframe.scrolling = 'no';
        iframe.style.cssText = 'width:100%;border:none;height:60px;display:block;overflow:hidden;';
        iframe.sandbox = 'allow-scripts allow-popups allow-forms allow-same-origin';
        iframe.addEventListener('load', function() {
          try {
            const h = iframe.contentDocument.documentElement.scrollHeight || iframe.contentDocument.body.scrollHeight;
            if (h > 0) iframe.style.height = h + 'px';
          } catch(e) {}
          iframe.contentWindow.postMessage({ type: 'asobiva-init' }, '*');
        });
        wrap.appendChild(label);
        wrap.appendChild(iframe);
        if (!adminMode && c.link) {
          const linkOverlay = document.createElement('a');
          linkOverlay.href = c.link;
          if (isExternalLink(c.link)) linkOverlay.target = '_blank';
          linkOverlay.rel = 'noopener';
          linkOverlay.style.cssText = 'position:absolute;inset:0;z-index:4;';
          wrap.appendChild(linkOverlay);
        }

      } else {
        wrap = document.createElement('a');
        wrap.className = 'card';
        wrap.href = adminMode ? '#' : (c.link || '#');
        if (!adminMode && c.link && isExternalLink(c.link)) wrap.target = '_blank';
        wrap.rel = 'noopener';
        const img = document.createElement('img');
        img.src = c.base64;
        img.alt = '';
        img.loading = 'lazy';
        wrap.appendChild(img);
      }

      // Admin controls
      const linkBtn = document.createElement('button');
      linkBtn.className = 'card-link-btn' + (c.link ? ' has-link' : '');
      linkBtn.title = 'リンクを設定';
      linkBtn.textContent = '🔗';
      linkBtn.addEventListener('click', e => {
        e.preventDefault(); e.stopPropagation();
        openLinkEditor(c.id, c.link);
      });
      if (!['html-carousel','carousel'].includes(c.type)) wrap.appendChild(linkBtn);

      const delBtn = document.createElement('button');
      delBtn.className = 'card-del';
      delBtn.textContent = '✕';
      delBtn.addEventListener('click', e => { e.preventDefault(); e.stopPropagation(); deleteCard(c.id); });
    const moveWrap = document.createElement('div');
    moveWrap.className = 'card-move';
    const upBtn = document.createElement('button');
    upBtn.textContent = '↑';
    upBtn.disabled = idx === 0;
    upBtn.addEventListener('click', e => { e.preventDefault(); e.stopPropagation(); moveCard(idx, idx - 1); });
    const downBtn = document.createElement('button');
    downBtn.textContent = '↓';
    downBtn.disabled = idx === cards.length - 1;
    downBtn.addEventListener('click', e => { e.preventDefault(); e.stopPropagation(); moveCard(idx, idx + 1); });
    moveWrap.appendChild(upBtn);
    moveWrap.appendChild(downBtn);
    wrap.appendChild(moveWrap);
      wrap.appendChild(delBtn);

      if (supportsReplace) {
        const replaceInput = document.createElement('input');
        replaceInput.type = 'file';
        replaceInput.accept = c.type === 'html' ? 'text/html,.html' : 'image/*';
        replaceInput.className = 'card-replace-input';
        replaceInput.addEventListener('change', e => { e.preventDefault(); e.stopPropagation(); const f = e.target.files[0]; if (f) replaceCard(c.id, f); });
        const replaceBtn = document.createElement('button');
        replaceBtn.className = 'card-replace';
        replaceBtn.textContent = '⇄';
        replaceBtn.addEventListener('click', e => { e.preventDefault(); e.stopPropagation(); replaceInput.click(); });
        wrap.appendChild(replaceBtn);
        wrap.appendChild(replaceInput);
      }

      const gapBtn = document.createElement('button');
      gapBtn.className = 'card-gap-btn';
      const gapLabels = { true: '隙間あり', false: '隙間なし', nogap: '隙間なし', line: 'ライン', dot: '点線' };
      gapBtn.textContent = gapLabels[c.gap] ?? '隙間あり';
      gapBtn.addEventListener('click', e => { e.preventDefault(); e.stopPropagation(); toggleGap(c.id); });
      wrap.appendChild(gapBtn);

      sec.appendChild(wrap);
      container.appendChild(sec);
    });
  } catch(err) {
    console.error('render error:', err);
  }

  if (adminMode) {
    const addSec = document.createElement('div');
    addSec.className = 'add-section';
    const btn = document.createElement('button');
    btn.className = 'add-card-btn';
    btn.onclick = openPanel;
    btn.innerHTML = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg> カードを追加`;
    addSec.appendChild(btn);
    container.appendChild(addSec);
  }

  // タブ外下エリア
  renderCommon();
}

function renderCommon() {
  const container = document.getElementById('commonSection');
  container.innerHTML = '';
  const commonCards = cards.filter(c => c.mainTab === 'common');

  commonCards.forEach(c => {
    const sec = document.createElement('div');
    const gapClass = c.gap === false || c.gap === 'nogap' ? ' no-gap' : c.gap === 'line' ? ' line-gap' : c.gap === 'dot' ? ' dot-gap' : '';
    sec.className = 'card-section' + gapClass;
    let wrap;
    if (c.type === 'html') {
      wrap = document.createElement('div');
      wrap.className = 'html-card';

// ── Cards ─────────────────────────────────────
function isHtmlFile(f) { return f.type === 'text/html' || f.name.toLowerCase().endsWith('.html'); }

function fileToText(file) {
  return new Promise((res, rej) => {
    const reader = new FileReader();
    reader.onload = e => res(e.target.result);
    reader.onerror = rej;
    reader.readAsText(file);
  });
}

function fileToBase64(file) {
  return new Promise((res, rej) => {
    const reader = new FileReader();
    reader.onload = e => res(e.target.result);
    reader.onerror = rej;
    reader.readAsDataURL(file);
  });
}

function injectAutoResize(html) {
  const script = `<scr` + `ipt>
(function(){
  function report(){ parent.postMessage({ type:'asobiva-resize', height: document.body.offsetHeight }, '*'); }
  window.addEventListener('message', function(e){ if(e.data&&e.data.type==='asobiva-init') report(); });
  window.addEventListener('load', report);
  if(document.readyState==='complete') report();
  if(window.ResizeObserver) new ResizeObserver(report).observe(document.body);
})();
</scr` + `ipt>`;
  return /<\/body>/i.test(html) ? html.replace(/<\/body>/i, script + '</body>') : html + script;
}

window.addEventListener('message', e => {
  if (e.data && e.data.type === 'asobiva-resize') {
    document.querySelectorAll('iframe').forEach(f => {
      try { if (f.contentWindow === e.source) f.style.height = e.data.height + 'px'; } catch {}
    });
  }
});

function onFileSelect(files) {

  const htmlCount = pendingFiles.filter(isHtmlFile).length;
  const toggleWrap = document.getElementById('carouselToggleWrap');
  if ((imgCount >= 2 && htmlCount === 0) || (htmlCount >= 2 && imgCount === 0)) {
    toggleWrap.style.display = 'flex';
  } else {
    toggleWrap.style.display = 'none';
    document.getElementById('carouselToggle').checked = false;
  }
  pendingFiles.forEach((f, i) => {
    const div = document.createElement('div');
    div.className = 'p-thumb';
    if (isHtmlFile(f)) {
      const lbl = document.createElement('div');
      lbl.style.cssText = 'font-size:10px;color:#888;padding:4px;word-break:break-all;text-align:center;';
      lbl.textContent = f.name;
      div.appendChild(lbl);
    } else {
      const url = URL.createObjectURL(f);
      const img = document.createElement('img');
      img.src = url; img.alt = '';
      div.appendChild(img);
    }
    const del = document.createElement('button');
    del.className = 'p-del'; del.textContent = '✕';
    del.onclick = () => { pendingFiles.splice(i, 1); renderPreviews(); };
    div.appendChild(del);
    grid.appendChild(div);

  document.getElementById('addBtn').disabled = pendingFiles.length === 0;
}

      } else {

        cards.push({ id, type: 'carousel', images: images64, link: '', gap: true, mainTab: activeMain, subTab: activeSub });

async function moveCard(fromIdx, toIdx) {
  if (toIdx < 0 || toIdx >= cards.length) return;
  const tmp = cards[fromIdx];
  cards[fromIdx] = cards[toIdx];
  cards[toIdx] = tmp;
  cards.forEach((c, i) => { c.order = i + 1; });
  for (const card of cards) {
    try { await dbOp('cards', 'readwrite', s => s.put({ ...card })); } catch {}
  }
  render();
}

async function deleteCard(id) {
  await dbOp('cards', 'readwrite', s => s.delete(id));
  cards = cards.filter(c => c.id !== id);
  render();
}

async function replaceCard(id, file) {
  const existing = cards.find(c => c.id === id);
  const rec = { ...existing };
  if (isHtmlFile(file)) {
    rec.type = 'html'; rec.html = await fileToText(file); rec.name = file.name;
  } else {
    rec.type = 'image'; rec.base64 = await fileToBase64(file);
  }
  await dbOp('cards', 'readwrite', s => s.put(rec));
  const i = cards.findIndex(c => c.id === id);
  if (i !== -1) cards[i] = rec;
  render();
}

async function toggleGap(id) {
  const c = cards.find(c => c.id === id);
  if (!c) return;
  if (c.gap === true || c.gap === undefined) c.gap = 'line';
  else if (c.gap === 'line') c.gap = 'dot';
  else if (c.gap === 'dot') c.gap = false;
  else c.gap = true;
  await dbOp('cards', 'readwrite', s => s.put({ ...c }));
  render();
}

async function toggleFooterGap() {
  const sec = document.getElementById('footerSection');
  const btn = document.getElementById('footerGapBtn');
  const cur = sec.classList.contains('no-gap') ? 'nogap' : sec.classList.contains('line-gap') ? 'line' : sec.classList.contains('dot-gap') ? 'dot' : 'gap';

  if (next === 'nogap') sec.classList.add('no-gap');
  else if (next === 'line') sec.classList.add('line-gap');
  else if (next === 'dot') sec.classList.add('dot-gap');
  btn.textContent = next === 'gap' ? '隙間あり' : next === 'line' ? 'ライン' : next === 'dot' ? '点線' : '隙間なし';
  await dbOp('banners', 'readwrite', s => s.put({ slot: 98, footerGap: next }));
}

// ── Nav ───────────────────────────────────────
const NAV_KEY = 'asobiva_nav_v1';
function loadNavItems() { try { return JSON.parse(localStorage.getItem(NAV_KEY)) || []; } catch { return []; } }
function saveNavItemsToStorage(items) { localStorage.setItem(NAV_KEY, JSON.stringify(items)); }

function renderNavLinks() {
  const items = loadNavItems();
  const menu = document.getElementById('burgerMenu');
  menu.querySelectorAll('.nav-link-item').forEach(el => el.remove());
  const divider = menu.querySelector('.burger-menu-divider');
  items.forEach(item => {
    const a = document.createElement('a');
    a.className = 'nav-link-item burger-menu-item';
    a.href = item.url; a.textContent = item.label;
    menu.insertBefore(a, divider);
  });
}
function openNavEditor() {
  renderNavEditorList();
  document.getElementById('navEditorOverlay').classList.add('open');
  document.getElementById('navEditorPanel').classList.add('open');
}
function closeNavEditor() {
  document.getElementById('navEditorOverlay').classList.remove('open');
  document.getElementById('navEditorPanel').classList.remove('open');
}
function renderNavEditorList() {
  const items = loadNavItems();
  const list = document.getElementById('navEditorList');
  list.innerHTML = '';
  items.forEach((item, i) => {
    const row = document.createElement('div');
    row.className = 'nav-item-row';
    const labelInput = document.createElement('input');
    labelInput.type = 'text'; labelInput.value = item.label; labelInput.placeholder = '表示名';
    const urlInput = document.createElement('input');
    urlInput.type = 'text'; urlInput.value = item.url; urlInput.placeholder = 'URL';
    const del = document.createElement('button');
    del.className = 'nav-del-btn'; del.textContent = '✕';
    del.onclick = () => { items.splice(i, 1); saveNavItemsToStorage(items); renderNavEditorList(); };
    row.appendChild(labelInput); row.appendChild(urlInput); row.appendChild(del);
    list.appendChild(row);
    labelInput.oninput = () => { items[i].label = labelInput.value; };
    urlInput.oninput = () => { items[i].url = urlInput.value; };
  });
}
function addNavItem() {
  const items = loadNavItems();
  items.push({ label: '', url: '' });
  saveNavItemsToStorage(items);
  renderNavEditorList();
}
function saveNavItems() {
  const rows = document.getElementById('navEditorList').querySelectorAll('.nav-item-row');
  const items = [];
  rows.forEach(row => {
    const inputs = row.querySelectorAll('input');
    if (inputs[0].value.trim()) items.push({ label: inputs[0].value.trim(), url: inputs[1].value.trim() });
  });
  saveNavItemsToStorage(items);
  renderNavLinks();
  closeNavEditor();
}

// ── Compress & Download ───────────────────────
function compressImage(base64) {
  return new Promise((res) => {
    const img = new Image();
    img.onload = () => {
      const MAX_W = 1200;
      let w = img.width, h = img.height;
      if (w > MAX_W) { h = Math.round(h * (MAX_W / w)); w = MAX_W; }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      const isPng = base64.startsWith('data:image/png');
      res(canvas.toDataURL(isPng ? 'image/png' : 'image/jpeg', isPng ? undefined : 0.8));
    };
    img.onerror = () => res(base64);
    img.src = base64;
  });
}

async function handleDownloadClick() {
  const btn = document.getElementById('downloadHtmlBtn');
  const orig = btn.textContent;
  btn.textContent = '圧縮中…';

    ? `    <div class="banner-slot"><img src="${await compressImage(bannerB64)}" alt=""></div>\n`

  // 全カードを圧縮してタブ別に整理
  async function buildCardHTML(c) {
    const gapClass = c.gap === false || c.gap === 'nogap' ? ' no-gap' : c.gap === 'line' ? ' line-gap' : c.gap === 'dot' ? ' dot-gap' : '';
    if (c.type === 'image') {
      const b = await compressImage(c.base64);
      const tag = c.link ? `<a class="card" href="${c.link}"${isExternalLink(c.link) ? ' target="_blank" rel="noopener"' : ''}><img src="${b}" alt=""></a>` : `<div class="card"><img src="${b}" alt=""></div>`;
      return `  <div class="card-section${gapClass}">${tag}</div>\n`;
    } else if (c.type === 'carousel') {
      const imgs = [];
      for (const im of c.images) imgs.push(await compressImage(im));
      const imgsJson = JSON.stringify(imgs).replace(/"/g, '&quot;');
      return `  <div class="card-section${gapClass}"><div class="carousel-card" data-index="0"><img src="${imgs[0]}" alt="">${imgs.length > 1 ? `<div class="carousel-footer"><button class="carousel-nav" onclick="carouselNav(this,-1)">&#8249;</button><span>1 / ${imgs.length}</span><button class="carousel-nav" onclick="carouselNav(this,1)">&#8250;</button></div>` : ''}</div></div>\n`;
    } else if (c.type === 'html-carousel') {
      const escaped = injectAutoResize(c.htmls[0]).replace(/"/g, '&quot;');
      return `  <div class="card-section${gapClass}"><div class="html-card"><iframe srcdoc="${escaped}" loading="lazy" sandbox="allow-scripts allow-popups allow-forms allow-same-origin" style="height:60px" scrolling="no" onload="try{var h=this.contentDocument.documentElement.scrollHeight||this.contentDocument.body.scrollHeight;if(h>0)this.style.height=h+'px';}catch(e){}"></iframe></div></div>\n`;
    } else {
      const escaped = injectAutoResize(c.html).replace(/"/g, '&quot;');
      const linkOverlay = c.link ? `<a href="${c.link}"${isExternalLink(c.link) ? ' target="_blank" rel="noopener"' : ''} style="position:absolute;inset:0;z-index:4;"></a>` : '';
      return `  <div class="card-section${gapClass}"><div class="html-card"><iframe srcdoc="${escaped}" loading="lazy" sandbox="allow-scripts allow-popups allow-forms allow-same-origin" style="height:60px" scrolling="no" onload="try{var h=this.contentDocument.documentElement.scrollHeight||this.contentDocument.body.scrollHeight;if(h>0)this.style.height=h+'px';}catch(e){}"></iframe>${linkOverlay}</div></div>\n`;
    }
  }

  // タブHTML生成
  const mainTabBtns = mainTabs.map((t, i) => `<button class="main-tab-btn${i===0?' active':''}" data-main="${t.id}" onclick="switchMain('${t.id}')">${t.label}</button>`).join('');

  let tabContentsHTML = '';
  for (const mt of mainTabs) {
    const subs = subTabs[mt.id] || [];
    const subBtns = subs.map((s, i) => `<button class="sub-tab-btn${i===0?' active':''}" data-sub="${s.id}" onclick="switchSub('${s.id}')">${s.label}</button>`).join('');

    if (subs.length === 0) {
      // サブタブなし
      const filtered = cards.filter(c => c.mainTab === mt.id);
      let cardsHTML = '';
      for (const c of filtered) cardsHTML += await buildCardHTML(c);
      tabContentsHTML += `<div class="main-content" data-main="${mt.id}">\n<div class="sub-tab-bar" style="min-height:40px;"></div>\n${cardsHTML || '<div class="empty-state">まだカードがありません</div>'}</div>\n`;
    } else {
      let subContents = `<div class="sub-tab-bar">${subBtns}</div>\n`;
      for (const s of subs) {

        for (const c of filtered) cardsHTML += await buildCardHTML(c);
        subContents += `<div class="sub-content" data-sub="${s.id}"${subs[0].id !== s.id ? ' style="display:none;"' : ''}>\n${cardsHTML || '<div class="empty-state">まだカードがありません</div>'}</div>\n`;
      }
      tabContentsHTML += `<div class="main-content" data-main="${mt.id}"${mainTabs[0].id !== mt.id ? ' style="display:none;"' : ''}>\n${subContents}</div>\n`;
    }
  }

  const footerText = document.getElementById('footerText')?.textContent || 'ASOBIVA — i.roiro';
