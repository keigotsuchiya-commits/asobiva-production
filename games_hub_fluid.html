<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ASOBIVA — GAMES</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #e0e0e0;
  --white: #ffffff;
  --ink: #1a1a1a;
  --ink-soft: #888;
  --border: #e0e0e0;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--bg);
  color: var(--ink);
  min-height: 100vh;
}

.wrap {
  max-width: 480px;
  margin: 0 auto;
  background: var(--bg);
  min-height: 100vh;
}

/* ── ADMIN BUTTON ── */
/* ── SITE HEADER (back + burger) ── */
.site-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 16px;
  background: var(--white);
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  z-index: 100;
}
.back-link {
  font-size: 12px;
  font-weight: 500;
  letter-spacing: 0.04em;
  color: var(--ink-soft);
  text-decoration: none;
  transition: color 0.15s;
}
.back-link:hover { color: var(--ink); }
.burger-btn {
  background: none;
  border: none;
  cursor: pointer;
  padding: 4px;
  display: flex;
  flex-direction: column;
  gap: 5px;
  align-items: flex-end;
}
.burger-btn span {
  display: block;
  height: 1.5px;
  background: var(--ink);
  border-radius: 1px;
  transition: width 0.15s;
}
.burger-btn span:nth-child(1) { width: 20px; }
.burger-btn span:nth-child(2) { width: 14px; }
.burger-btn span:nth-child(3) { width: 20px; }
.burger-btn:hover span { width: 20px; }
.burger-menu {
  display: none;
  position: absolute;
  top: 100%;
  right: 0;
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: 10px;
  box-shadow: 0 4px 16px rgba(0,0,0,0.1);
  overflow: hidden;
  z-index: 200;
  min-width: 200px;
}
.burger-menu.open { display: block; }
.burger-menu-item {
  display: block;
  width: 100%;
  padding: 14px 20px;
  background: none;
  border: none;
  border-bottom: 1px solid var(--border);
  font-size: 13px;
  font-weight: 500;
  color: var(--ink);
  cursor: pointer;
  text-align: left;
  font-family: inherit;
  transition: background 0.15s;
}
.burger-menu-item:last-child { border-bottom: none; }
.burger-menu-item:hover { background: var(--bg); }
.burger-menu-item.active { color: var(--white); background: var(--ink); }

.admin-only { display: none; }
body.admin-mode .admin-only { display: block; }

.burger-menu-divider {
  height: 1px;
  background: var(--border);
  margin: 4px 0;
}

.nav-link-item {
  display: block;
  width: 100%;
  padding: 14px 20px;
  background: none;
  border: none;
  border-bottom: 1px solid var(--border);
  font-size: 13px;
  font-weight: 500;
  color: var(--ink);
  cursor: pointer;
  text-align: left;
  text-decoration: none;
  transition: background 0.15s;
}
.nav-link-item:hover { background: var(--bg); }

.nav-editor-panel {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  background: var(--white);
  border-radius: 16px 16px 0 0;
  padding: 28px 20px 48px;
  z-index: 300;
  transform: translateY(100%);
  transition: transform 0.3s cubic-bezier(0.34,1.2,0.64,1);
  max-width: 480px;
  margin: 0 auto;
  max-height: 80vh;
  overflow-y: auto;
}
.nav-editor-panel.open { transform: translateY(0); }
.nav-editor-list { margin-bottom: 16px; }
.nav-editor-row {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 0;
  border-bottom: 1px solid var(--border);
}
.nav-editor-row-label { flex:1; font-size:13px; color:var(--ink); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.nav-editor-row-url { font-size:10px; color:var(--ink-soft); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:120px; }
.nav-editor-btn { background:none; border:1px solid var(--border); border-radius:6px; padding:4px 8px; font-size:11px; cursor:pointer; color:var(--ink-soft); white-space:nowrap; }
.nav-editor-btn:hover { border-color:var(--ink); color:var(--ink); }
.nav-editor-btn.del { border-color:transparent; color:#c0392b; }
.nav-editor-btn.del:hover { background:#fdf0f0; }

/* ── HEADER PAIR ── */
.header-pair {
  display: flex;
  flex-direction: column;
  background: var(--white);
}

.banner-slot {
  width: 100%;
  position: relative;
  background: var(--white);
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 80px;
}
.banner-slot img {
  width: 100%;
  height: auto;
  display: block;
}
.slot-label {
  font-size: 10px;
  letter-spacing: 0.12em;
  color: #ccc;
  user-select: none;
}

.banner-edit {
  display: none;
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0.25);
  align-items: center;
  justify-content: center;
  cursor: pointer;
  z-index: 2;
}
.banner-edit span {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.1em;
  color: #fff;
  background: rgba(0,0,0,0.45);
  padding: 8px 18px;
  border-radius: 20px;
  border: 1px solid rgba(255,255,255,0.4);
  pointer-events: none;
}
body.admin-mode .banner-slot .banner-edit { display: flex; }
.banner-file { display: none; }

/* ── CARDS (image / html, same as other ASOBIVA pages) ── */
.card-section {
  background: var(--bg);
  padding-top: 10px;
}
.card-section.no-gap {
  background: var(--white);
  padding-top: 0;
}
.card-section.dot-gap {
  background: var(--white);
  padding-top: 0;
  border-top: 1px dashed rgba(0,0,0,0.2);
}
.card-gap-btn {
  display: none;
  position: absolute;
  bottom: 10px; left: 10px;
  height: 28px;
  padding: 0 10px;
  background: rgba(0,0,0,0.5);
  color: #fff;
  border: none;
  border-radius: 14px;
  font-size: 10px;
  font-weight: 500;
  letter-spacing: 0.04em;
  cursor: pointer;
  align-items: center;
  justify-content: center;
  z-index: 5;
  transition: background 0.15s;
  white-space: nowrap;
}
.card-gap-btn:hover { background: rgba(0,0,0,0.75); }
body.admin-mode .card-gap-btn { display: flex; }
.card {
  width: 100%;
  position: relative;
  display: block;
  text-decoration: none;
  background: var(--white);
  overflow: hidden;
}
.card img {
  width: 100%;
  height: auto;
  display: block;
  transition: transform 0.35s ease;
}
.card:hover img { transform: scale(1.015); }
body.admin-mode .card:hover img { transform: none; }

/* ── HTML CARD ── */
.html-card {
  display: block;
  text-decoration: none;
  width: 100%;
  position: relative;
  background: var(--white);
  overflow: hidden;
}
.html-card iframe {
  display: block;
  width: 100%;
  height: 60px;
  border: none;
  background: var(--white);
}
.html-card-label {
  display: none;
  padding: 8px 16px;
  font-size: 10px;
  letter-spacing: 0.08em;
  color: var(--ink-soft);
  background: var(--white);
  border-bottom: 1px solid var(--border);
}
body.admin-mode .html-card-label { display: block; }

/* ── CAROUSEL CARD ── */
.carousel-card {
  width: 100%;
  position: relative;
  background: var(--white);
  overflow: hidden;
  cursor: pointer;
}
.carousel-card img {
  width: 100%;
  height: auto;
  display: block;
}
.carousel-dots {
  position: absolute;
  bottom: 10px;
  left: 0; right: 0;
  display: flex;
  justify-content: center;
  gap: 6px;
  pointer-events: none;
}
.carousel-dots span {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: rgba(255,255,255,0.55);
  transition: background 0.2s, transform 0.2s;
}
.carousel-dots span.active {
  background: #fff;
  transform: scale(1.25);
}
.carousel-count {
  position: absolute;
  top: 10px; right: 10px;
  font-size: 10px;
  letter-spacing: 0.05em;
  color: #fff;
  background: rgba(0,0,0,0.45);
  padding: 3px 8px;
  border-radius: 20px;
  pointer-events: none;
}

/* ── GAME CARD (square corners, no text, demo preview only) ── */
.game-card {
  width: 100%;
  position: relative;
  background: #ffffff;
  overflow: hidden;
  border-radius: 0;
}
.game-card-frame-wrap {
  width: 100%;
  background: #ffffff;
  position: relative;
  overflow: hidden;
  line-height: 0; /* avoid extra inline-level whitespace gap below the iframe */
}
.game-card-frame-wrap iframe {
  display: block;
  border: none;
  pointer-events: none !important;
  /* iframe is always rendered at its native CARD_ASPECT_W x CARD_ASPECT_H
     size, then scaled down via CSS transform to fit the card's actual
     display width. This keeps the GW games' internal fixed-size layout
     (no reflow at odd widths) and just shrinks the whole rendered frame
     like a thumbnail. transform-origin/scale are set inline via JS. */
}
.game-card-tap {
  position: absolute;
  inset: 0;
  z-index: 3;
  cursor: pointer;
  pointer-events: auto !important;
}

/* ── DEL / REPLACE BUTTONS (shared by all card types) ── */
.card-del {
  display: none;
  position: absolute;
  top: 10px; right: 10px;
  width: 30px; height: 30px;
  background: rgba(0,0,0,0.5);
  color: #fff;
  border: none;
  border-radius: 50%;
  font-size: 13px;
  cursor: pointer;
  align-items: center;
  justify-content: center;
  z-index: 5;
  transition: background 0.15s;
}
.card-del:hover { background: #c0392b; }
body.admin-mode .card-del { display: flex; }
.card-move {
  display: none;
  position: absolute;
  bottom: 10px; right: 50px;
  flex-direction: row;
  gap: 6px;
  z-index: 5;
}
.card-move button {
  width: 30px; height: 30px;
  background: rgba(0,0,0,0.5);
  color: #fff;
  border: none;
  border-radius: 50%;
  font-size: 14px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.15s;
}
.card-move button:hover { background: #444; }
.card-move button:disabled { opacity: 0.3; cursor: default; }
body.admin-mode .card-move { display: flex; }


.card-replace {
  display: none;
  position: absolute;
  top: 10px; right: 50px;
  width: 30px; height: 30px;
  background: rgba(0,0,0,0.5);
  color: #fff;
  border: none;
  border-radius: 50%;
  font-size: 14px;
  cursor: pointer;
  align-items: center;
  justify-content: center;
  z-index: 5;
  transition: background 0.15s;
}
.card-replace:hover { background: #1a6e3c; }
body.admin-mode .card-replace { display: flex; }

.card-replace-input { display: none; }

/* ── LINK EDIT BUTTON ── */
.card-link-btn {
  display: none;
  position: absolute;
  top: 10px; right: 90px;
  width: 30px; height: 30px;
  background: rgba(0,0,0,0.5);
  color: #fff;
  border: none;
  border-radius: 50%;
  font-size: 13px;
  cursor: pointer;
  align-items: center;
  justify-content: center;
  z-index: 5;
  transition: background 0.15s;
}
.card-link-btn:hover { background: #2266cc; }
.card-link-btn.has-link { background: rgba(34,102,204,0.85); }
body.admin-mode .card-link-btn { display: flex; }

/* ── ADD BUTTON ── */
.add-section {
  background: var(--bg);
  padding-top: 10px;
}
.add-card-btn {
  display: flex;
  width: 100%;
  padding: 22px 16px;
  background: var(--white);
  border: none;
  cursor: pointer;
  align-items: center;
  justify-content: center;
  gap: 8px;
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.1em;
  color: var(--ink-soft);
  transition: background 0.15s, color 0.15s;
}
.add-card-btn:hover { background: #f5f5f5; color: var(--ink); }

/* ── GAME CAROUSEL ── */
.game-carousel-card {
  width: 100%;
  background: var(--white);
  overflow: hidden;
  position: relative;
}
.game-carousel-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 6px 12px;
  background: var(--white);
  border-top: 1px solid var(--border);
  font-size: 11px;
  letter-spacing: 0.08em;
  color: var(--ink-soft);
}
.game-carousel-footer .game-carousel-title {
  font-size: 11px;
  font-weight: 500;
  color: var(--ink);
  letter-spacing: 0.04em;
  flex: 1;
  text-align: center;
}
.game-carousel-nav {
  background: none;
  color: var(--ink);
  border: none;
  width: 32px;
  height: 32px;
  font-size: 20px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0.5;
}
.game-carousel-nav:hover { opacity: 1; }

/* ── EMPTY STATE ── */
.empty-section {
  background: var(--bg);
  padding-top: 10px;
}
.empty-state {
  padding: 60px 24px;
  text-align: center;
  color: var(--ink-soft);
  font-size: 13px;
  line-height: 2;
  background: var(--white);
}
.empty-state strong {
  display: block;
  font-size: 14px;
  font-weight: 600;
  color: var(--ink);
  margin-bottom: 6px;
}

/* ── FOOTER ── */
.footer-section {
  background: var(--bg);
  padding-top: 10px;
}
.footer-section.no-gap {
  padding-top: 0;
}
.footer-section.line-gap {
  padding-top: 0;
  background: var(--white);
  border-top: 1px solid var(--ink);
}
.footer-section.dot-gap {
  padding-top: 0;
  background: var(--white);
  border-top: 1px dashed rgba(0,0,0,0.2);
}
.footer-gap-btn {
  display: none;
  background: none;
  border: none;
  font-size: 10px;
  color: var(--ink-soft);
  cursor: pointer;
  text-decoration: underline;
  letter-spacing: 0.06em;
  margin-left: 8px;
}
body.admin-mode .footer-gap-btn { display: inline-block; }
footer {
  padding: 16px;
  text-align: center;
  font-size: 10px;
  letter-spacing: 0.1em;
  color: var(--ink);
  background: var(--white);
}

/* ── PANEL ── */
.overlay {
  display: none;
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.28);
  z-index: 200;
  backdrop-filter: blur(2px);
}
.overlay.open { display: block; }

.panel {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  background: var(--white);
  border-radius: 16px 16px 0 0;
  padding: 28px 20px 48px;
  z-index: 201;
  transform: translateY(100%);
  transition: transform 0.3s cubic-bezier(0.34,1.2,0.64,1);
  max-width: 480px;
  margin: 0 auto;
}
.panel.open { transform: translateY(0); }

.panel-handle {
  width: 36px; height: 4px;
  background: var(--border); border-radius: 2px;
  margin: 0 auto 22px;
}
.panel-title {
  font-size: 14px; font-weight: 600;
  letter-spacing: 0.06em; margin-bottom: 18px; color: var(--ink);
}

.drop-zone {
  border: 2px dashed var(--border); border-radius: 10px;
  padding: 26px 16px; text-align: center; cursor: pointer;
  transition: border-color 0.15s, background 0.15s;
  margin-bottom: 12px; background: #fafafa; position: relative;
}
.drop-zone:hover, .drop-zone.drag-over { border-color: var(--ink); background: #f0f0f0; }
.drop-zone input[type=file] {
  position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%;
}
.dz-icon { font-size: 24px; margin-bottom: 6px; }
.dz-label { font-size: 12px; font-weight: 500; color: var(--ink); display: block; margin-bottom: 4px; }
.dz-hint { font-size: 11px; color: var(--ink-soft); }

.preview-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(70px, 1fr)); gap: 6px; margin-bottom: 14px;
}
.p-thumb { aspect-ratio: 1; border-radius: 6px; overflow: hidden; position: relative; background: var(--border); }
.p-thumb img { width: 100%; height: 100%; object-fit: cover; }
.p-thumb-file {
  aspect-ratio: 1;
  display: flex;
  align-items: center;
  padding: 8px 22px 8px 8px;
  font-size: 9px;
  color: var(--ink);
  word-break: break-all;
  line-height: 1.4;
  background: #f0ede6;
}
.p-thumb-name { display: block; }
.p-del {
  position: absolute; top: 3px; right: 3px;
  width: 18px; height: 18px; background: rgba(0,0,0,0.5); color: #fff;
  border: none; border-radius: 50%; font-size: 9px;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
}

.field-label {
  font-size: 11px; font-weight: 400; color: var(--ink-soft);
  letter-spacing: 0.06em; margin-bottom: 6px; display: block;
}
.field-input {
  width: 100%; font-size: 14px; padding: 12px 14px;
  border: 1px solid var(--border); border-radius: 8px;
  background: #fafafa; color: var(--ink); outline: none;
  transition: border-color 0.15s; margin-bottom: 16px;
}
.field-input:focus { border-color: var(--ink); }
.field-input::placeholder { color: var(--ink-soft); font-size: 13px; }

.carousel-toggle {
  display: flex; align-items: center; gap: 8px;
  font-size: 12px; color: var(--ink);
  padding: 10px 4px; margin-bottom: 6px;
  cursor: pointer;
}
.carousel-toggle input { width: 16px; height: 16px; flex-shrink: 0; }

.btn-add {
  width: 100%; padding: 15px;
  background: var(--ink); color: var(--white);
  border: none; border-radius: 10px;
  font-size: 14px; font-weight: 600; letter-spacing: 0.06em;
  cursor: pointer; transition: opacity 0.15s;
}
.btn-add:hover { opacity: 0.8; }
.btn-add:disabled { opacity: 0.28; cursor: default; }

/* ── LOADING ── */
#loading {
  position: fixed; inset: 0; background: var(--bg);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  z-index: 999; gap: 12px;
}
.loading-text {
  font-size: 11px; letter-spacing: 0.1em; color: #aaa;
}
.loading-bar-wrap {
  width: 120px; height: 3px;
  background: #e0e0e0; border-radius: 2px; overflow: hidden;
}
.loading-bar {
  height: 100%; width: 0%;
  background: var(--ink); border-radius: 2px;
  transition: width 0.3s ease;
}

/* ── FULLSCREEN GAME OVERLAY ── */
.fullscreen-overlay {
  position: fixed;
  inset: 0;
  background: #0a0a12;
  z-index: 500;
  display: none;
  flex-direction: column;
}
.fullscreen-overlay.open { display: flex; }

.fullscreen-topbar {
  flex-shrink: 0;
  display: flex;
  justify-content: flex-end;
  padding: 10px 12px;
  padding-top: max(10px, env(safe-area-inset-top));
  background: #0a0a12;
  position: relative;
  z-index: 20;
}

.close-btn {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  border: 1px solid rgba(255,255,255,0.25);
  background: rgba(255,255,255,0.06);
  color: #fff;
  font-size: 16px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}
.close-btn:active {
  background: rgba(255,255,255,0.18);
}

.fullscreen-frame-wrap {
  flex: 1;
  min-height: 0;
  display: flex;
  align-items: center;
  justify-content: center;
}

.fullscreen-frame-wrap iframe {
  border: none;
  background: #0a0a12;
}

/* ── TAP TO START prompt shown over the fullscreen demo until the player taps ──
   positioned below the topbar (not inset:0 on the whole overlay), so the
   close (✕) button stays clickable even while this prompt is showing */
.tap-to-start {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 10;
  display: none;
  align-items: center;
  justify-content: center;
  background: rgba(10,10,18,0.35);
  cursor: pointer;
}
.tap-to-start.show { display: flex; }

.tap-to-start-circle {
  width: 132px;
  height: 132px;
  border-radius: 50%;
  border: 2px solid #39ff7a;
  background: rgba(10,10,18,0.85);
  color: #39ff7a;
  font-size: 15px;
  font-weight: 700;
  letter-spacing: 0.08em;
  line-height: 1.5;
  text-align: center;
  display: flex;
  align-items: center;
  justify-content: center;
  text-shadow: 0 0 8px #39ff7a;
  box-shadow: 0 0 22px rgba(57,255,122,0.35);
  animation: pulseRing 1.6s ease-in-out infinite;
}

@keyframes pulseRing {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.06); }
}

@media (prefers-reduced-motion: reduce) {
  .card img, .panel { transition: none; }
}

/* ── FOOTER EDIT ── */
.footer-edit-btn {
  display: none;
  cursor: pointer;
  background: none;
  border: none;
  font-size: 10px;
  letter-spacing: 0.1em;

<script>
// Used for: (1) the fixed preview-card aspect ratio in the card list, and
// (2) the initial iframe size for the static download snapshot's markup
// (a real value is needed there since it has no live JS measurement pass
// before first paint), and (3) fullscreen play, so the game is always
// shown at the same aspect ratio regardless of device screen height.
const CARD_ASPECT_W = 320;
const CARD_ASPECT_H = 591;
const GAME_CONTENT_HEIGHT = 586; // invader/breakerの実寸(5ゲーム中もっとも一般的な高さ)。幅に関わらずこの高さで固定する。

// ── IndexedDB (Base64ストレージ) ──────────────
const DB_NAME = 'asobiva_games_b64_fluid';
let db;

function openDB() {
  return new Promise((res) => {
    try {
      const req = indexedDB.open(DB_NAME, 1);
      req.onupgradeneeded = e => {
        const d = e.target.result;
        if (!d.objectStoreNames.contains('cards'))
          d.createObjectStore('cards', { keyPath: 'id', autoIncrement: true });
        if (!d.objectStoreNames.contains('banners'))
          d.createObjectStore('banners', { keyPath: 'slot' });
      };
      req.onsuccess = e => {
        db = e.target.result;
        // 長時間放置などで接続が切れた場合、次回のdbOpで再接続させる
        db.onclose = () => { db = null; };
        db.onversionchange = () => { try { db.close(); } catch {} db = null; };
        res();
      };
      req.onerror = () => { db = null; res(); };
    } catch (err) {
      db = null;
      res();
    }
  });
}

async function dbOp(store, mode, fn) {
  if (!db) {
    await openDB();
  }
  if (!db) {
    return mode === 'readonly' && store === 'cards' ? [] : undefined;
  }
  try {
    return await new Promise((res, rej) => {
      const req = fn(db.transaction(store, mode).objectStore(store));
      req.onsuccess = e => res(e.target.result);
      req.onerror = e => rej(e);
    });
  } catch (err) {
    // 接続が切れていた場合、再接続して1回だけリトライ
    db = null;
    await openDB();
    if (!db) {
      return mode === 'readonly' && store === 'cards' ? [] : undefined;
    }
    return new Promise((res, rej) => {
      const req = fn(db.transaction(store, mode).objectStore(store));
      req.onsuccess = e => res(e.target.result);
      req.onerror = e => rej(e);
    });
  }
}

// ── ファイル → Base64 / テキスト変換 ──────────
function fileToBase64(file) {
  return new Promise((res, rej) => {
    const reader = new FileReader();
    reader.onload = e => res(e.target.result);
    reader.onerror = rej;
    reader.readAsDataURL(file);
  });
}
function fileToText(file) {
  return new Promise((res, rej) => {
    const reader = new FileReader();
    reader.onload = e => res(e.target.result);
    reader.onerror = rej;
    reader.readAsText(file, 'UTF-8');
  });
}

// ── HTML種別の判定: ゲーム用HTML か 通常HTML か ──
// ゲーム本体には目印として window.ASOBIVA_GAME = true; を含める想定。
// 含まれていない通常のHTML（記事・ツール等）は従来通りの html-card として扱う。
function isGameHtml(html) {
  return /ASOBIVA_GAME\s*=\s*true/.test(html) || /id=["']demoBadge["']/.test(html);
}

// ── iframe高さ自動調整（通常HTMLカード用） ─────
function injectAutoResize(html) {
  const script = `
<scr` + `ipt>
(function(){
  function reportHeight(){
    var h = document.body.offsetHeight;
    parent.postMessage({ type: 'asobiva-resize', height: h }, '*');
  }
  window.addEventListener('message', function(e){
    if (e.data && e.data.type === 'asobiva-init') reportHeight();
  });
  window.addEventListener('load', reportHeight);
  if (document.readyState === 'complete') reportHeight();
  window.addEventListener('resize', reportHeight);
  if (window.ResizeObserver) {
    new ResizeObserver(reportHeight).observe(document.body);
  }
})();
</scr` + `ipt>`;
  if (/<\/body>/i.test(html)) {
    return html.replace(/<\/body>/i, script + '</body>');
  }
  return html + script;
}

// ── iframeリサイズメッセージ受信（通常HTMLカード用） ──
window.addEventListener('message', e => {
  if (e.data && e.data.type === 'asobiva-resize') {
    document.querySelectorAll('.html-card iframe').forEach(f => {
      if (f.contentWindow === e.source) {
        f.style.height = e.data.height + 'px';
      }
    });
  }
});

// ── State ─────────────────────────────────────
let cards = [];       // [{ id, type: 'image'|'html'|'carousel'|'game', html?, base64?, images?, name?, link }]
let banners = { 1: null };
let pendingFiles = [];
let adminMode = false;

// ── Init ──────────────────────────────────────
async function init() {
  try {
    setLoadingBar(10);
    await openDB();

  // 編集用保存データの読み込み
  if (window.__GAMES_INIT__) {
    const d = window.__GAMES_INIT__;
    if (d.banners) {
      for (const [slot, val] of Object.entries(d.banners)) {
        if (val) { try { await dbOp('banners', 'readwrite', s => s.put({ slot: parseInt(slot), base64: val })); } catch {} }
      }
    }
    if (d.cards && d.cards.length > 0) {
      cards = d.cards;
      for (const c of cards) {
        try { await dbOp('cards', 'readwrite', s => s.put(c)); } catch {}
      }
    }
    if (d.navItems) {
      try { saveNavItems(d.navItems); } catch {}
    }
    window.__GAMES_INIT__ = null;
  }
    setLoadingBar(30);

    try {
      const row = await dbOp('banners', 'readonly', s => s.get(1));
      if (row?.base64) { banners[1] = row.base64; applyBanner(1, row.base64); }
    } catch {}
    setLoadingBar(60);

    const rows = await dbOp('cards', 'readonly', s => s.getAll());
    cards = (rows || []).map(r => ({
      id: r.id,
      type: r.type || 'html',
      html: r.html,
      base64: r.base64,
      images: r.images,
      name: r.name || '',
      link: r.link || '',
      gap: r.gap !== false,
      htmls: r.htmls,
      names: r.names,
      ytId: r.ytId,
      title: r.title || '',
      thumbB64: r.thumbB64 || null,
      musicUrl: r.musicUrl || '',
      artist: r.artist || '',
    }));
    setLoadingBar(100);
  } catch (err) {
    console.error('init error:', err);
  }

  setTimeout(() => {
    renderNavLinks();
  document.getElementById('loading').style.display = 'none';
    render();
  }, 200);
}

function setLoadingBar(pct) {
  document.getElementById('loadingBar').style.width = pct + '%';
}

// ── Banners ───────────────────────────────────
function triggerBanner(slot) {
  document.getElementById('bannerFile' + slot).click();
}
async function onBannerFile(slot, input) {
  const f = input.files[0];
  if (!f) return;
  const base64 = await fileToBase64(f);
  await dbOp('banners', 'readwrite', s => s.put({ slot, base64 }));
  banners[slot] = base64;
  applyBanner(slot, base64);
}
function applyBanner(slot, base64) {
  const el = document.getElementById('banner' + slot);
  el.querySelector('.slot-label')?.remove();
  el.querySelector('img')?.remove();
  const img = document.createElement('img');
  img.src = base64;
  img.alt = '';
  el.insertBefore(img, el.querySelector('.banner-edit'));
}

// ── Render ────────────────────────────────────
function isExternalLink(url) {
  if (!url) return false;
  if (!/^https?:\/\//i.test(url)) return false;
  try {
    const host = new URL(url).hostname;
    return !host.endsWith('i-roiro.com');
  } catch (e) {
    return true;
  }
}

function render() {
  const container = document.getElementById('cardContainer');
  container.innerHTML = '';

  if (cards.length === 0 && !adminMode) {
    const sec = document.createElement('div');
    sec.className = 'empty-section';
    sec.innerHTML = '<div class="empty-state"><strong>まだゲーム／カードがありません</strong>右上の「管理」から追加できます</div>';
    container.appendChild(sec);
  }

  const gameFramesToScale = []; // [{frameWrap, iframe}] — scaled after full DOM attachment below

  cards.forEach((c, idx) => {
    const sec = document.createElement('div');
    sec.className = 'card-section' + (c.gap === false ? ' no-gap' : '');

    let wrap, replaceAccept, supportsReplace = true;

    if (c.type === 'game') {
      wrap = document.createElement('div');
      wrap.className = 'game-card';

      const frameWrap = document.createElement('div');
      frameWrap.className = 'game-card-frame-wrap';

      const iframe = document.createElement('iframe');
      iframe.srcdoc = c.html;
      iframe.setAttribute('sandbox', 'allow-scripts allow-same-origin');
      // Sized directly to the card's real display width/height — no CSS
      // transform:scale or zoom involved. The games use 100vw/100vh
      // internally, so setting the iframe's actual box to the target size
      // makes the game render at exactly that size on its own. This avoids
      // an entire class of bugs where a transform/zoom-based shrink and a
      // separately-calculated wrapper height could fall out of sync
      // (confirmed to happen on iOS Safari even when correct on desktop).
      frameWrap.appendChild(iframe);

      const tapCatcher = document.createElement('div');
      tapCatcher.className = 'game-card-tap';
      tapCatcher.addEventListener('click', () => {
        if (adminMode) return;
        openFullscreenGame(c.html);
      });
      frameWrap.appendChild(tapCatcher);

      wrap.appendChild(frameWrap);
      gameFramesToScale.push({ frameWrap, iframe });

      replaceAccept = '.html,text/html';
    } else if (c.type === 'image') {
      wrap = document.createElement('a');
      wrap.className = 'card';
      wrap.href = adminMode ? '#' : (c.link || '#');
      if (!adminMode && c.link && isExternalLink(c.link)) wrap.target = '_blank';
      wrap.rel = 'noopener';

      const img = document.createElement('img');
      img.src = c.base64;
      img.alt = '';
      img.loading = 'lazy';
      wrap.appendChild(img);
      replaceAccept = 'image/*,text/html,.html';
    } else if (c.type === 'game-carousel') {
      wrap = document.createElement('div');
      wrap.className = 'game-carousel-card';
      wrap.dataset.index = '0';

      // ゲームフレーム
      const frameWrap = document.createElement('div');
      frameWrap.className = 'game-card-frame-wrap';

      const iframe = document.createElement('iframe');
      iframe.srcdoc = c.htmls[0];
      iframe.sandbox = 'allow-scripts allow-same-origin';
      iframe.style.cssText = 'border:none;display:block;pointer-events:none;';
      frameWrap.appendChild(iframe);
      sizeGameIframeToCard(frameWrap, iframe);

      const tapCatcher = document.createElement('div');
      tapCatcher.className = 'game-card-tap';
      tapCatcher.onclick = () => openFullscreenGame(c.htmls[0]);
      frameWrap.appendChild(tapCatcher);
      wrap.appendChild(frameWrap);

      // フッター（ナビ）
      const footer = document.createElement('div');
      footer.className = 'game-carousel-footer';

      const prevBtn = document.createElement('button');
      prevBtn.className = 'game-carousel-nav';
      prevBtn.textContent = '‹';

      const titleSpan = document.createElement('span');
      titleSpan.className = 'game-carousel-title';
      titleSpan.textContent = (c.names?.[0] || '') + (c.htmls.length > 1 ? `　1 / ${c.htmls.length}` : '');

      const nextBtn = document.createElement('button');
      nextBtn.className = 'game-carousel-nav';
      nextBtn.textContent = '›';

      footer.appendChild(prevBtn);
      footer.appendChild(titleSpan);
      footer.appendChild(nextBtn);
      wrap.appendChild(footer);

      function updateGame(idx) {
        wrap.dataset.index = String(idx);
        iframe.srcdoc = c.htmls[idx];
        sizeGameIframeToCard(frameWrap, iframe);
        tapCatcher.onclick = () => openFullscreenGame(c.htmls[idx]);
        titleSpan.textContent = (c.names?.[idx] || '') + (c.htmls.length > 1 ? `　${idx + 1} / ${c.htmls.length}` : '');
      }

      prevBtn.addEventListener('click', e => {
        e.preventDefault(); e.stopPropagation();
        const idx = (parseInt(wrap.dataset.index, 10) - 1 + c.htmls.length) % c.htmls.length;
        updateGame(idx);
      });
      nextBtn.addEventListener('click', e => {
        e.preventDefault(); e.stopPropagation();
        const idx = (parseInt(wrap.dataset.index, 10) + 1) % c.htmls.length;
        updateGame(idx);
      });

      supportsReplace = false;

    } else if (c.type === 'carousel') {
      wrap = document.createElement('div');
      wrap.className = 'carousel-card';
      wrap.dataset.index = '0';

      const img = document.createElement('img');
      img.src = c.images[0];
      img.alt = '';
      img.loading = 'lazy';
      wrap.appendChild(img);

      if (c.images.length > 1) {
        const dots = document.createElement('div');
        dots.className = 'carousel-dots';
        c.images.forEach((_, idx) => {
          const dot = document.createElement('span');
          if (idx === 0) dot.classList.add('active');
          dots.appendChild(dot);
        });
        wrap.appendChild(dots);

        const count = document.createElement('div');
        count.className = 'carousel-count';
        count.textContent = `1 / ${c.images.length}`;
        wrap.appendChild(count);

        wrap.addEventListener('click', e => {
          if (adminMode) return;
          e.preventDefault();
          let idx = (parseInt(wrap.dataset.index, 10) + 1) % c.images.length;
          wrap.dataset.index = String(idx);
          img.src = c.images[idx];
          dots.querySelectorAll('span').forEach((d, i) => d.classList.toggle('active', i === idx));
          count.textContent = `${idx + 1} / ${c.images.length}`;
        });
      }
      supportsReplace = false;
    } else {
      // plain html-card (non-game HTML content, e.g. articles/tools)
      wrap = document.createElement('div');
      wrap.className = 'html-card';

      const label = document.createElement('div');
      label.className = 'html-card-label';
      label.textContent = c.name || '(無題)';

      const iframe = document.createElement('iframe');
      iframe.srcdoc = injectAutoResize(c.html);
      iframe.loading = 'lazy';
      iframe.scrolling = 'no';
      iframe.sandbox = 'allow-scripts allow-popups allow-forms allow-same-origin';
      iframe.addEventListener('load', function() {
        try {
          const h = iframe.contentDocument.documentElement.scrollHeight || iframe.contentDocument.body.scrollHeight;
          if (h > 0) iframe.style.height = h + 'px';
        } catch(e) {}
        iframe.contentWindow.postMessage({ type: 'asobiva-init' }, '*');
      });

      wrap.appendChild(label);
      wrap.appendChild(iframe);
      if (!adminMode && c.link) {
        const linkOverlay = document.createElement('a');
        linkOverlay.href = c.link;
        if (isExternalLink(c.link)) linkOverlay.target = '_blank';
        linkOverlay.rel = 'noopener';
        linkOverlay.style.cssText = 'position:absolute;inset:0;z-index:4;';
        wrap.appendChild(linkOverlay);
      }
      replaceAccept = 'image/*,text/html,.html';
    }

    let replaceBtn, replaceInput;
    if (supportsReplace) {
      replaceBtn = document.createElement('button');
      replaceBtn.className = 'card-replace';
      replaceBtn.title = '差し替え';
      replaceBtn.textContent = '⇄';

      replaceInput = document.createElement('input');
      replaceInput.type = 'file';
      replaceInput.accept = replaceAccept;
      replaceInput.className = 'card-replace-input';
      replaceInput.addEventListener('change', e => {
        e.preventDefault(); e.stopPropagation();
        const f = e.target.files[0];
        if (f) replaceCard(c.id, f);
      });

      replaceBtn.addEventListener('click', e => {
        e.preventDefault(); e.stopPropagation();
        replaceInput.click();
      });
    }

    const linkBtn = document.createElement('button');
    linkBtn.className = 'card-link-btn' + (c.link ? ' has-link' : '');
    linkBtn.title = 'リンクを設定';
    linkBtn.textContent = '🔗';
    linkBtn.addEventListener('click', e => {
      e.preventDefault(); e.stopPropagation();
      openLinkEditor(c.id, c.link);
    });

    const delBtn = document.createElement('button');
    delBtn.className = 'card-del';
    delBtn.title = '削除';
    delBtn.textContent = '✕';
    delBtn.addEventListener('click', e => {
      e.preventDefault(); e.stopPropagation();
      deleteCard(c.id);
    });
    const moveWrap = document.createElement('div');
    moveWrap.className = 'card-move';
    const upBtn = document.createElement('button');
    upBtn.textContent = '↑';
    upBtn.disabled = idx === 0;
    upBtn.addEventListener('click', e => { e.preventDefault(); e.stopPropagation(); moveCard(idx, idx - 1); });
    const downBtn = document.createElement('button');
    downBtn.textContent = '↓';
    downBtn.disabled = idx === cards.length - 1;
    downBtn.addEventListener('click', e => { e.preventDefault(); e.stopPropagation(); moveCard(idx, idx + 1); });
    moveWrap.appendChild(upBtn);
    moveWrap.appendChild(downBtn);
    wrap.appendChild(moveWrap);

    const gapBtn = document.createElement('button');
    gapBtn.className = 'card-gap-btn';
    gapBtn.textContent = c.gap === false ? '隙間なし' : '隙間あり';
    gapBtn.addEventListener('click', e => {
      e.preventDefault(); e.stopPropagation();
      toggleGap(c.id);
    });
    if (!['game','game-carousel','carousel'].includes(c.type)) wrap.appendChild(linkBtn);
    if (supportsReplace) {
      wrap.appendChild(replaceBtn);
      wrap.appendChild(replaceInput);
    }
    wrap.appendChild(delBtn);
    wrap.appendChild(gapBtn);
    sec.appendChild(wrap);
    container.appendChild(sec);
  });

  if (adminMode) {
    const addSec = document.createElement('div');
    addSec.className = 'add-section';
    const btn = document.createElement('button');
    btn.className = 'add-card-btn';
    btn.onclick = openPanel;

    addSec.appendChild(btn);

  }

  // now that every card is attached to the live DOM, frameWrap has a real

  gameFramesToScale.forEach(({ frameWrap, iframe }) => sizeGameIframeToCard(frameWrap, iframe));

// ── ゲームカード用: 直接サイズ指定 ────────────────
// 3つのゲームはいずれも内部で `width:100vw; height:100vh;` を使っているため、
// iframe の実際の width/height 属性をカードの表示サイズに直接合わせるだけで、
// ゲーム自身がそのサイズにフィットして描画される。
// transform:scale や zoom のような「後から縮小する」処理を使うと、縮小後の
// 見た目とラッパーの高さを JS で別々に計算・同期する必要が生じ、その同期が
// 実機(iOS Safari)でズレることが確認されたため、この方式に統一した。
// CARD_ASPECT_W/H は上部で定義済み（プレビューカードの固定縦横比）。

const CARD_SCALE = 0.6; // カード表示は常にこの倍率で固定縮小(iframeの実サイズを縮小)
const FLUID_RATIO = 584 / 320; // fluid版ゲームの基準比率(320px幅の時の高さ584px)

function sizeGameIframeToCard(frameWrap, iframe) {
  const apply = () => {
    const w = frameWrap.clientWidth || frameWrap.parentElement?.clientWidth || 0;
    if (!w) return;
    const scaledW = Math.round(w * CARD_SCALE);
    const scaledH = Math.round(scaledW * FLUID_RATIO) + 4;
    iframe.style.transform = '';
    iframe.style.zoom = '';
    iframe.style.width = scaledW + 'px';
    iframe.style.height = scaledH + 'px';
    iframe.style.display = 'block';
    iframe.style.borderRadius = '12px';
    iframe.style.margin = '40px auto';
  };
  apply();
  requestAnimationFrame(apply);
  setTimeout(apply, 150);
  setTimeout(apply, 500);
}

// ── フルスクリーン再生 ──────────────────────────
// 画面いっぱいに引き伸ばさず、90%のサイズで表示し、余った分を
// frameWrapのcenter配置で上下左右均等に配置する。
const FULLSCREEN_SCALE = 0.9;
let _fullscreenResizeHandler = null;

function sizeFullscreenIframe(frameWrap, iframe) {
  const apply = () => {
    const maxW = frameWrap.clientWidth || window.innerWidth;
    if (!maxW) return;
    iframe.style.zoom = '';
    iframe.style.transform = '';
    iframe.style.width = maxW + 'px';
    iframe.style.height = Math.round(maxW * FLUID_RATIO) + 'px';
  };
  apply();
  requestAnimationFrame(apply);
  setTimeout(apply, 150);
  if (_fullscreenResizeHandler) window.removeEventListener('resize', _fullscreenResizeHandler);
  _fullscreenResizeHandler = apply;
  window.addEventListener('resize', apply);
}

function openFullscreenGame(html) {
  const overlay = document.getElementById('fullscreenOverlay');
  const frameWrap = document.getElementById('fullscreenFrameWrap');
  frameWrap.innerHTML = '';

  const iframe = document.createElement('iframe');
  iframe.srcdoc = html;
  iframe.setAttribute('sandbox', 'allow-scripts allow-same-origin');
  frameWrap.appendChild(iframe);
  sizeFullscreenIframe(frameWrap, iframe);

  overlay.classList.add('open');
  document.body.style.overflow = 'hidden';
  document.body.style.position = 'fixed';
  document.body.style.width = '100%';
  document.body.dataset.scrollY = String(window.scrollY);
  document.body.style.top = '-' + window.scrollY + 'px';

  // GW版ゲームかどうか判別してTAP TO STARTのスタイルを切り替え
  const circle = document.querySelector('.tap-to-start-circle');
  const isGW = html.includes('#8fa888');
  if (isGW) {
    circle.style.border = '2px solid #1a2a1a';
    circle.style.background = '#8fa888';
    circle.style.color = '#1a2a1a';
    circle.style.boxShadow = 'none';
    circle.style.textShadow = 'none';
    circle.style.animation = 'none';
  } else {
    circle.style.border = '2px solid #39ff7a';
    circle.style.background = 'rgba(10,10,18,0.85)';
    circle.style.color = '#39ff7a';
    circle.style.boxShadow = '0 0 22px rgba(57,255,122,0.35)';
    circle.style.textShadow = '0 0 8px #39ff7a';
    circle.style.animation = 'pulseRing 1.6s ease-in-out infinite';
  }

  const tapToStart = document.getElementById('tapToStart');
  tapToStart.classList.add('show');
}

function dismissTapToStart() {
  const tapToStart = document.getElementById('tapToStart');
  tapToStart.classList.remove('show');
  const iframe = document.querySelector('#fullscreenFrameWrap iframe');
  if (!iframe || !iframe.contentWindow) return;

  // Primary path: call the game's own exitDemoIfActive() directly via
  // contentWindow. This is more reliable than postMessage for srcdoc
  // iframes, where some browsers (notably iOS Safari) can be inconsistent
  // about delivering cross-frame messages.
  try {
    if (typeof iframe.contentWindow.exitDemoIfActive === 'function') {
      iframe.contentWindow.exitDemoIfActive();
    } else {
      throw new Error('exitDemoIfActive not found on contentWindow');
    }
  } catch (err) {
    // Fallback: postMessage, in case direct access is blocked for any reason
    console.warn('direct call failed, falling back to postMessage', err);
    iframe.contentWindow.postMessage({ type: 'asobiva-start-play' }, '*');
  }
}
document.getElementById('tapToStart').addEventListener('click', dismissTapToStart);

function closeFullscreenGame() {
  const overlay = document.getElementById('fullscreenOverlay');
  const frameWrap = document.getElementById('fullscreenFrameWrap');
  overlay.classList.remove('open');
  frameWrap.innerHTML = '';
  document.getElementById('tapToStart').classList.remove('show');
  const y = parseInt(document.body.dataset.scrollY || '0', 10);
  document.body.style.overflow = '';
  document.body.style.position = '';
  document.body.style.width = '';
  document.body.style.top = '';
  window.scrollTo(0, y);
}
document.getElementById('closeFullscreenBtn').addEventListener('click', closeFullscreenGame);

function onFileSelect(files) {

}

async function addCards() {

  btn.disabled = true;
  btn.textContent = '保存中…';

  if (htmlFiles.length >= 2 && imgFiles.length === 0) {
    // ゲームカルーセル

      return input?.value.trim() || f.name;
    });
    const id = await dbOp('cards', 'readwrite', s => s.add({ type: 'game-carousel', htmls: htmlTexts, names, link: '', gap: true }));
    cards.push({ id, type: 'game-carousel', htmls: htmlTexts, names, link: '', gap: true });
  } else if (isCarousel) {
    const images64 = [];
    for (const f of imgFiles) images64.push(await fileToBase64(f));
    const id = await dbOp('cards', 'readwrite', s => s.add({ type: 'carousel', images: images64, link: '' }));
    cards.push({ id, type: 'carousel', images: images64, link: '' });
  } else {
    for (const f of pendingFiles) {
      if (isHtmlFile(f)) {
        const html = await fileToText(f);
        const name = f.name;
        if (isGameHtml(html)) {
          const id = await dbOp('cards', 'readwrite', s => s.add({ type: 'game', html, name, link: '' }));
          cards.push({ id, type: 'game', html, name, link: '' });
        } else {
          const id = await dbOp('cards', 'readwrite', s => s.add({ type: 'html', html, name, link }));
          cards.push({ id, type: 'html', html, name, link });
        }
      } else {
        const base64 = await fileToBase64(f);
        const id = await dbOp('cards', 'readwrite', s => s.add({ type: 'image', base64, link }));
        cards.push({ id, type: 'image', base64, link });
      }
    }
  }

  btn.textContent = '追加する';
  closePanel();
  render();
}

// ── Replace ───────────────────────────────────
async function replaceCard(id, file) {
  const existing = cards.find(c => c.id === id);
  const link = existing?.link || '';
  const i = cards.findIndex(c => c.id === id);

  if (isHtmlFile(file)) {
    const html = await fileToText(file);
    const name = file.name;
    if (isGameHtml(html)) {
      await dbOp('cards', 'readwrite', s => s.put({ id, type: 'game', html, name, link: '' }));
      if (i !== -1) cards[i] = { id, type: 'game', html, name, link: '' };
    } else {
      await dbOp('cards', 'readwrite', s => s.put({ id, type: 'html', html, name, link }));
      if (i !== -1) cards[i] = { id, type: 'html', html, name, link };
    }
  } else {
    const base64 = await fileToBase64(file);
    await dbOp('cards', 'readwrite', s => s.put({ id, type: 'image', base64, link }));
    if (i !== -1) cards[i] = { id, type: 'image', base64, link };
  }
  render();
}

}

  if (toIdx < 0 || toIdx >= cards.length) return;
  const tmp = cards[fromIdx];

  cards.forEach((c, i) => { c.order = i + 1; });
  for (const card of cards) {
    try { await dbOp('cards', 'readwrite', s => s.put({ ...card })); } catch {}

// ── 画像圧縮（公開用保存時のみ使用） ─────────────
function compressImage(base64) {
  return new Promise((res) => {
    const img = new Image();
    img.onload = () => {
      const MAX_W = 1200;
      let w = img.width, h = img.height;
      if (w > MAX_W) { h = Math.round(h * (MAX_W / w)); w = MAX_W; }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);
      const isPng = base64.startsWith('data:image/png');
      const mime = isPng ? 'image/png' : 'image/jpeg';
      const quality = isPng ? undefined : 0.8;
      res(canvas.toDataURL(mime, quality));
    };
    img.onerror = () => res(base64);
    img.src = base64;
  });
}

function cyclerCarousel(el){

  var idx = (parseInt(el.dataset.index, 10) + 1) % images.length;
  el.dataset.index = String(idx);
  el.querySelector('img').src = images[idx];

  dots.forEach(function(d, i){ d.classList.toggle('active', i === idx); });

  if (count) count.textContent = (idx + 1) + ' / ' + images.length;
}
var CARD_ASPECT_W = 320;

var CARD_SCALE = 0.6;
var FLUID_RATIO = 584 / 320;
(function(){
  function sizeFrame(wrap, iframe){
    var w = wrap.clientWidth;
    if (!w) return;
    var scaledW = Math.round(w * CARD_SCALE);
    var scaledH = Math.round(scaledW * FLUID_RATIO) + 4;
    iframe.style.transform = '';
    iframe.style.zoom = '';
    iframe.style.width = scaledW + 'px';
    iframe.style.height = scaledH + 'px';
    iframe.style.display = 'block';
    iframe.style.borderRadius = '12px';
    iframe.style.margin = '40px auto';
  }

  function fitGameFrames(){
    document.querySelectorAll('.game-card-frame-wrap').forEach(function(wrap){
      var iframe = wrap.querySelector('iframe');
      if (!iframe) return;
      sizeFrame(wrap, iframe);
    });
  }

  fitGameFrames();
  document.addEventListener('DOMContentLoaded', fitGameFrames);
  window.addEventListener('load', fitGameFrames);

function sizeFullscreenIframeStatic(frameWrap, iframe){
