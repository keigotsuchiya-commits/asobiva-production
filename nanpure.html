<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="asobiva-game" content="nanpure"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>ナンプレ</title>
<style>
/*COLORS-START*/
:root{
--c-page-bg:#f5f7f5; /* 画面全体の地 | ページ全体の背景 */
--c-page-text:#24323c; /* 画面全体の文字 | 題名、条件の表示、結果の文字 */
--c-clue-bg:#000000; /* ヒント欄の地 | 盤面の上の、案内を出す欄 */
--c-clue-text:#ffffff; /* ヒント欄の文字 | ヒント欄の文字 */
--c-board-line:#c3cfcd; /* 盤面の細い線 | マスとマスの間の線 */
--c-board-box:#34444c; /* 盤面の太い線 | 3×3のブロックの区切りと外枠 */
--c-cell:#ffffff; /* マスの地 | ふつうのマス */
--c-cell-text:#1f617a; /* 入れた数字 | 自分で入れた数字 */
--c-cell-given-text:#24323c; /* 最初から入っている数字 | 最初から入っていて変えられない数字 */
--c-cell-memo-text:#50616b; /* メモの数字 | マスに小さく書いた候補の数字 */
--c-cell-related:#e6eef1; /* 選んだマスの縦・横・ブロック | 選んでいるマスと同じ列・行・ブロックのマス */
--c-cell-same:#fff0b5; /* 同じ数字のマス | 選んでいるマスと同じ数字が入ったマス */
--c-cell-cursor:#e22400; /* 選んでいるマスの枠 | 今選んでいるマスの枠 */
--c-cell-correct:#d8f2de; /* 正解のマス | 答え合わせで合っていたマス */
--c-cell-wrong:#ffe0df; /* 不正解のマス | 答え合わせで間違っていたマス */
--c-pad-bg:#ffffff; /* 数字ボタンの地 | 盤面の下の1〜9のボタン */
--c-pad-text:#24323c; /* 数字ボタンの文字 | 数字ボタンの数字 */
--c-pad-border:#aab8b7; /* 数字ボタンの枠 | 数字ボタンの枠 */
--c-pad-on-bg:#116a9b; /* メモがオンのときの地 | 「メモ」を押しているときのボタン */
--c-pad-on-text:#ffffff; /* メモがオンのときの文字 | 「メモ」を押しているときのボタンの文字 */
--c-main-bg:#000000; /* 主なボタンの地 | 答え合わせ、はい、始める、次のナンプレ */
--c-main-text:#ffffff; /* 主なボタンの文字 | 主なボタンの文字 */
--c-btn-bg:#ffffff; /* ふつうのボタンの地 | メモ、消す、1文字ヒント、設定・終了、いいえ、もう一度遊ぶ、選択欄 */
--c-btn-text:#000000; /* ふつうのボタンの文字 | ふつうのボタンの文字 */
--c-btn-border:#000000; /* ふつうのボタンの枠 | ふつうのボタンの枠 */
--c-panel-bg:#ffffff; /* パネルの地 | 設定、確認、終了 */
--c-panel-text:#24323c; /* パネルの文字 | パネルの中の文字 */
--c-panel-border:#ccd9d9; /* パネルの枠 | パネルの枠 */
--c-focus:#000000; /* 選ばれているボタンの印 | 確認画面の「はい」など、選ばれているボタンの外側の印 */
}
/*COLORS-END*/
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
:root,body{font-family:system-ui,"Yu Gothic",sans-serif;background:var(--c-page-bg);color:var(--c-page-text)}
body{margin:0;overflow-x:hidden}main{max-width:620px;margin:0 auto;padding:0 12px 20px}
button,select{font:inherit;touch-action:manipulation}
.topbar{display:flex;justify-content:space-between;align-items:center;padding:10px 2px 8px;gap:8px}.topbar strong{font-size:20px;color:var(--c-page-text)}
.topbar button,.settingsWrap>button,.tools button,.actions button,.askBtns button,select{background:var(--c-btn-bg);color:var(--c-btn-text);border:1px solid var(--c-btn-border);border-radius:9px;padding:8px 10px;font-size:15px}
.settingsWrap{background:var(--c-panel-bg);color:var(--c-panel-text);border:1px solid var(--c-panel-border);border-radius:12px;padding:10px;margin-bottom:8px}
.settingsWrap[hidden],.overlay[hidden],#finish[hidden]{display:none!important}
.settings{display:flex;gap:12px;align-items:end;flex-wrap:wrap;padding:6px}.settings label{font-weight:700;display:grid;gap:6px;flex:1}
select{font-size:18px;padding:10px;border-width:2px;border-radius:8px;min-width:160px}
.settingsWrap>button{margin:6px 6px 0 0}.settingsWrap details{padding:10px 2px;font-size:14px;line-height:1.6}
.mode{font-size:13px;color:var(--c-page-text);margin:0 0 7px}
.gameArea{display:flex;flex-direction:column;gap:9px}
.clueBar{background:var(--c-clue-bg);color:var(--c-clue-text);border-radius:8px;padding:9px 12px;font-size:clamp(15px,3.9vw,18px);font-weight:700;line-height:1.35;min-height:44px;display:flex;align-items:center}
/* 盤面：3×3のブロックを太い線、マスの間を細い線で区切る */
.board{--cs:40px;display:grid;grid-template-columns:repeat(3,1fr);gap:3px;padding:3px;background:var(--c-board-box);border-radius:6px;width:100%;max-width:min(100%,510px);margin:0 auto;aspect-ratio:1/1}
.box{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:1px;background:var(--c-board-line);min-width:0;min-height:0}
.cell{position:relative;border:0;padding:0;min-width:0;min-height:0;background:var(--c-cell);color:var(--c-cell-text);font-size:calc(var(--cs)*.58);font-weight:600;line-height:1;display:flex;align-items:center;justify-content:center;cursor:pointer;user-select:none;-webkit-user-select:none}
.cell.given{color:var(--c-cell-given-text);font-weight:800;cursor:default}
.cell.related{background:var(--c-cell-related)}
.cell.same{background:var(--c-cell-same)}
.cell.correct{background:var(--c-cell-correct)}.cell.wrong{background:var(--c-cell-wrong)}
.cell.selected{outline:3px solid var(--c-cell-cursor);outline-offset:-3px;z-index:1}
.memo{position:absolute;inset:2px;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);color:var(--c-cell-memo-text);font-size:calc(var(--cs)*.26);font-weight:600;line-height:1}
.memo span{display:flex;align-items:center;justify-content:center}
.pad{display:grid;grid-template-columns:repeat(9,1fr);gap:4px}
.pad button{background:var(--c-pad-bg);color:var(--c-pad-text);border:1px solid var(--c-pad-border);border-radius:8px;font-size:clamp(18px,5.4vw,24px);font-weight:700;padding:8px 0;min-width:0}
.pad button.done{opacity:.35}
.tools{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.tools button{font-weight:700;padding:10px 2px;font-size:clamp(12px,3.4vw,15px);min-width:0}
.tools button.on{background:var(--c-pad-on-bg);color:var(--c-pad-on-text);border-color:var(--c-pad-on-bg)}
.primary,.tools button.primary,.actions button.primary,.askBtns button.primary,.start.primary{background:var(--c-main-bg)!important;color:var(--c-main-text);border-color:var(--c-main-bg)}
.start{font-weight:700;font-size:17px;padding:11px 14px;border:2px solid var(--c-main-bg);border-radius:9px;cursor:pointer}
.status{font-size:15px;font-weight:700;line-height:1.4;min-height:1.4em;color:var(--c-page-text)}
.panel{background:var(--c-panel-bg);color:var(--c-panel-text);border:1px solid var(--c-panel-border);border-radius:12px;padding:16px}
.panel h2{font-size:20px;margin:0 0 8px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.actions button{font-weight:700;font-size:17px;padding:11px 14px}
.overlay{position:fixed;inset:0;z-index:100;background:#0008;display:flex;align-items:center;justify-content:center}
.askSheet{background:var(--c-panel-bg);color:var(--c-panel-text);border-radius:16px;width:min(92%,420px);padding:20px 18px}
.askSheet p{font-size:18px;font-weight:700;line-height:1.5;margin:0 0 16px}.askBtns{display:grid;grid-template-columns:1fr 1fr;gap:10px}.askBtns button{font-weight:700;font-size:17px;padding:12px;border-width:2px}
button:focus,select:focus{outline:none}
button:focus-visible,select:focus-visible,.askBtns button:focus{outline:3px solid var(--c-focus);outline-offset:2px}
.cell:focus-visible{outline:3px solid var(--c-cell-cursor);outline-offset:-3px}
</style></head><body><main>
<header class="topbar"><strong>ナンプレ</strong><button id="menuBtn" type="button" aria-expanded="false">設定・終了 ☰</button></header>
<div id="settingsWrap" class="settingsWrap" hidden><div class="settings"><label>難しさ<select id="level"><option value="easy" selected>かんたん</option><option value="normal">ふつう</option><option value="hard">むずかしい</option></select></label><button class="start primary" id="start" type="button">この条件で始める</button></div><button id="quit" type="button">ゲームを終了する</button><button id="reset" type="button">最初からやり直す</button><details><summary>遊び方</summary>縦の列・横の行・太い線で囲まれた3×3のブロックのどれにも、1〜9の数字が1つずつ入るように、空いたマスを埋めます。マスを選んで、下の数字ボタンを押してください。「メモ」を押している間は、候補の数字を小さく書きこめます。</details></div>
<div id="mode" class="mode"></div>
<div class="gameArea">
<div class="clueBar" id="current" aria-live="polite"></div>
<div class="board" id="board" role="grid" aria-label="ナンプレの盤面"></div>
<div class="pad" id="pad" aria-label="数字ボタン"></div>
<div class="tools"><button id="memoBtn" type="button" aria-pressed="false">メモ</button><button id="eraseBtn" type="button">消す</button><button id="hint" type="button">1文字ヒント</button><button id="check" type="button" class="primary">答え合わせ</button></div>
<div class="status" id="status" role="status" aria-live="polite"></div>
<div id="finish" class="panel" hidden><h2 id="finishTitle">ゲーム終了</h2><p id="finishText"></p><div class="actions"><button id="again" type="button" class="primary">次のナンプレ</button><button id="change" type="button">もう一度遊ぶ</button></div></div>
</div>
<div id="askOverlay" class="overlay ask" hidden><div class="askSheet" role="alertdialog" aria-modal="true" aria-labelledby="askText"><p id="askText"></p><div class="askBtns"><button id="askNo" type="button">いいえ</button><button id="askYes" type="button" class="primary">はい</button></div></div></div>
</main>

el('start').onclick=()=>{const go=()=>{closeSettings();setup();window.scrollTo(0,0)};if(!finished&&val.some((v,i)=>v&&!given[i]))ask('問題を切り替えると入力内容が消えます。続けますか？',go);else go()};

window.__toolState=name=>{if(name==='check'){let n=0;for(let i=0;i<81&&n<4;i++)if(!given[i]){val[i]=n%2?sol[i]:(sol[i]%9)+1;n++}render();el('check').click()}else if(name==='settings')el('menuBtn').click();else if(name==='ask'){el('menuBtn').click();el('quit').click()}else if(name==='finish')endGame(true)};
setup();
</script></body></html>
