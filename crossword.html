 if(!(replay&&current)){const a=el('level').value,n=LEVEL_N[a];current={label:el('level').selectedOptions[0].text.replace(/（.*?）/,''),N:n,raw:generate(a)}}N=current.N;const raw=current.raw.map(e=>e.slice());entries=[];solution=new Map();starts=new Map();cells=new Map();values=new Map();active=null;index=0;smallMap=new Map();showSmall=false;
 raw.forEach(([dir,r,c,answer,clue,orig],idx)=>{const e={dir,r,c,answer,clue,n:idx+1};const og=[...(orig||answer)];e.positions=[...answer].map((ch,i)=>{const key=`${r+(dir==='d'?i:0)}-${c+(dir==='a'?i:0)}`;if(og[i]&&og[i]!==ch)smallMap.set(key,og[i]);if(solution.has(key)&&solution.get(key)!==ch)throw Error('crossing mismatch');solution.set(key,ch);return key});entries.push(e)});
 const startKeys=[...new Set(entries.map(e=>e.positions[0]))].sort((x,y)=>{const[a1,b1]=x.split('-').map(Number),[a2,b2]=y.split('-').map(Number);return a1-a2||b1-b2});startKeys.forEach((k,i)=>starts.set(k,i+1));
 for(const e of entries)e.n=starts.get(e.positions[0]);entries.sort((x,y)=>x.n-y.n||(x.dir==='a'?-1:1));
 el('mode').textContent=`${current.label} ／ ${N}×${N}マス ／ ${entries.length}問`;const inputNode=el('typebox');el('board').innerHTML='';el('board').append(inputNode);el('board').style.gridTemplateColumns=`repeat(${N},minmax(0,1fr))`;el('board').style.gridTemplateRows=`repeat(${N},minmax(0,1fr))`;el('board').setAttribute('aria-label',`${N}行${N}列のクロスワード`);
 for(let r=0;r<N;r++)for(let c=0;c<N;c++){const key=`${r}-${c}`,b=document.createElement('button');b.type='button';b.className='cell'+(solution.has(key)?'':' block');if(solution.has(key)){b.setAttribute('aria-label',`${r+1}行${c+1}列`);if(starts.has(key)){const s=document.createElement('span');s.className='num';s.textContent=starts.get(key);b.append(s)}const s=document.createElement('span');s.className='char';b.append(s);b.onclick=()=>{const matches=entries.filter(e=>e.positions.includes(key));let pick=matches.find(e=>e===active)||matches[0];if(matches.length>1&&active&&active.positions[index]===key)pick=matches.find(e=>e!==active)||pick;select(pick,pick.positions.indexOf(key));focusInput()};cells.set(key,b)}else{b.disabled=true;b.setAttribute('aria-hidden','true')}el('board').append(b)}
 el('board').append(el('typebox'));
 for(const dir of ['a','d'])el(dir==='a'?'across':'down').innerHTML='';
 for(const e of entries){const b=document.createElement('button');b.className='clue';b.textContent=`${e.n}. ${e.clue}（${[...e.answer].length}文字）`;b.onclick=()=>{select(e,0);el('cluesOverlay').hidden=true;focusInput()};e.button=b;el(e.dir==='a'?'across':'down').append(b)}
 if(entries.length)select(entries[0],0);el('status').textContent='';
}
function focusInput(){const t=el('typebox');positionInput();try{t.focus({preventScroll:true})}catch(_){t.focus()}}
function positionInput(){const k=active?.positions[index];if(!k)return;const b=cells.get(k),board=el('board');if(!b)return;el('typebox').style.left=b.offsetLeft+'px';el('typebox').style.top=b.offsetTop+'px';el('typebox').style.width=b.offsetWidth+'px';el('typebox').style.height=b.offsetHeight+'px'}
function select(e,i){active=e;index=i;const t=el('typebox');if(!composing)t.value='';for(const [k,b] of cells){b.classList.toggle('active',e.positions.includes(k));b.classList.toggle('selected',e.positions[i]===k)}for(const x of entries)x.button.classList.toggle('on',x===e);positionInput();el('current').textContent=`${e.dir==='a'?'ヨコ':'タテ'} ${e.n}番：${e.clue}（${[...e.answer].length}文字）`}
function render(){for(const [k,b] of cells){const v=values.get(k)||'';b.querySelector('.char').textContent=(showSmall&&v&&smallMap.has(k))?smallMap.get(k):v}}
function clearMarks(){for(const b of cells.values())b.classList.remove('correct','wrong')}
function write(ch){if(!active||finished)return;values.set(active.positions[index],ch);clearMarks();render();if(index<active.positions.length-1)select(active,index+1);evaluateCompletion()}
function normalize(s){return s.replace(/[ぁ-ゖ]/g,x=>String.fromCharCode(x.charCodeAt(0)+96)).replace(/\s/g,'').slice(-1)}
let composing=false;
const t=el('typebox');
function preview(value=t.value){if(!active)return;const k=active.positions[index],b=cells.get(k);if(!b)return;const ch=[...value].pop()||'';b.querySelector('.char').textContent=ch;}
function consumeInput(){if(composing)return;const raw=t.value;if(!raw)return;const chars=[...raw.normalize('NFKC').replace(/[ぁ-ゖ]/g,x=>String.fromCharCode(x.charCodeAt(0)+96)).replace(/[ァィゥェォャュョッヮ]/g,x=>'アイウエオヤユヨツワ'['ァィゥェォャュョッヮ'.indexOf(x)]).replace(/\s/g,'')];t.value='';for(const ch of chars){if(/[ァ-ヶー]/.test(ch))write(ch)}render();}
t.addEventListener('compositionstart',()=>{composing=true});
t.addEventListener('compositionupdate',e=>{preview(e.data||t.value)});
t.addEventListener('compositionend',()=>{composing=false;consumeInput()});
t.addEventListener('input',()=>{if(composing)preview();else consumeInput()});
t.addEventListener('blur',()=>{if(composing)return;t.value='';render()});
window.addEventListener('resize',positionInput);
document.addEventListener('keydown',e=>{if(!active||composing||e.isComposing||e.ctrlKey||e.metaKey||e.altKey||e.target.tagName==='SELECT')return;if(e.key==='Backspace'||e.key==='Delete'){e.preventDefault();if(finished||!el('askOverlay').hidden)return;const k=active.positions[index];if(values.has(k))values.delete(k);else if(index>0){select(active,index-1);values.delete(active.positions[index])}clearMarks();render()}else if(e.key.startsWith('Arrow')){e.preventDefault();select(active,Math.max(0,Math.min(active.positions.length-1,index+(e.key==='ArrowRight'||e.key==='ArrowDown'?1:-1))))}});
function endGame(success){finished=true;if(success){showSmall=true;render()}document.activeElement.blur();el('board').style.pointerEvents='none';el('finish').hidden=false;el('finishTitle').textContent=success?'クリア！ おめでとうございます':'ゲームを終了しました';el('finishText').textContent=success?'すべてのマスが正解です。お疲れさまでした。':'途中までの入力は残っています。もう一度遊ぶと最初から始まります。';el('status').textContent=success?'全問正解です！':'ゲーム終了';el('finish').scrollIntoView({block:'center'});}
function evaluateCompletion(){if(finished||values.size!==solution.size)return;for(const [k,ch] of solution){if(values.get(k)!==ch)return}endGame(true)}
el('again').onclick=()=>{setup();window.scrollTo(0,0)};
el('change').onclick=()=>{setup(true);window.scrollTo(0,0)};
function closeSettings(){el('settingsWrap').hidden=true;el('menuBtn').setAttribute('aria-expanded','false')}
let askYes=null;function closeAsk(){el('askOverlay').hidden=true;askYes=null}
function ask(msg,yes){el('askText').textContent=msg;askYes=yes;el('askOverlay').hidden=false;try{document.activeElement.blur()}catch(_){}try{el('askYes').focus({preventScroll:true})}catch(_){}}
el('askYes').onclick=()=>{const f=askYes;closeAsk();if(f)f()};el('askNo').onclick=closeAsk;el('askOverlay').onclick=e=>{if(e.target===el('askOverlay'))closeAsk()};
el('quit').onclick=()=>{if(finished){closeSettings();return}ask('ゲームを終了しますか？',()=>{closeSettings();endGame(false)})};
el('check').onclick=()=>{let correct=0,wrong=0,empty=0;for(const [k,b] of cells){b.classList.remove('correct','wrong');const v=values.get(k);if(!v){empty++;continue}if(v===solution.get(k)){correct++;b.classList.add('correct')}else{wrong++;b.classList.add('wrong')}}el('status').textContent=wrong===0&&empty===0?'全問正解です！':`正解 ${correct}マス・間違い ${wrong}マス・未入力 ${empty}マス。`};
el('hint').onclick=()=>{if(!active||finished)return;const k=active.positions[index];values.set(k,solution.get(k));clearMarks();render();el('status').textContent=`ヒント：${solution.get(k)} を入れました。`;if(index<active.positions.length-1)select(active,index+1);evaluateCompletion()};
el('reset').onclick=()=>ask('入力した文字をすべて消しますか？',()=>{closeSettings();finished=false;el('finish').hidden=true;el('board').style.pointerEvents='auto';values.clear();clearMarks();render();select(entries[0],0);el('status').textContent='リセットしました。';window.scrollTo(0,0)});
el('back').onclick=()=>{if(active&&!finished){values.delete(active.positions[index]);clearMarks();render()}};el('next').onclick=()=>{if(active)select(active,(index+1)%active.positions.length)};el('toggle').onclick=()=>{if(!active)return;const k=active.positions[index],other=entries.find(e=>e!==active&&e.positions.includes(k));if(other)select(other,other.positions.indexOf(k))};
el('menuBtn').onclick=()=>{const box=el('settingsWrap');box.hidden=!box.hidden;el('menuBtn').setAttribute('aria-expanded',String(!box.hidden))};
el('cluesBtn').onclick=()=>{el('cluesOverlay').hidden=false;document.activeElement.blur()};
el('closeClues').onclick=()=>el('cluesOverlay').hidden=true;
el('cluesOverlay').onclick=e=>{if(e.target===el('cluesOverlay'))el('cluesOverlay').hidden=true};
document.addEventListener('keydown',e=>{if(e.key==='Escape'){el('cluesOverlay').hidden=true;closeAsk()}});
el('start').onclick=()=>{const go=()=>{closeSettings();setup();window.scrollTo(0,0)};if(values.size)ask('問題を切り替えると入力内容が消えます。続けますか？',go);else go()};setup();
</script></body></html>
