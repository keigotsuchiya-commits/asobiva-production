<!DOCTYPE html>

<head>

<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root { --bg:#e0e0e0; --white:#ffffff; --ink:#1a1a1a; --ink-soft:#888; --border:#e0e0e0; --page-max:480px; --cols:1; --header-h:44px; }
body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: var(--white); color: var(--ink); min-height: 100vh; }
.wrap { max-width: var(--page-max); margin: 0 auto; padding-top: var(--header-h); background: var(--white); min-height: 100vh; }
.header-pair { display:flex; flex-direction:column; background:var(--white); }
.banner-slot { width:100%; min-height:80px; background:var(--white); display:flex; align-items:center; justify-content:center; }
.banner-slot img { width:100%; height:auto; display:block; }
.slot-label { font-size:10px; letter-spacing:0.12em; color:#ccc; }
.card-section { background: var(--white); }
.sp { position:relative; padding-bottom:var(--mb, 0px); }
.sp-top { position:relative; padding-top:var(--mb, 0px); }
.sp.sp-line::after, .sp.sp-dot::after, .sp-top.sp-line::before, .sp-top.sp-dot::before { content:''; position:absolute; left:0; right:0; height:0; z-index:2; pointer-events:none; }
.sp.sp-line::after, .sp.sp-dot::after { bottom:calc(var(--mb, 0px) / 2); transform:translateY(50%); }
.sp-top.sp-line::before, .sp-top.sp-dot::before { top:calc(var(--mb, 0px) / 2); transform:translateY(-50%); }
.sp-line::after, .sp-line::before { border-top:1px solid var(--ink); }
.sp-dot::after, .sp-dot::before { border-top:1px dashed rgba(0,0,0,0.2); }
.card { width:100%; display:block; text-decoration:none; background:var(--white); overflow:hidden; }
.card img { width:100%; height:auto; display:block; }
.html-card { width:100%; background:var(--white); overflow:hidden; }
.html-card iframe { display:block; width:100%; height:60px; border:none; background:var(--white); overflow:hidden; }
.empty-section { background: var(--bg); padding-top:10px; }
.empty-state { padding:60px 24px; text-align:center; color:var(--ink-soft); font-size:13px; line-height:2; background:var(--white); }
.empty-state strong { display:block; font-size:14px; font-weight:600; color:var(--ink); margin-bottom:6px; }
.footer-section { background: var(--white); }
footer { padding:16px; text-align:center; font-size:10px; letter-spacing:0.1em; color:#111111; background:var(--white); }
.site-header { display:flex; align-items:center; justify-content:flex-end; padding:0 16px; height:var(--header-h); background:var(--white); border-bottom:1px solid var(--border); position:fixed; top:0; left:0; right:0; z-index:100; max-width:var(--page-max); margin:0 auto; }
.burger-btn { background:none; border:none; cursor:pointer; padding:4px; display:flex; flex-direction:column; gap:5px; align-items:flex-end; }
.burger-btn span { display:block; height:1.5px; background:var(--ink); border-radius:1px; }
.burger-btn span:nth-child(1) { width:20px; }
.burger-btn span:nth-child(2) { width:14px; }
.burger-btn span:nth-child(3) { width:20px; }
.burger-menu { display:none; position:absolute; top:100%; right:12px; background:var(--white); border:1px solid var(--border); border-radius:10px; box-shadow:0 4px 16px rgba(0,0,0,0.1); overflow:hidden; z-index:200; min-width:140px; }
.burger-menu.open { display:block; }
.nav-link-item { display:block; width:100%; padding:14px 20px; background:none; border:none; border-bottom:1px solid var(--border); font-size:13px; font-weight:500; color:var(--ink); cursor:pointer; text-align:left; text-decoration:none; }
.nav-link-item:last-child { border-bottom:none; }
.card-row { background: var(--white); }
.card-row-inner { display:grid; grid-template-columns: repeat(var(--cols), minmax(0, 1fr)); background: var(--white); }
.card-row .card-section.sp { padding-bottom:0; }
.card-row .card-section.sp::after { display:none; }
.card-section.html-center .html-card { max-width:480px; margin:0 auto; }
@media (min-width: 768px) {
  :root { --page-max:1200px; --cols:3; }
  .header-pair { flex-direction:row; }
  .header-pair .banner-slot { flex: var(--ar, 1) 1 0; min-width:0; }
  .header-pair .banner-slot.sp { padding-bottom:0; }
  .header-pair .banner-slot.sp::after { display:none; }
}
</style>
</head>
<body>
<div class="wrap">
  <div class="site-header">
    <button class="burger-btn" id="burgerBtn" onclick="document.getElementById('burgerMenu').classList.toggle('open')">
      <span></span><span></span><span></span>
    </button>
    <div class="burger-menu" id="burgerMenu"></div>
  </div>

  </div>
  <div id="cardContainer">
  <div class="card-section sp is-html" style="--mb:20px"><div class="html-card"><iframe srcdoc="<!DOCTYPE html>

<style>*{box-sizing:border-box;}

<body>

  <div class=&quot;body-wrap size-md line-normal line-normal&quot;>

<style>.page,.site-frame,.wrap{max-width:none !important;}</style><script>
(function(){
  function report(){ parent.postMessage({ type:'asobiva-resize', height: document.body.offsetHeight }, '*'); }
  window.addEventListener('message', function(e){ if(e.data&&e.data.type==='asobiva-init') report(); });
  window.addEventListener('load', report);
  if(document.readyState==='complete') report();
  if(window.ResizeObserver) new ResizeObserver(report).observe(document.body);
  /* 横画面・PCでの文字拡大：親ページから倍率を受け取り、文字を直接持つ要素の文字サイズに掛ける */
  var applied = null;
  function applyScale(s){
    if(!document.body || applied === s) return;
    applied = s;
    var nodes = document.body.querySelectorAll('*'), i, n, el;
    for(i=0;i<nodes.length;i++){
      el = nodes[i];
      if(/^(IMG|VIDEO|IFRAME|SVG|SCRIPT|STYLE)/i.test(el.tagName)) continue;
      if(el.getAttribute('data-asobiva-fs')) continue;
      for(n=0;n<el.childNodes.length;n++){
        if(el.childNodes[n].nodeType === 3 && el.childNodes[n].textContent.trim()){
          el.setAttribute('data-asobiva-fs', getComputedStyle(el).fontSize);
          break;
        }
      }
    }
    for(i=0;i<nodes.length;i++){
      var base = parseFloat(nodes[i].getAttribute('data-asobiva-fs'));
      if(isFinite(base)) nodes[i].style.fontSize = (base * s) + 'px';
    }
    report();
  }
  window.addEventListener('message', function(e){ if(e.data&&e.data.type==='asobiva-scale') applyScale(e.data.scale); });
  parent.postMessage({ type:'asobiva-need-scale' }, '*');
})();
</script></body>

<script>
document.addEventListener('click', function(e){
  var menu = document.getElementById('burgerMenu');
  var btn = document.getElementById('burgerBtn');
  if (menu && !menu.contains(e.target) && !btn.contains(e.target)) menu.classList.remove('open');
});
window.addEventListener('message', function(e){
  if (e.data && e.data.type === 'asobiva-resize') {
    document.querySelectorAll('.html-card iframe').forEach(function(f){
      if (f.contentWindow === e.source) f.style.height = e.data.height + 'px';
    });
  }
  if (e.data && e.data.type === 'asobiva-need-scale' && e.source) asobivaSendScale(e.source);
});
function asobivaTextScale() {
  var cols = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--cols'), 10) || 1;
  if (cols <= 1) return 1;
  var w = window.innerWidth || document.documentElement.clientWidth || 0;
  return Math.min(1.3, Math.max(1, w / 480));
}
function asobivaSendScale(target) {
  var s = asobivaTextScale();
  var list = target ? [target] : Array.prototype.map.call(document.querySelectorAll('.html-card iframe'), function (f) { return f.contentWindow; });
  list.forEach(function (w) { try { if (w) w.postMessage({ type: 'asobiva-scale', scale: s }, '*'); } catch (e) {} });
}
function asobivaLayout(force) {
  var c = document.getElementById('cardContainer');
  if (!c) return;
  var cols = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--cols'), 10) || 1;
  if (!force && c.getAttribute('data-cols') === String(cols)) return;
  c.setAttribute('data-cols', String(cols));

  // いったん段組みを解除して元の並びに戻す
  Array.prototype.slice.call(c.children).forEach(function (row) {
    if (!row.classList.contains('card-row')) return;
    var inner = row.firstElementChild;
    while (inner && inner.firstChild) c.insertBefore(inner.firstChild, row);
    row.remove();
  });
  if (cols <= 1) return;

  var row = null, inner = null, n = 0;
  Array.prototype.slice.call(c.children).forEach(function (el) {
    if (!el.classList.contains('card-section') || el.classList.contains('is-html')) {
      row = null;
      return;
    }
    if (!row || n >= cols) {
      row = document.createElement('div');
      row.className = 'card-row sp' +
        (el.classList.contains('sp-line') ? ' sp-line' :
         el.classList.contains('sp-dot') ? ' sp-dot' : '');
      row.style.setProperty('--mb', el.style.getPropertyValue('--mb') || '0px');
      inner = document.createElement('div');
      inner.className = 'card-row-inner';
      row.appendChild(inner);
      c.insertBefore(row, el);
      n = 0;
    }
    inner.appendChild(el);
    n++;
  });
}
asobivaLayout(true);
asobivaSendScale();
(function(){
  var t = null;
  window.addEventListener('resize', function(){
    if (t) cancelAnimationFrame(t);
    t = requestAnimationFrame(function(){ asobivaLayout(false); asobivaSendScale(); });
  });
})();
</script>
