<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="潜水士の国家試験 問題集。非公式の学習教材／AI作成・専門家未監修／合格を保証するものではありません">
<title>潜水士 国家試験 問題集｜久世真理子</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Shippori+Mincho+B1:wght@600;700&display=swap">
<style>
:root{color-scheme:light;--bg:#F3F5F6;--card:#FFFFFF;--ink:#15222B;--sub:#3A4750;--muted:#55626B;--line:#E3E8EA;--line2:#DCE2E5;--ok:#1E6B45;--ok-bg:#EAF5EE;--bad:#A3322B;--bad-bg:#FBEDEB;--warn-bg:#FFF6E0;--warn:#7A5300;--accent:#0B6375;--accent-wash:color-mix(in srgb,var(--accent) 12%,#fff);--accent-dark:color-mix(in srgb,var(--accent) 80%,#000);--serif:'Shippori Mincho B1','Hiragino Mincho ProN','Yu Mincho',serif;--sans:'Noto Sans JP',system-ui,-apple-system,'Hiragino Sans','Yu Gothic',sans-serif}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.75}
a{color:var(--accent)}a:hover{color:var(--accent-dark)}
:focus-visible{outline:3px solid #C17800;outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{max-width:560px;margin:0 auto}
main{min-height:100vh;padding-bottom:140px}
main:focus{outline:none}
.page{padding:24px 20px 32px;display:flex;flex-direction:column;gap:18px}
h1,h2,h3,p{margin:0}
.serif{font-family:var(--serif)}
.muted{color:var(--muted)}
.small{font-size:13px;line-height:1.7;color:var(--sub)}
.tiny{font-size:12px;line-height:1.7;color:var(--muted)}

/* 表紙の見出し */
.book-head{display:flex;flex-direction:column;gap:14px}
.series{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);letter-spacing:.06em}
.title-block{border-bottom:2px solid var(--accent);padding-bottom:12px}
.kind{font-size:13px;font-weight:500;color:var(--accent);letter-spacing:.12em}
.book-title{font-family:var(--serif);font-weight:700;font-size:40px;line-height:1.2;letter-spacing:.08em;margin-top:4px}
.book-title.long{font-size:30px;letter-spacing:.04em}
.page-title{font-family:var(--serif);font-weight:700;font-size:26px;line-height:1.4}

/* カード */
.card{background:var(--card);border-radius:12px;padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.card-row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.h-card{font-family:var(--serif);font-size:19px;font-weight:700;line-height:1.4}
.h-sec{font-size:14px;font-weight:700;color:var(--muted);letter-spacing:.06em}
.big{font-size:26px;font-weight:700;line-height:1}
.big small{font-size:14px;font-weight:500;color:var(--muted)}
.bar{height:6px;background:#E3E8EA;border-radius:3px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent)}
.banner{background:var(--warn-bg);color:var(--warn);border-radius:8px;padding:10px 14px;font-size:13px;line-height:1.7}

/* ボタン */
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:10px 18px;border-radius:10px;border:1px solid #C9D2D6;background:#fff;color:var(--ink);font:inherit;font-size:15px;font-weight:500;cursor:pointer;text-align:center;line-height:1.5}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700;min-height:52px;letter-spacing:.04em}
.btn.outline{border:1.5px solid var(--accent);color:var(--accent);font-weight:700}
.btn.link{border:0;background:none;color:var(--accent);padding:0;min-height:44px;justify-content:flex-start;font-size:13px;text-decoration:underline;text-underline-offset:3px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:not(:disabled):hover{filter:brightness(.96)}
.btns{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stack{display:flex;flex-direction:column;gap:10px}

/* 科目の一覧 */
.list{background:var(--card);border-radius:12px;display:flex;flex-direction:column;overflow:hidden}
.row{min-height:60px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 18px;border:0;border-bottom:1px solid #E8ECEE;background:transparent;font:inherit;color:var(--ink);text-align:left;cursor:pointer;width:100%}
.row:last-child{border-bottom:0}
.row:hover{background:#F8FAFA}
.row b{display:block;font-size:15px}
.row span.tiny{display:block}

/* 上の帯 */
.topbar{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line)}
.topbar .in{display:flex;align-items:center;justify-content:space-between;padding:6px 14px 6px 4px;gap:8px}
.back{min-height:44px;display:flex;align-items:center;gap:2px;padding:0 8px;text-decoration:none;color:var(--ink);font-size:15px;font-weight:500;background:none;border:0;font-family:inherit;cursor:pointer}
.back svg{flex:0 0 auto}
.topbar .pos{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;display:flex;gap:12px}
.timer{font-weight:700;color:var(--ink)}
.thin{height:3px;background:#E3E8EA}.thin>i{display:block;height:3px;background:var(--accent)}

/* 問題 */
.chips{display:flex;gap:6px;flex-wrap:wrap;font-size:12px}
.chip{padding:3px 8px;border-radius:4px;background:#E8ECEE;color:var(--sub);line-height:1.6}
.chip.acc{background:var(--accent-wash);color:var(--accent-dark);font-weight:500}
.stem{font-size:18px;line-height:1.85;font-weight:700;white-space:pre-line}
.opts{display:flex;flex-direction:column;gap:8px;border:0;margin:0;padding:0}
.opt{display:flex;align-items:center;gap:12px;min-height:56px;padding:10px 14px;border-radius:10px;background:#fff;border:1px solid var(--line2);cursor:pointer;position:relative}
.opt .n{flex:0 0 auto;width:28px;height:28px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;background:#EEF1F2;color:var(--sub)}
.opt .t{flex:1;font-size:16px;line-height:1.6}
.opt .tag{font-size:12px;font-weight:700;white-space:nowrap}
.opt.sel{border:2px solid var(--accent);background:var(--accent-wash);padding:9px 13px}
.opt.sel .n{background:var(--accent);color:#fff}
.opt.ok{border:2px solid var(--ok);background:var(--ok-bg);padding:9px 13px}
.opt.ok .n{background:var(--ok);color:#fff}.opt.ok .tag{color:var(--ok)}
.opt.ng{border:2px solid var(--bad);background:var(--bad-bg);padding:9px 13px}
.opt.ng .n{background:var(--bad);color:#fff}.opt.ng .tag{color:var(--bad)}
.opt.locked{cursor:default}
.opt:has(input:focus-visible){outline:3px solid #C17800;outline-offset:2px}
.verdict{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.verdict b{font-family:var(--serif);font-size:22px}
.good{color:var(--ok)}.bad{color:var(--bad)}
.why{display:flex;gap:10px;font-size:14px;line-height:1.7}
.why b{flex:0 0 auto;color:var(--muted)}
.why .mark{flex:0 0 auto;font-size:12px;font-weight:700}
.src{border-top:1px solid var(--line2);padding-top:14px;display:flex;flex-direction:column;gap:4px;font-size:12px;line-height:1.7;color:var(--muted);overflow-wrap:anywhere}
.src a{font-size:12px}
.jump{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px}
.jump button{min-height:40px;border-radius:6px;border:1px solid var(--line2);background:#fff;font:inherit;font-size:13px;cursor:pointer;padding:0}
.jump button.done{background:var(--accent-wash);border-color:var(--accent-wash);color:var(--accent-dark);font-weight:700}
.jump button.cur{border:2px solid var(--accent)}

/* 結果 */
.total{display:flex;align-items:baseline;gap:6px}
.total b{font-family:var(--serif);font-size:52px;line-height:1}
.badge{align-self:flex-start;padding:4px 10px;border-radius:4px;font-size:14px;font-weight:700}
.badge.pass{background:var(--ok-bg);color:var(--ok)}.badge.fail{background:var(--bad-bg);color:var(--bad)}
.meter{position:relative;height:10px;background:#E8ECEE;border-radius:5px}
.meter>i{position:absolute;left:0;top:0;height:10px;border-radius:5px}
.meter>u{position:absolute;top:-3px;width:2px;height:16px;background:var(--ink)}
details{background:#fff;border-radius:10px;padding:12px 14px}
details>summary{cursor:pointer;font-size:14px;font-weight:500;min-height:28px}
details[open]>summary{margin-bottom:12px}
details .card{padding:0}

/* 記録・案内 */
.stat{font-size:30px;font-weight:700;line-height:1.2}
.notice-list{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px;font-size:14px;line-height:1.75}
textarea{width:100%;min-height:120px;font:inherit;font-size:15px;border:1px solid var(--line2);padding:10px;border-radius:8px}
label.field{font-size:14px;font-weight:500}
input[type=file]{font:inherit;font-size:14px;max-width:100%}
.warnbox{background:var(--warn-bg);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px;font-size:14px}

/* 下の固定部分 */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:10;background:#fff;border-top:1px solid var(--line)}
.dock .short{font-size:11px;line-height:1.5;color:var(--muted);text-align:center;padding:6px 16px 0}
.tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));padding:2px 4px calc(6px + env(safe-area-inset-bottom))}
.tabs a{min-height:48px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-decoration:none;color:var(--muted);font-size:11px}
.tabs a[aria-current]{color:var(--accent);font-weight:700}
#notice:not(:empty){position:fixed;left:12px;right:12px;bottom:118px;z-index:20;max-width:536px;margin:0 auto;background:var(--ink);color:#fff;border-radius:10px;padding:12px 14px;font-size:14px;line-height:1.6}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}

/* 問題の表 */
.tablewrap{overflow-x:auto;background:#fff;border-radius:10px;border:1px solid var(--line2)}
.tablewrap table{border-collapse:collapse;width:100%;font-size:14px;line-height:1.6}
.tablewrap caption{text-align:left;font-size:13px;color:var(--sub);padding:10px 12px 0}
.tablewrap th,.tablewrap td{padding:10px 12px;border-bottom:1px solid #E8ECEE;text-align:left;vertical-align:top}
.tablewrap th{background:#F3F5F6;font-weight:700;white-space:nowrap}
.tablewrap tr:last-child td{border-bottom:0}
/* 模擬試験の範囲 */
.scope{border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.scope-opt{display:flex;align-items:flex-start;gap:10px;min-height:44px;padding:10px 12px;border:1px solid var(--line2);border-radius:8px;font-size:14px;line-height:1.6;cursor:pointer}
.scope-opt input{margin-top:4px;accent-color:var(--accent);width:18px;height:18px;flex:0 0 auto}
.scope-opt:has(input:checked){border:2px solid var(--accent);padding:9px 11px;background:var(--accent-wash)}

</style>
</head>

em": "体積が変化しない器材を、全体が水没するよう淡水から海水へ移した。同じ場所の重力加速度とすると、浮力はどうなるか。", "options": ["器材の色で決まる", "密度に関係なく同じ", "大きくなる", "小さくなる", "必ずゼロになる"], "answer": 3, "explanation": "浮力は排除した水の重さに等しい。同体積なら水の密度が大きいほど浮力が大きい。", "option_explanations": ["色は浮力を決める量ではない。", "同体積でも排除する水の質量が異なる。", "海水の密度が大きいので排除した水の重さが増す。", "密度の影響を逆にしている。", "水没した器材には浮力が働く。"], "sources": [{"name": "2026年10月公表 潜水士免許試験（傾向・基礎事項確認）", "section": "問1", "url": "https://www.exam.or.jp/wp-content/uploads/2026/10/LC20262119.pdf", "checked_at": "2026-10-18", "local_source": "2026-10.txt"}], "source_checked_at": "2026-10-18", "verification_status": "AI資料照合済・販売用最終採用保留・専門家未監修", "calculation": null}, {"id": "DV-1-004", "subject": "潜水業務", "topic": "浮力と中性浮力", "difficulty": "標準", "type": "計算", "stem": "質量18 kg、外形体積15 Lの変形しない密閉容器を淡水中に完全に沈める。淡水1 Lの質量を1 kg、g＝9.8 m/s²とすると、容器に働く重力と浮力の合力はどれか。", "options": ["上向き29.4 N", "下向き176.4 N", "上向き147 N", "0 N", "下向き29.4 N"], "answer": 5, "explanation": "重力18×9.8、浮力15×9.8。差は(18−15)×9.8＝29.4 Nで下向き。", "option_explanations": ["合力の向きが逆。", "浮力を引いていない。", "浮力のみで重力を考慮していない。", "質量と排水の質量が等しくない。", "重力176.4 Nから浮力147 Nを差し引く。"], "sources": [{"name": "2026年4月公表 潜水士免許試験（傾向・基礎事項確認）", "section": "問2", "url": "https://www.exam.or.jp/wp-content/uploads/2026/04/LC20260419-1.pdf", "checked_at": "2026-10-18", "local_source": "2026-04.txt"}, {"name": "2026年10月公表 潜水士免許試験（傾向・基礎事項確認）", "section": "問1", "url": "https://www.exam.or.jp/wp-content/uploads/2026/10/LC20262119.pdf", "checked_at": "2026-10-18", "local_source": "2026-10.txt"}], "source_checked_at": "2026-10-18", "verification_status": "AI資料照合済・販売用最終採用保留・専門家未監修", "calculation": {"expression": "(18-15)*9.8", "expected": 29.4, "unit": "N（下向き）"}}, {"id": "DV-1-005", "subject": "潜水業務", "topic": "パスカルの原理", "difficulty": "標準", "type": "計算", "stem": "連通した液体のピストンで、受圧面積を入力側の4倍にした出力側に生じる力は、入力の何倍か。摩擦と高さの差を無視する。", "options": ["0.25倍", "4倍", "2倍", "16倍", "1倍"], "answer": 2, "explanation": "同じ圧力ならF＝pA。出力面積が4倍なので力も4倍。", "option_explanations": ["面積比を逆にしている。", "圧力が等しいため力は受圧面積に比例する。", "面積比の平方根を使っている。", "面積比をさらに二乗している。", "力と圧力を混同している。"], "sources": [{"name": "2026年10月公表 潜水士免許試験（傾向・基礎事項確認）", "section": "問1", "url": "https://www.exam.or.jp/wp-content/uploads/2026/10/LC20262119.pdf", "checked_at": "2026-10-18", "local_source": "2026-10.txt"}], "source_checked_at": "2026-10-18", "verification_status": "AI資料照合済・販売用最終採用保留・専門家未監修", "calculation": {"expression": "4/1", "expected": 4, "unit": "倍"}}, {"id": "DV-1-006", "subject": "潜水業務", "topic": "ボイルの法則", "difficulty": "標準", "type": "理解", "stem": "柔らかい密閉袋内の気体を、温度一定のまま絶対圧力が半分の場所へ移す。漏れも袋の張力も無視できるとき、気体の体積はどうなるか。", "options": ["4倍になる", "変わらない", "ゼロになる", "2倍になる", "半分になる"], "answer": 4, "explanation": "温度と気体量が一定ならP₁V₁＝P₂V₂。絶対圧力が1/2になると体積は2倍になる。", "option_explanations": ["圧力比を二乗する法則ではない。", "柔らかい袋で圧力変化を受ける条件に合わない。", "気体が消失するわけではない。", "圧力と体積の積が一定なので逆比例する。", "圧力と体積を比例させている。"], "sources": [{"name": "2026年10月公表 潜水士免許試験（傾向・基礎事項確認）", "section": "問2", "url": "https://www.exam.or.jp/wp-content/uploads/2026/10/LC20262119.pdf", "checked_at": "2026-10-18", "local_source": "2026-10.txt"}], "source_checked_at": "2026-10-18", "verification_status": "AI資料照合済・販売用最終採用保留・専門家未監修", "calculation": null}, {"id": "DV-1-007", "subject": "潜水業務", "topic": "分圧と溶解", "difficulty": "標準", "type": "計算", "stem": "酸素濃度30％の混合ガスを絶対圧力0.40 MPaで吸入する。酸素分圧は何kPaか。", "options": ["120 kPa", "12 kPa", "30 kPa", "280 kPa", "400 kPa"], "answer": 1, "explanation": "分圧＝絶対圧力×体積割合。0.40×1000×0.30＝120 kPa。", "option_explanations": ["400 kPaの30％を求める。", "MPaからkPaへの換算が一桁小さい。", "濃度だけを圧力と取り違えている。", "酸素以外の70％を求めている。", "全圧を酸素分圧としている。"], "sources": [{"name": "2026年10月公表 潜水士免許試験（傾向・基礎事項確認）", "section": "問4", "url": "https://www.exam.or.jp/wp-content/uploads/2026/10/LC20262119.pdf", "checked_at": "2026-10-18", "local_source": "2026-10.txt"}, {"name": "高気圧作業安全衛生規則（2026年4月1日施行版）", "section": "第15条・第27条", "url": "https://laws.e-gov.go.jp/law/347M50002000040/20260401_508M60000100003", "checked_at": "2026-10-18", "local_source": "law-compact.txt"}], "source_checked_at": "2026-10-18", "verification_status": "AI資料照合済・販売用最終採用保留・専門家未監修", "calculation": {"expression": "0.4*1000*0.3", "expected": 120, "unit": "kPa"}}, {"id": "DV-1-008", "subject": "潜水業務", "topic": "分圧と溶解", "difficulty": "標準", "type": "理解", "stem": "温度一定の液体に、溶解度が小さい気体が平衡まで溶ける。接する気体の当該成分の分圧を3倍にすると、溶ける質量はどうなるか。", "options": ["変化しない", "必ずゼロ", "約3倍", "約1/3", "約9倍"], "answer": 3, "explanation": "他の条件が同じなら、液体に溶ける気体の質量はその気体の分圧に比例する。", "option_explanations": ["一定温度でも分圧により変化する。", "加圧で溶けなくなるわけではない。", "ヘンリーの法則により分圧に比例する。", "分圧と逆比例するわけではない。", "二乗比例ではない。"], "sources": [{"name": "2026年4月公表 潜水士免許試験（傾向・基礎事項確認）", "section": "問3・問4", "url": "https://www.exam.or.jp/wp-content/uploads/2026/04/LC20260419-1.pdf", "checked_at": "2026-10-18", "local_source": "2026-04.txt"}], "source_checked_at": "2026-10-18", "verification_status": "AI資料照合済・販売用最終採用保留・専門家未監修", "calculation": null}, {"id": "DV-1-009", "subject": "潜水業務", "topic": "気体の性質", "difficulty": "基本", "type": "知識", "stem": "呼吸ガス成分のヘリウムの特徴として適切なものはどれか。", "options": ["強い酸化剤である", "空気の大部分を占める", "常温で容易に他元素と反応する", "高密度なので呼吸抵抗を減らす", "低密度で化学的に安定している"], "answer": 5, "explanation": "ヘリウムは軽く化学的に安定した不活性ガス。深い潜水の混合ガスに利用される。", "option_explanations": ["酸素のような性質ではない。", "空気の主成分は窒素。", "化学的に安定した気体。", "密度が小さいことが呼吸抵抗低減につながる。", "呼吸抵抗の軽減に用いられる不活性ガス。"], "sources": [{"name": "2026年4月公表 潜水士免許試験（傾向・基礎事項確認）", "section": "問3", "url": "https://www.exam.or.jp/wp-content/uploads/2026/04/LC20260419-1.pdf", "checked_at": "2026-10-18", "local_source": "2026-04.txt"}, {"name": "2026年10月公表 潜水士免許試験（傾向・基礎事項確認）", "section": "問3", "url": "https://www.exam.or.jp/wp-content/uploads/2026/10/LC20262119.pdf", "checked_at": "2026-10-18", "local_source": "2026-10.txt"}], "source_checked_at": "2026-10-18", "verification_status": "AI資料照合済・販売用最終採用保留・専門家未監修", "calculation": null}, {"id": "DV-1-010", "subject": "潜水業務", "topic": "水中の光", "difficulty": "標準", "type": "理解", "stem": "澄んだ水中で空気層のある面マスクを通して近くの工具を見る。一般的な見え方はどれか。", "options": ["すべての色が同じ割合で吸収される", "実物より大きく近く見える", "実物より小さく近く見える", "実物より大きく遠く見える", "大きさも距離も常に同じ"], "answer": 2, "explanation": "澄んだ水中では通常、近くの物体はおよそ4/3倍に、距離はおよそ3/4に見える。濁りなどによる例外とは区別する。", "option_explanations": ["波長により吸収が異なる。", "屈折による見かけの大きさと距離の変化。", "大きさの変化が逆。", "距離の変化が逆。", "空気と水の境界での屈折を無視している。"], "sources": [{"name": "2026年10月公表 潜水士免許試験（傾向・基礎事項確認）", "section": "問5", "url": "https://www.exam.or.jp/wp-content/uploads/2026/10/LC20262119.pdf", "checked_at": "2026-10-18", "local_source": "2026-10.txt"}], "source_checked_at": "2026-10-18", "verification_status": "AI資料照合済・販売用最終採用保留・専門家未監修", "calculation": null}, {"id": "DV-1-011", "subject": "潜水業務", "topic": "水中の音", "difficulty": "応用", "type": "判断", "stem": "水中で機械音を聞いた。音だけで機械の方向を決めて接近することの問題点はどれか。", "options": ["水中では空気中より音が遅い", "低い音だけは必ず正確に測位できる", "マスクがあれば方向誤認はなくなる", "水中では音源の方向が分かりにくい", "水中では音が伝わらない"], "answer": 4, "explanation": "水中の音速は約1500 m/sで空気中より速く、両耳の到達時間差による方向探知が難しくなる。", "option_explanations": ["一般に水中の方が速い。", "このような保証はない。", "マスクで両耳効果の問題は解消しない。", "両耳効果が小さくなるため方向判断は困難。", "音は水中でも伝わる。"], "sources": [{"name": "2026年10月公表 潜水士免許試験（傾向・基礎事項確認）", "section": "問5", "url": "https://www.exam.or.jp/wp-content/uploads/2026/10/LC20262119.pdf", "checked_at": "2026-10-18", "local_source": "2026-10.txt"}], "source_checked_at": "2026-10-18", "verification_status": "AI資料照合済・販売用最終採用保留・専門家未監修", "calculation": null}, {"id": "DV-1-012", "subject": "潜水業務", "topic": "潜水方式と呼吸ガス", "difficulty": "基本", "type": "知識", "stem": "ヘリオックスとトライミックスを区別した説明はどれか。", "options": ["トライミックスは酸素・窒素・ヘリウムの混合", "ヘリオックスは酸素と二酸化炭素", "トライミックスは酸素100％", "両者とも空気と同一組成", "ヘリオックスには酸素がない"], "answer": 1, "explanation": "ヘリオックスはヘリウム＋酸素、トライミックスはこれに窒素を加えた三種混合ガス。", "option_explanations": ["ヘリオックスは酸素とヘリウム。", "二酸化炭素を主成分にしない。", "三種混合ガスであり純酸素ではない。", "ヘリウムを含む組成である。", "呼吸に必要な酸素を含む。"], "sources": [{"name": "2026年10月公表 潜水士免許試験（傾向・基礎事項確認）", "section": "問6", "url": "https://www.exam.or.jp/wp-content/uploads/2026/10/LC20262119.pdf", "checked_at": "2026-10-18", "local_source": "2026-10.txt"}], "source_checked_at": "2026-10-18", "verification_status": "AI資料照合済・販売用最終採用保留・専門家未監修", "calculation": null}, {"id": "DV-1-013", "subject": "潜水業務", "topic": "潜水方式と呼吸ガス", "difficulty": "標準", "type": "理解", "stem": "送気式と自給気式を分ける基準はどれか。", "options": ["潜水服の色", "免許証の交付場所", "呼吸ガスを水上などから受けるか、携行するか", "潜水者の経験年数", "淡水か海水か"], "answer": 3, "explanation": "送気式は外部からホースで送気を受け、自給気式は携行したガス源などを用いる。", "option_explanations": ["装備の色によらない。", "免許交付場所によらない。", "供給源の位置と携行の有無で分ける。", "方式の分類基準ではない。", "水質による分類ではない。"], "sources": [{"name": "2026年4月公表 潜水士免許試験（傾向・基礎事項確認）", "section": "問6", "url": "https://www.exam.or.jp/wp-content/uploads/2026/04/LC20260419-1.pdf", "checked_at": "2026-10-18", "local_source": "2026-04.txt"}], "source_checked_at": "2026-10-18", "verification_status": "AI資料照合済・販売用最終採用保留・専門家未監修", "calculation": null}, {"id": "DV-1-014", "subject": "潜水業務", "topic": "潮流と作業負荷", "difficulty": "応用", "type": "判断", "stem": "潮流が強まる予測がある作業について、安全管理上最も適切な評価はどれか。", "options": ["疲労と減圧症は無関係とする", "ホースを常に張り切れば解決する", "呼吸を減らせば負荷が解消する", "流れが強いほどすべての潜水方式で安全になる", "作業負荷の増加と減圧症リスクを考慮する"], "answer": 5, "explanation": "潮流による負荷は運動量とガス消費を増やす。出題上も重筋作業や強い潮流は減圧症の危険因子として扱われる。", "option_explanations": ["強い作業負荷はリスク要因。", "ホース張力による危険もある。", "意図的な呼吸抑制は不適切。", "抵抗や拘束の危険は増える。", "強い流れへの抵抗は重労働につながる。"], "sources": [{"name": "2026年10月公表 潜水士免許試験（傾向・基礎事項確認）", "section": "問7・問28", "url": "https://www.exam.or.jp/wp-content/uploads/2026/10/LC20262119.pdf", "checked_at": "2026-10-18", "local_source": "2026-10.txt"}], "source_checked_at": "2026-10-18", "verification_status": "AI資料照合済・販売用最終採用保留・専門家未監修", "calculation": null}, {"id": "DV-1-015", "subject": "潜水業務", "topic": "水中溶接・溶断", "difficulty": "標準", "type": "理解", "stem": "水中溶断に関する危険性の評価として適切なのはどれか。", "options": ["潜水士免許があれば危険源は消える", "感電に加え、滞留ガスの爆発にも注意する", "水中なのでガス爆発は起こらない", "水は絶縁体なので感電しない", "空気中の作業より必ず危険が小さい"], "answer": 2, "explanation": "水中溶接・溶断には電気とガスの両方の危険がある。作業環境に応じた危険源の除去が必要。", "option_explanations": ["免許取得は危険源の除去ではない。", "水中でも発生・滞留したガスの爆発があり得る。", "水の存在だけでは爆発を排除できない。", "作業水域の水は電流を通し得る。", "作業条件を無視した断定。"], "sources": [{"name": "2026年4月公表 潜水士免許試験（傾向・基礎事項確認）", "section": "問7", "url": "https://www.exam.or.jp/wp-content/uploads/2026/04/LC20260419-1.pdf", "checked_at": "2026-10-18", "local_source": "2026-04.txt"}], "source_checked_at": "2026-10-18", "verification_status": "AI資料照合済・販売用最終採用保留・専門家未監修", "calculation": null}, {"id": "DV-1-016", "subject": "潜水業務", "topic": "潜水墜落と吹き上げ", "difficulty": "標準", "type": "理解", "stem": "ヘルメット式潜水で送気が不足し、潜水服内部の圧力が周囲の水圧より低下した。対応する危険はどれか。", "options": ["酸素分圧が必ず上がる", "水圧が消失する", "浮力が必ず増える", "潜水墜落", "吹き上げだけが起こる"], "answer": 4, "explanation": "内部圧力が外圧を下回ると服内気体が圧縮され、浮力低下と潜水墜落の危険につながる。", "option_explanations": ["送気不足から酸素分圧上昇は導けない。", "周囲の水圧はなくならない。", "服内気体の圧縮で浮力は減り得る。", "服が圧縮され浮力が減る側の異常。", "内部過圧で浮力が増す側の異常と逆。"], "sources": [{"name": "2026年10月公表 潜水士免許試験（傾向・基礎事項確認）", "section": "問8", "url": "https://www.exam.or.jp/wp-content/uploads/2026/10/LC20262119.pdf", "checked_at": "2026-10-18", "local_source": "2026-10.txt"}], "source_checked_at": "2026-10-18", "verification_status": "AI資料照合済・販売用最終採用保留・専門家未監修", "calculation": null}, {"id": "DV-1-017", "subject": "潜水業務", "topic": "潜水墜落と吹き上げ", "difficulty": "応用", "type": "判断", "stem": "ドライスーツ内の気体の排出が不十分なまま浮上した。警戒すべき現象はどれか。", "options": ["気体膨張と浮力増加による吹き上げ", "送気ホースがないので吹き上げは起こらない", "水深が浅くなるほど服内気体が圧縮する", "服内気体の量に関係なく浮力は一定", "空気消費量が必ずゼロになる"], "answer": 1, "explanation": "ドライスーツでも服内気体の過剰な膨張で吹き上げが起こる。排気操作と浮上管理の訓練が重要。", "option_explanations": ["浮上に伴う膨張がさらなる浮上を招く。", "スクーバでもドライスーツにより起こり得る。", "圧力低下により膨張する。", "気体体積が浮力を変える。", "浮力異常と呼吸ガス消費は別。"], "sources": [{"name": "2026年4月公表 潜水士免許試験（傾向・基礎事項確認）", "section": "問8", "url": "https://www.exam.or.jp/wp-content/uploads/2026/04/LC20260419-1.pdf", "checked_at": "2026-10-18", "local_source": "2026-04.txt"}, {"name": "2026年10月公表 潜水士免許試験（傾向・基礎事項確認）", "section": "問8", "url": "https://www.exam.or.jp/wp-content/uploads/2026/10/LC20262119.pdf", "checked_at": "2026-10-18", "local_source": "2026-10.txt"}], "source_checked_at": "2026-10-18", "verification_status": "AI資料照合済・販売用最終採用保留・専門家未監修", "calculation": null}, {"id": "DV-1-018", "subject": "潜水業務", "topic": "拘束・取水口", "difficulty": "応用", "type": "判断", "stem": "取水口の近くで吸込み流が予想される。作業計画で重視すべき危険はどれか。", "options": ["足ヒレの大きさだけで安全が決まる", "透明な水なら吸込みは無害", "圧力差や水流で吸着・拘束されること", "空気ボンベがあれば拘束されない", "水中なので吸込み力は生じない"], "answer": 3, "explanation": "取水口では身体の一部が吸い込まれたり差圧で動けなくなったりする。現場の隔離と取水停止などを計画段階で検討する。", "option_explanations": ["危険源管理が必要。", "視認性と吸込み危険は別。", "自由に泳いで離脱できない危険がある。", "ガス源の携行は吸込みを防がない。", "取水による流れや差圧が生じる。"], "sources": [{"name": "2026年4月公表 潜水士免許試験（傾向・基礎事項確認）", "section": "問9", "url": "https://www.exam.or.jp/wp-content/uploads/2026/04/LC20260419-1.pdf", "checked_at": "2026-10-18", "local_source": "2026-04.txt"}, {"name": "2026年10月公表 潜水士免許試験（傾向・基礎事項確認）", "section": "問9", "url": "https://www.exam.or.jp/wp-content/uploads/2026/10/LC20262119.pdf", "checked_at": "2026-10-18", "local_source": "2026-10.txt"}], "source_checked_at": "2026-10-18", "verification_status": "AI資料照合済・販売用最終採用保留・専門家未監修", "calculation": null}, {"id": "DV-1-019", "subject": "潜水業務", "topic": "拘束・取水口", "difficulty": "応用", "type": "判断", "stem": "水中拘束から脱出したが、予定より滞在時間が長くなった。減圧計画の考え方として適切なのはどれか。", "options": ["当初の減圧時間を無条件に使う", "延長時間だけ浮上停止を短縮する", "拘束中は窒素が溶けないとする", "症状がなければ急浮上する", "実際の深度・時間の履歴を踏まえて再評価する"], "answer": 5, "explanation": "延長した潜水履歴に応じた減圧の再評価が必要。事故時は訓練された救出・医療連絡体制に従う。", "option_explanations": ["実ばく露と一致しない可能性がある。", "一般に逆方向の危険な判断。", "呼吸を続けていれば不活性ガスばく露は続く。", "症状の有無は急浮上の許可条件ではない。", "延長したばく露を無視できない。"], "sources": [{"name": "2026年10月公表 潜水士免許試験（傾向・基礎事項確認）", "section": "問9", "url": "https://www.exam.or.jp/wp-content/uploads/2026/10/LC20262119.pdf", "checked_at": "2026-10-18", "local_source": "2026-10.txt"}], "source_checked_at": "2026-10-18", "verification_status": "AI資料照合済・販売用最終採用保留・専門家未監修", "calculation": null}, {"id": "DV-1-020", "subject": "潜水業務", "topic": "特殊環境", "difficulty": "応用", "type": "判断", "stem": "山間部の高所にある湖で潜水する。海面付近の計画をそのまま流用できない理由はどれか。", "options": ["水深計を持てば大気圧の差は消える", "水面の大気圧が低く減圧条件が異なる", "高所では水圧が全くない", "高所では窒素が体内に溶けない", "淡水では減圧症にならない"], "answer": 2, "explanation": "高所では大気圧が低く、通常の海洋より慎重な減圧条件が必要。海面用計画の無補正流用は適切でない。", "option_explanations": ["測定と減圧条件の補正は別。", "高所域では海面と同じ深度でも浮上後の圧力条件が違う。", "水深による水圧はある。", "圧力条件に応じて溶解する。", "水質では防げない。"], "sources": [{"name": "2026年4月公表 潜水士免許試験（傾向・基礎事項確認）", "section": "問10", "url": "https://www.exam.or.jp/wp-content/uploads/2026/04/LC20260419-1.pdf", "checked_at": "2026-10-18", "local_source": "2026-04.txt"}, {"name": "2026年10月公表 潜水士免許試験（傾向・基礎事項確認）", "section": "問10", "url": "https://www.exam.or.jp/wp-content/uploads/2026/10/LC20262119.pdf", "checked_at": "2026-10-18", "local_source": "2026-10.txt"}], "source_checked_at": "2026-10-18", "verification_status": "AI資料照合済・販売用最終採用保留・専門家未監修", "calculation": null}, {"id": "DV-1-021", "subject": "潜水業務", "topic": "特殊環境", "difficulty": "応用", "type": "判断", "stem": "低水温域で使用する潜水呼吸器の選定で適切なのはどれか。", "options": ["保温服さえあれば呼吸器の仕様は不要", "凍結したら呼吸を止めて作業する", "高水温用の仕様を無条件で流用する", "デマンドバルブの凍結対策を確認する", "水中では凍結が起こらないとする"], "answer": 4, "explanation": "冷水域では呼吸器の凍結を想定し、対応仕様と取扱いを確認する。", "option_explanations": ["人体と器材双方への対策が必要。", "呼吸停止は危険。", "使用条件への適合確認が必要。", "冷水で凍結による作動不良が起こり得る。", "減圧時の冷却などを含め凍結し得る。"], "sources": [{"name": "2026年4月公表 潜水士免許試験（傾向・基礎事項確認）", "section": "問10", "url": "https://www.exam.or.jp/wp-content/uploads/2026/04/LC20260419-1.pdf", "checked_at": "2026-10-18", "local_source": "2026-04.txt"}, {"name": "2026年10月公表 潜水士免許試験（傾向・基礎事項確認）", "section": "問10", "url": "https://www.exam.or.jp/wp-content/uploads/2026/10/LC20262119.pdf", "checked_at": "2026-10-18", "local_source": "2026-10.txt"}], "source_checked_at": "2026-10-18", "verification_status": "AI資料照合済・販売用最終採用保留・専門家未監修", "calculation": null}, {"id": "DV-1-022", "subject": "潜水業務", "topic": "特殊環境", "difficulty": "応用", "type": "判断", "stem": "汚染が著しい水域における装備計画として適切な方向はどれか。", "options": ["身体の露出を減らし送気式など適切な防護を検討する", "裸出部を増やして動きやすくする", "透明なら汚染はないとする", "スクーバであれば汚染物質を除去できる", "飲水して汚染の有無を確かめる"], "answer": 1, "explanation": "汚染水では露出を少なくした装備と適切な潜水方式を選定する。汚染物質に応じた専門的評価が必要。", "option_explanations": ["水との接触と呼吸系への汚染を考える。", "汚染水との接触が増える。", "透明度だけでは汚染を評価できない。", "方式だけで水の汚染を除去できない。", "危険な確認方法。"], "sources": [{"name": "2026年10月公表 潜水士免許試験（傾向・基礎事項確認）", "section": "問10", "url": "https://www.exam.or.jp/wp-content/uploads/2026/10/LC20262119.pdf", "checked_at": "2026-10-18", "local_source": "2026-10.txt"}], "source_checked_at": "2026-10-18", "verification_status": "AI資料照合済・販売用最終採用保留・専門家未監修", "calculation": null}, {"id": "DV-2-001", "subject": "送気、潜降及び浮上", "topic": "送気系統と空気槽", "difficulty": "基本", "type": "知識", "stem": "送気系統で、コンプレッサーが生む圧力変動を和らげる主な設備はどれか。", "options": ["水中時計", "潜水靴", "調節用空気槽", "足ヒレ", "水深計"], "answer": 3, "explanation": "調節用空気槽は送気の脈動を緩和し、水分・油分の分離にも役立つ。", "option_explanations": ["時間を測定する器具。", "姿勢の安定に用いる装具。", "脈動を緩和する役割がある。", "推進の器具で送気系統ではない。", "深度の測定器。"], "sources": [{"name": "2026年10月公表 潜水士免許試験（傾向・基礎事項確認）", "section": "問11・問13", "url": "https://www.exam.or.jp/wp-content/uploads/2026/10/LC20262119.pdf", "checked_at": "2026-10-18", "local_source": "2026-10.txt"}], "source_checked_at": "2026-10-18", "verification_status": "AI資料照合済・販売用最終採用保留・専門家未監修", "calculation": null}, {"id": "DV-2-002", "subject": "送気、潜降及び浮上", "topic": "送気系統と空気槽", "difficulty": "応用", "type": "判断", "stem": "主コンプレッサーが故障した場合に備える設備の役割として適切なのはどれか。", "options": ["予備空気槽で潜水者の体温を測る", "水中時計に呼吸空気を蓄える", "流量計が自動的に空気を生成する", "送気管の逆止弁が無限の空気を供給する", "予備空気槽に非常時用の呼吸空気を蓄える"], "answer": 5, "explanation": "予備空気槽は事故時に必要な空気を確保する。調節用空気槽が所定基準を満たす等の例外は法令科目で区別する。", "option_explanations": ["用途が異なる。", "計時器であり貯気装置ではない。", "流量計は測定装置。", "逆流防止弁に空気生成機能はない。", "送気停止に備えるための設備。"], "sources": [{"name": "2026年4月公表 潜水士免許試験（傾向・基礎事項確認）", "section": "問12", "url": "https://www.exam.or.jp/wp-content/uploads/2026/04/LC20260419-1.pdf", "checked_at": "2026-10-18", "local_source": "2026-04.txt"}, {"name": "2026年10月公表 潜水士免許試験（傾向・基礎事項確認）", "section": "問13", "url": "https://www.exam.or.jp/wp-content/uploads/2026/10/LC20262119.pdf", "checked_at": "2026-10-18", "local_source": "2026-10.txt"}], "source_checked_at": "2026-10-18", "verification_status": "AI資料照合済・販売用最終採用保留・専門家未監修", "calculation": null}, {"id": "DV-2-003", "subject": "送気、潜降及び浮上", "topic": "コンプレッサー", "difficulty": "応用", "type": "判断", "stem": "船上の呼吸用コンプレッサーの吸気口付近に排気ガスが流れ込む。最も適切な判断はどれか。", "options": ["圧力が高ければ汚染は無関係", "汚染空気を取り込む危険があるため配置を改善する", "圧縮すれば一酸化炭素は必ず分解する", "水分フィルターだけで全有害ガスを除去できる", "臭いがなければ安全とする"], "answer": 2, "explanation": "吸気が汚染されると呼吸ガスに有害成分が混入する。固定式コンプレッサーの吸気口は機関室外に設ける。", "option_explanations": ["有害成分の吸入につながる。", "呼吸用空気源を汚染源から離す必要がある。", "圧縮だけでは除去できない。", "除去能力を過大評価している。", "一酸化炭素は無臭。"], "sources": [{"name": "2026年4月公表 潜水士免許試験（傾向・基礎事項確認）", "section": "問3・問12・問13", "url": "https://www.exam.or.jp/wp-content/uploads/2026/04/LC20260419-1.pdf", "checked_at": "2026-10-18", "local_source": "2026-04.txt"}], "source_checked_at": "2026-10-18", "verification_status": "AI資料照合済・販売用最終採用保留・専門家未監修", "calculation": null}, {"id": "DV-2-004", "subject": "送気、潜降及び浮上", "topic": "コンプレッサー", "difficulty": "基本", "type": "知識", "stem": "コンプレッサーの機能を維持する点検の説明として適切なのはどれか。", "options": ["外観の塗色だけで性能を判定する", "故障するまで点検を行わない", "圧力上昇で効率が常に増すので冷却不要", "伝動部・冷却部・圧縮部・潤滑部などを確認する", "圧縮部以外の点検は不要"], "answer": 4, "explanation": "駆動伝達、冷却、圧縮、潤滑を含めた点検で性能を維持する。", "option_explanations": ["内部機能を評価できない。", "予防的保守に反する。", "圧縮効率と冷却の理解が誤り。", "機械全体の保守が必要。", "冷却や潤滑も機能維持に必要。"], "sources": [{"name": "2026年4月公表 潜水士免許試験（傾向・基礎事項確認）", "section": "問12", "url": "https://www.exam.or.jp/wp-content/uploads/2026/04/LC20260419-1.pdf", "checked_at": "2026-10-18", "local_source": "2026-04.txt"}], "source_checked_at": "2026-10-18", "verification_status": "AI資料照合済・販売用最終採用保留・専門家未監修", "calculation": null}, {"id": "DV-2-005", "subject": "送気、潜降及び浮上", "topic": "空気清浄・計器", "difficulty": "標準", "type": "理解", "stem": "フェルトを使う水分・油分分離装置について、適切でない説明はどれか。", "options": ["一酸化炭素を確実に除去する機能", "送気中の水分を分離する機能", "送気中の油分を分離する機能", "汚れに応じて保守が必要なこと", "呼吸空気清浄化の一部を担うこと"], "answer": 1, "explanation": "分離装置の対象物質を区別する。水分・油分を取るフェルトだけで一酸化炭素や二酸化炭素まで除去できるとはいえない。", "option_explanations": ["水分油分の分離と有害ガス除去は同じではない。", "本来の対象である。", "本来の対象である。", "保守が必要なのは正しい。", "限定された機能として正しい。"], "sources": [{"name": "2026年4月公表 潜水士免許試験（傾向・基礎事項確認）", "section": "問13", "url": "https://www.exam.or.jp/wp-content/uploads/2026/04/LC20260419-1.pdf", "checked_at": "2026-10-18", "local_source": "2026-04.txt"}], "source_checked_at": "2026-10-18", "verification_status": "AI資料照合済・販売用最終採用保留・専門家未監修", "calculation": null}, {"id": "DV-2-006", "subject": "送気、潜降及び浮上", "topic": "送気ホース", "difficulty": "基本", "type": "知識", "stem": "送気ホースの「沈用・半浮用・浮用」という区分が主に表すものはどれか。", "options": ["潜水者の年齢", "時間計の測定範囲", "比重による水中での挙動", "酸素濃度の違い", "免許の種類"], "answer": 3, "explanation": "送気ホースには比重による種類があり、作業条件に応じて選ぶ。", "option_explanations": ["使用者の年齢区分ではない。", "ホースと計時は別。", "沈むか浮くかの性質を使い分ける。", "ガス濃度の区分ではない。", "ホース特性の区分。"], "sources": [{"name": "2026年4月公表 潜水士免許試験（傾向・基礎事項確認）", "section": "問13", "url": "https://www.exam.or.jp/wp-content/uploads/2026/04/LC20260419-1.pdf", "checked_at": "2026-10-18", "local_source": "2026-04.txt"}], "source_checked_at": "2026-10-18", "verification_status": "AI資料照合済・販売用最終採用保留・専門家未監修", "calculation": null}, {"id": "DV-2-007", "subject": "送気、潜降及び浮上", "topic": "呼吸ガス量計算", "difficulty": "標準", "type": "計算", "stem": "内容積12 Lのボンベをゲージ圧力18 MPaから6 MPaまで使う。大気圧0.10 MPa、温度一定の理想気体として、利用できるガスの大気圧換算体積はどれか。", "options": ["144 L", "2160 L", "720 L", "120 L", "1440 L"], "answer": 5, "explanation": "利用量＝内容積×(開始ゲージ圧−終了ゲージ圧)÷大気圧＝12×(18−6)/0.1＝1440 L。実作業の安全余裕の計画ではない。", "option_explanations": ["一桁小さい。", "開始圧だけを使い残す圧力を引いていない。", "残圧分の量だけを求めている。", "内容積12 Lを計算に反映していない。", "圧力差12 MPaと内容積から求める。"], "sources": [{"name": "2026年10月公表 潜水士免許試験（傾向・基礎事項確認）", "section": "問12", "url": "https://www.exam.or.jp/wp-content/uploads/2026/10/LC20262119.pdf", "checked_at": "2026-10-18", "local_source": "2026-10.txt"}], "source_checked_at": "2026-10-18", "verification_status": "AI資料照合済・販売用最終採用保留・専門家未監修", "calculation": {"expression": "12*(18-6)/0.1", "expected": 1440, "unit": "L"}}, {"id": "DV-2-008", "subject": "送気、潜降及び浮上", "topic": "呼吸ガス量計算", "difficulty": "標準", "type": "計算", "stem": "現地圧力下で毎分24 L呼吸する潜水者が、絶対圧力0.30 MPaの深度に20分滞在する。大気圧0.10 MPa、温度一定として、大気圧換算の消費量はどれか。移動中や予備のガスは含めない。", "options": ["4320 L", "1440 L", "480 L", "160 L", "72 L"], "answer": 2, "explanation": "現地体積を大気圧換算すると3倍。24×20×3＝1440 L。潜降浮上や緊急用を含まない限定条件の計算。", "option_explanations": ["圧力比を二重に掛けている。", "24×20×0.30/0.10。", "圧力比を掛けていない。", "圧力比で割っている。", "時間20分を掛けていない。"], "sources": [{"name": "2026年10月公表 潜水士免許試験（傾向・基礎事項確認）", "section": "問12", "url": "https://www.exam.or.jp/wp-content/uploads/2026/10/LC20262119.pdf", "checked_at": "2026-10-18", "local_source": "2026-10.txt"}], "source_checked_at": "2026-10-18", "verification_status": "AI資料照合済・販売用最終採用保留・専門家未監修", "calculation": {"expression": "24*20*0.3/0.1", "expected": 1440, "unit": "L"}}, {"id": "DV-2-009", "subject": "送気、潜降及び浮上", "topic": "潜降・呼吸", "difficulty": "応用", "type": "判断", "stem": "スクーバで呼吸ガスを節約するため、意図的に息を止める間欠呼吸を提案された。適切な評価はどれか。", "options": ["浮上中だけ行う", "深いほど安全になる", "残圧が少なければ必ず実施する", "二酸化炭素蓄積などの危険があり行わない", "すべての潜水で推奨される"], "answer": 4, "explanation": "意図的な間欠呼吸は二酸化炭素蓄積などを招く。呼吸を続け、ガス量を管理する。", "option_explanations": ["肺過膨張の危険も増す。", "深度で安全にはならない。", "ガス不足への対策は計画と浮上判断。", "スキップ・ブリージングは不適切。", "呼吸抑制を推奨しない。"], "sources": [{"name": "2026年10月公表 潜水士免許試験（傾向・基礎事項確認）", "section": "問14", "url": "https://www.exam.or.jp/wp-content/uploads/2026/10/LC20262119.pdf", "checked_at": "2026-10-18", "local_source": "2026-10.txt"}], "source_checked_at": "2026-10-18", "verification_status": "AI資料照合済・販売用最終採用保留・専門家未監修", "calculation": null}, {"id": "DV-2-010", "subject": "送気、潜降及び浮上", "topic": "潜降・耳抜き", "difficulty": "応用", "type": "判断", "stem": "潜降中に耳の圧迫感を覚えた。適切な基本行動はどれか。", "options": ["潜降を止めて圧平衡を図り、無理に深く進まない", "痛みに耐えて速く潜る", "耳栓で外耳道を閉じる", "空気を節約するため呼吸を止める", "ウエイトを増して沈む"], "answer": 1, "explanation": "耳の圧迫感があればその深度で止まり圧平衡を図る。解消しなければ無理に継続しない。", "option_explanations": ["圧差を増やさないことが重要。", "圧差を増やし傷害を悪化させ得る。", "閉鎖空間を作り圧外傷の危険がある。", "耳の圧平衡にはならない。", "問題の解決にならない。"], "sources": [{"name": "2026年10月公表 潜水士免許試験（傾向・基礎事項確認）", "section": "問14", "url": "https://www.exam.or.jp/wp-content/uploads/2026/10/LC20262119.pdf", "checked_at": "2026-10-18", "local_source": "2026-10.txt"}, {"name": "2026年4月公表 潜水士免許試験（傾向・基礎事項確認）", "section": "問25", "url": "https://www.exam.or.jp/wp-content/uploads/2026/04/LC20260419-1.pdf", "checked_at": "2026-10-18", "local_source": "2026-04.txt"}], "source_checked_at": "2026-10-18", "verification_status": "AI資料照合済・販売用最終採用保留・専門家未監修", "calculation": null}, {"id": "DV-2-011", "subject": "送気、潜降及び浮上", "topic": "BCと浮上", "difficulty": "標準", "type": "理解", "stem": "BC内の気体を適切に排出せず浮上すると、速度がさらに増し得る主な理由はどれか。", "options": ["重力が水面で消えるため", "残圧計が浮力を作るため", "周囲圧力の低下で気体が膨張するため", "気体が圧縮されて重くなるため", "海水が空気に変わるため"], "answer": 3, "explanation": "浮上では気体が膨張し、浮力増加が浮上を加速する。器材に応じた排気と浮上管理が必要。", "option_explanations": ["重力は消えない。", "計器は浮力調節装置ではない。", "膨張で浮力が増える。", "浮上時の変化が逆。", "物質の変換ではない。"], "sources": [{"name": "2026年10月公表 潜水士免許試験（傾向・基礎事項確認）", "section": "問15", "url": "https://www.exam.or.jp/wp-content/uploads/2026/10/LC20262119.pdf", "checked_at": "2026-10-18", "local_source": "2026-10.txt"}, {"name": "2026年10月公表 潜水士免許試験（傾向・基礎事項確認）", "section": "問2", "url": "https://www.exam.or.jp/wp-content/uploads/2026/10/LC20262119.pdf", "checked_at": "2026-10-18", "local_source": "2026-10.txt"}], "source_checked_at": "2026-10-18", "verification_status": "AI資料照合済・販売用最終採用保留・専門家未監修", "calculation": null}, {"id": "DV-2-012", "subject": "送気、潜降及び浮上", "topic": "浮上速度と安全停止", "difficulty": "標準", "type": "理解", "stem": "通常の浮上で、速度管理と減圧のための浮上停止との関係として正しいものはどれか。", "options": ["速度が遅ければどんな潜水でも停止不要", "停止時間を守れば浮上速度は自由", "安全停止は実潜水履歴の代わりになる", "無症状ならすべての停止を省ける", "速度上限を守っても必要な浮上停止は省略できない"], "answer": 5, "explanation": "通常浮上は毎分10 m以下で行い、必要な浮上停止も確保する。単にゆっくり上がるだけで全条件を満たすとは限らない。", "option_explanations": ["深度・時間履歴による停止を無視できない。", "両方の管理が必要。", "実履歴による減圧判断が必要。", "無症状は省略の根拠にならない。", "速度制限と減圧停止は別の要件。"], "sources": [{"name": "高気圧作業安全衛生規則（2026年4月1日施行版）", "section": "第18条第1項・第27条", "url": "https://laws.e-gov.go.jp/law/347M50002000040/20260401_508M60000100003", "checked_at": "2026-10-18", "local_source": "law-compact.txt"}], "source_checked_at": "2026-10-18", "verification_status": "AI資料照合済・販売用最終採用保留・専門家未監修", "calculation": null}, {"id": "DV-2-013", "subject": "送気、潜降及び浮上", "topic": "半飽和時間", "difficulty": "標準", "type": "理解", "stem": "一定の呼吸ガス分圧に切り替えた後の半飽和時間の定義として正しいものはどれか。", "options": ["水面休息の法定最短時間", "組織分圧と平衡値との差が半分になる時間", "完全飽和までの時間の半分", "潜水時間の半分", "浮上速度を半分にする時間"], "answer": 2, "explanation": "半飽和時間は平衡値との差が1/2になる時間。飽和完了に必要な有限時間の半分を意味しない。", "option_explanations": ["休息時間の法定定義ではない。", "残る差が指数的に小さくなる。", "完全飽和時間の半分という定義ではない。", "組織のモデル特性と潜水時間は別。", "圧力変化速度の指標ではない。"], "sources": [{"name": "2026年4月公表 潜水士免許試験（傾向・基礎事項確認）", "section": "問16", "url": "https://www.exam.or.jp/wp-content/uploads/2026/04/LC20260419-1.pdf", "checked_at": "2026-10-18", "local_source": "2026-04.txt"}], "source_checked_at": "2026-10-18", "verification_status": "AI資料照合済・販売用最終採用保留・専門家未監修", "calculation": null}, {"id": "DV-2-014", "subject": "送気、潜降及び浮上", "topic": "半飽和時間", "difficulty": "標準", "type": "計算", "stem": "一定条件で半飽和時間が10分のモデル組織を考える。開始時から平衡値までの差のうち、20分後にも残る割合はどれか。", "options": ["75％", "0％", "100％", "25％", "50％"], "answer": 4, "explanation": "20/10＝2半飽和時間。残る差は0.5²＝0.25、すなわち25％。", "option_explanations": ["平衡に近づいた割合と残差を取り違えている。", "有限の2回で残差はゼロにならない。", "半減を反映していない。", "半減が2回なので(1/2)²。", "1回の半減のみを数えている。"], "sources": [{"name": "2026年4月公表 潜水士免許試験（傾向・基礎事項確認）", "section": "問16", "url": "https://www.exam.or.jp/wp-content/uploads/2026/04/LC20260419-1.pdf", "checked_at": "2026-10-18", "local_source": "2026-04.txt"}], "source_checked_at": "2026-10-18", "verification_status": "AI資料照合済・販売用最終採用保留・専門家未監修", "calculation": {"expression": "100*0.5**(20/10)", "expected": 25, "unit": "％"}}, {"id": "DV-2-015", "subject": "送気、潜降及び浮上", "topic": "減圧モデルとM値", "difficulty": "標準", "type": "理解", "stem": "ZH-L16モデルの16の半飽和組織について正しい説明はどれか。", "options": ["理論的な区分であり実在の16臓器と一対一ではない", "16個の骨を表す", "すべて同じ半飽和時間である", "潜水者16人分の平均である", "呼吸ガスを16種類に分ける"], "answer": 1, "explanation": "モデル組織は特定の臓器そのものではなく、異なる半飽和時間をもつ理論的な区分。", "option_explanations": ["ガス動態を表すモデル上の区分。", "骨の個数ではない。", "異なる時間特性を使う。", "人数の区分ではない。", "組織側のモデル区分。"], "sources": [{"name": "2026年4月公表 潜水士免許試験（傾向・基礎事項確認）", "section": "問16", "url": "https://www.exam.or.jp/wp-content/uploads/2026/04/LC20260419-1.pdf", "checked_at": "2026-10-18", "local_source": "2026-04.txt"}, {"name": "2026年10月公表 潜水士免許試験（傾向・基礎事項確認）", "section": "問16", "url": "https://www.exam.or.jp/wp-content/uploads/2026/10/LC20262119.pdf", "checked_at": "2026-10-18", "local_source": "2026-10.txt"}], "source_checked_at": "2026-10-18", "verification_status": "AI資料照合済・販売用最終採用保留・専門家未監修", "calculation": null}, {"id": "DV-2-016", "subject": "送気、潜降及び浮上", "topic": "減圧モデルとM値", "difficulty": "応用", "type": "判断", "stem": "計算上、次の浅い停止深度である半飽和組織の不活性ガス分圧がM値を上回る。減圧計画上の方向として適切なのはどれか。", "options": ["すべての組織の計算を省く", "水面休息を必ずゼロにする", "直前の停止深度での停止時間を増すなど再計算する", "許容値を超えたまま進める", "M値を酸素濃度とみなす"], "answer": 3, "explanation": "M値は各環境圧力で組織が許容できる最大不活性ガス分圧。すべての組織で条件を満たすよう計画する。", "option_explanations": ["一つでも条件を外れることを無視できない。", "減圧負荷を減らす方策ではない。", "許容値以下に収める必要がある。", "モデルの条件を満たさない。", "M値は許容される不活性ガス分圧。"], "sources": [{"name": "2026年10月公表 潜水士免許試験（傾向・基礎事項確認）", "section": "問16", "url": "https://www.exam.or.jp/wp-content/uploads/2026/10/LC20262119.pdf", "checked_at": "2026-10-18", "local_source": "2026-10.txt"}], "source_checked_at": "2026-10-18", "verification_status": "AI資料照合済・販売用最終採用保留・専門家未監修", "calculation": null}, {"id": "DV-2-017", "subject": "送気、潜降及び浮上", "topic": "繰返し潜水", "difficulty": "標準", "type": "理解", "stem": "水面休息が短い繰返し潜水を計画する際に必要な考え方はどれか。", "options": ["浮上した瞬間に全窒素が排出される", "次回の減圧時間は必ず短くなる", "時計をリセットすれば生理状態も戻る", "疲労がなければ計算不要", "前の潜水による残留不活性ガスを考慮する"], "answer": 5, "explanation": "短い水面休息では前回の不活性ガスが残り得る。繰返し潜水は履歴を含めた減圧評価が必要。", "option_explanations": ["組織からの排出には時間がかかる。", "残留ガスにより負荷が増え得る。", "計時操作では体内ガスは変化しない。", "主観的疲労と体内ガス量は別。", "次の潜水を初回と同じ状態とは扱えない。"], "sources": [{"name": "2026年10月公表 潜水士免許試験（傾向・基礎事項確認）", "section": "問16", "url": "https://www.exam.or.jp/wp-content/uploads/2026/10/LC20262119.pdf", "checked_at": "2026-10-18", "local_source": "2026-10.txt"}], "source_checked_at": "2026-10-18", "verification_status": "AI資料照合済・販売用最終採用保留・専門家未監修", "calculation": null}, {"id": "DV-2-018", "subject": "送気、潜降及び浮上", "topic": "ヘルメット式潜水器", "difficulty": "基本", "type": "知識", "stem": "ヘルメットの送気ホース取付口にある逆止弁の主な目的はどれか。", "options": ["足ヒレの推進力を増す", "供給空気の逆流を防ぐ", "ヘルメットの色を変える", "潜水者の深度を記録する", "唾を排出する"], "answer": 2, "explanation": "逆止弁は送気された圧縮空気の逆流を防ぐ。排気弁やドレーンコックと役割を区別する。", "option_explanations": ["推進装置ではない。", "供給側の異常時などの逆流を抑える。", "弁の機能ではない。", "記録装置ではない。", "ドレーンコックの機能。"], "sources": [{"name": "2026年4月公表 潜水士免許試験（傾向・基礎事項確認）", "section": "問17", "url": "https://www.exam.or.jp/wp-content/uploads/2026/04/LC20260419-1.pdf", "checked_at": "2026-10-18", "local_source": "2026-04.txt"}, {"name": "2026年10月公表 潜水士免許試験（傾向・基礎事項確認）", "section": "問17", "url": "https://www.exam.or.jp/wp-content/uploads/2026/10/LC20262119.pdf", "checked_at": "2026-10-18", "local_source": "2026-10.txt"}], "source_checked_at": "2026-10-18", "verification_status": "AI資料照合済・販売用最終採用保留・専門家未監修", "calculation": null}, {"id": "DV-2-019", "subject": "送気、潜降及び浮上", "topic": "ヘルメット式潜水器", "difficulty": "標準", "type": "理解", "stem": "ヘルメット式潜水器の腰バルブに関する説明で適切なのはどれか。", "options": ["肺の酸素分圧を直接測る", "ヘルメットから唾を出す専用弁である", "時刻を測る", "潜水者側で送気を調節するために扱う", "吸気のたびに自動調整するデマンド弁そのものである"], "answer": 4, "explanation": "腰バルブの送気調節と、デマンド式レギュレーターの応需送気を混同しない。", "option_explanations": ["ガス分析器ではない。", "ドレーンコックと混同。", "水中時計と混同。", "呼吸に応じた自動デマンド機構という説明は誤り。", "公表問題でも否定されている。"], "sources": [{"name": "2026年4月公表 潜水士免許試験（傾向・基礎事項確認）", "section": "問17", "url": "https://www.exam.or.jp/wp-content/uploads/2026/04/LC20260419-1.pdf", "checked_at": "2026-10-18", "local_source": "2026-04.txt"}, {"name": "2026年10月公表 潜水士免許試験（傾向・基礎事項確認）", "section": "問17", "url": "https://www.exam.or.jp/wp-content/uploads/2026/10/LC20262119.pdf", "checked_at": "2026-10-18", "local_source": "2026-10.txt"}], "source_checked_at": "2026-10-18", "verification_status": "AI資料照合済・販売用最終採用保留・専門家未監修", "calculation": null}, {"id": "DV-2-020", "subject": "送気、潜降及び浮上", "topic": "スクーバの圧力調整器", "difficulty": "標準", "type": "理解", "stem": "一般的な二段式スクーバレギュレーターの機能分担はどれか。", "options": ["第一段で中圧へ、第二段で周囲圧に応じた呼吸ガスへ調整する", "第一段が酸素を生成する", "第二段が窒素を完全除去する", "両段ともボンベ最高圧をそのまま口へ送る", "第一段は時計で第二段は深度計である"], "answer": 1, "explanation": "ボンベ内の高圧から第一段で中圧へ、第二段で潜水深度に対応した呼吸圧へ減圧する。", "option_explanations": ["二段で圧力を下げる。", "圧力調整器に酸素生成機能はない。", "ガス分離器ではない。", "高圧をそのまま呼吸させない。", "計器の説明ではない。"], "sources": [{"name": "2026年4月公表 潜水士免許試験（傾向・基礎事項確認）", "section": "問18", "url": "https://www.exam.or.jp/wp-content/uploads/2026/04/LC20260419-1.pdf", "checked_at": "2026-10-18", "local_source": "2026-04.txt"}, {"name": "2026年10月公表 潜水士免許試験（傾向・基礎事項確認）", "section": "問18", "url": "https://www.exam.or.jp/wp-content/uploads/2026/10/LC20262119.pdf", "checked_at": "2026-10-18", "local_source": "2026-10.txt"}], "source_checked_at": "2026-10-18", "verification_status": "AI資料照合済・販売用最終採用保留・専門家未監修", "calculation": null}, {"id": "DV-2-021", "subject": "送気、潜降及び浮上", "topic": "ボンベと残圧計", "difficulty": "応用", "type": "判断", "stem": "高圧がかかる残圧計の表示を確認する姿勢として適切なのはどれか。", "options": ["計器を外して顔で漏れを確認する", "給気量と無関係なので確認しない", "顔を近づけず斜めから確認する", "表示面へ目を密着させる", "指針が見えなくても推測だけで使う"], "answer": 3, "explanation": "残圧計内部には高圧がかかるため、顔を近づけず斜めから確認する。", "option_explanations": ["危険な確認行為。", "残圧はガス量管理に重要。", "高圧計器の破損に備える。", "高圧部破損時の危険が増す。", "実残量の確認が必要。"], "sources": [{"name": "2026年10月公表 潜水士免許試験（傾向・基礎事項確認）", "section": "問18", "url": "https://www.exam.or.jp/wp-content/uploads/2026/10/LC20262119.pdf", "checked_at": "2026-10-18", "local_source": "2026-10.txt"}], "source_checked_at": "2026-10-18", "verification_status": "AI資料照合済・販売用最終採用保留・専門家未監修", "calculation": null}, {"id": "DV-2-022", "subject": "送気、潜降及び浮上", "topic": "ボンベと残圧計", "difficulty": "応用", "type": "判断", "stem": "使用後のスクーバボンベを保管する考え方として適切なのはどれか。", "options": ["毎回完全に空にして開放する", "塩分はそのままにする", "傷があっても外観を塗れば十分", "容器の定格に関係なく加圧する", "洗浄・損傷確認を行い、内部の空気を少量残す"], "answer": 5, "explanation": "終業後は水洗いと傷・錆などの確認を行い、内部を完全に空にせず保管する。修理・充塡は適切な設備と有資格の体制で行う。", "option_explanations": ["内部への水分侵入を招く。", "腐食対策として不適切。", "損傷評価や必要措置が必要。", "定格や検査条件の遵守が必要。", "水分侵入や腐食を防ぐため完全に空にしない。"], "sources": [{"name": "2026年4月公表 潜水士免許試験（傾向・基礎事項確認）", "section": "問18", "url": "https://www.exam.or.jp/wp-content/uploads/2026/04/LC20260419-1.pdf", "checked_at": "2026-10-18", "local_source": "2026-04.txt"}], "source_checked_at": "2026-10-18", "verification_status": "AI資料照合済・販売用最終採用保留・専門家未監修", "calculation": null}, {"id": "DV-2-023", "subject": "送気、潜降及び浮上", "topic": "全面マスク式潜水器", "difficulty": "標準", "type": "理解", "stem": "全面マスク式の応需送気とヘルメット式の連続送気を比べた説明として適切なのはどれか。", "options": ["両者の送気方式と流量は常に同一", "全面マスク式は通常ヘルメット式より必要送気量が少ない", "全面マスク式では呼吸ガスが不要", "全面マスク式は必ず純酸素のみを使う", "全面マスク式では予備ボンベを携行できない"], "answer": 2, "explanation": "全面マスク式は応需送気が使われ、一般にヘルメット式より少ない送気量で潜水できる。", "option_explanations": ["機構と必要量が異なる。", "応需送気により少ない流量で使用できる。", "呼吸ガスは必要。", "純酸素限定の方式ではない。", "携行する場合がある。"], "sources": [{"name": "2026年4月公表 潜水士免許試験（傾向・基礎事項確認）", "section": "問19", "url": "https://www.exam.or.jp/wp-content/uploads/2026/04/LC20260419-1.pdf", "checked_at": "2026-10-18", "local_source": "2026-04.txt"}, {"name": "2026年10月公表 潜水士免許試験（傾向・基礎事項確認）", "section": "問19", "url": "https://www.exam.or.jp/wp-content/uploads/2026/10/LC20262119.pdf", "checked_at": "2026-10-18", "local_source": "2026-10.txt"}], "source_checked_at": "2026-10-18", "verification_status": "AI資料照合済・販売用最終採用保留・専門家未監修", "calculation": null}, {"id": "DV-2-024", "subject": "送気、潜降及び浮上", "topic": "全面マスク式潜水器", "difficulty": "基本", "type": "知識", "stem": "全面マスク式潜水器の水中電話で、骨伝導式イヤホンの一般的な固定位置はどれか。", "options": ["足首", "ボンベ内部", "ホース内壁", "耳の後ろ付近", "外耳道を密閉する奥深い位置"], "answer": 4, "explanation": "骨伝導式イヤホンは耳の後ろ付近にストラップなどで固定する。外耳道を密閉する耳栓との混同を避ける。", "option_explanations": ["一般的固定位置ではない。", "潜水者が受聴する位置ではない。", "イヤホンの固定部ではない。", "外耳道へ密閉挿入する方式ではない。", "圧平衡を妨げる説明。"], "sources": [{"name": "2026年10月公表 潜水士免許試験（傾向・基礎事項確認）", "section": "問19", "url": "https://www.exam.or.jp/wp-content/uploads/2026/10/LC20262119.pdf", "checked_at": "2026-10-18", "local_source": "2026-10.txt"}], "source_checked_at": "2026-10-18", "verification_status": "AI資料照合済・販売用最終採用保留・専門家未監修", "calculation": null}, {"id": "DV-2-025", "subject": "送気、潜降及び浮上", "topic": "補助装備と保守", "difficulty": "基本", "type": "知識", "stem": "オープンヒルタイプの足ヒレの装着方法はどれか。", "options": ["爪先を入れ、踵をストラップで固定する", "足全体を閉じた靴状部へ入れる", "潜水靴を必ず脱いで手に持つ", "腰バルブへ固定する", "送気管へ挿入する"], "answer": 1, "explanation": "オープンヒルは爪先部分を差し込み踵をストラップで保持する。フルフィットとの名称を区別する。", "option_explanations": ["踵が開いた構造。", "フルフィット型の説明。", "足ヒレ装着方法ではない。", "足に装着する器具。", "装着場所が異なる。"], "sources": [{"name": "2026年4月公表 潜水士免許試験（傾向・基礎事項確認）", "section": "問20", "url": "https://www.exam.or.jp/wp-content/uploads/2026/04/LC20260419-1.pdf", "checked_at": "2026-10-18", "local_source": "2026-04.txt"}, {"name": "2026年10月公表 潜水士免許試験（傾向・基礎事項確認）", "section": "問20", "url": "https://www.exam.or.jp/wp-content/uploads/2026/10/LC20262119.pdf", "checked_at": "2026-10-18", "local_source": "2026-10.txt"}], "source_checked_at": "2026-10-18", "verification_status": "AI資料照合済・販売用最終採用保留・専門家未監修", "calculation": null}, {"id": "DV-2-026", "subject": "送気、潜降及び浮上", "topic": "補助装備と保守", "difficulty": "応用", "type": "判断", "stem": "潜水前の点検で圧力調整器の作動異常が分かった。適切な措置はどれか。", "options": ["詳しくない作業者が高圧部を即席改造する", "予備の時計を持てば解消する", "修理など必要措置を行い危険を解消する", "水中でだけ試す", "点検記録だけ作れば使用してよい"], "answer": 3, "explanation": "潜水前点検で危険や健康障害のおそれがあれば修理その他必要な措置を行う。実物の整備は製造者指定の手順と技能による。", "option_explanations": ["適切な整備手順と技能が必要。", "呼吸器の異常を解消しない。", "異常のまま潜水させない。", "潜水前に危険を認めた状態を放置している。", "記録は修理の代わりではない。"], "sources": [{"name": "高気圧作業安全衛生規則（2026年4月1日施行版）", "section": "第34条第1項", "url": "https://laws.e-gov.go.jp/law/347M50002000040/20260401_508M60000100003", "checked_at": "2026-10-18", "local_source": "law-compact.txt"}], "source_checked_at": "2026-10-18", "verification_status": "AI資料照合済・販売用最終採用保留・専門家未監修", "calculation": null}, {"id": "DV-3-001", "subject": "高気圧障害", "topic": "呼吸と肺", "difficulty": "標準", "type": "理解", "stem": "吸気時に空気が肺へ流れ込む主な仕組みはどれか。", "options": ["肺胞が自力でポンプのように収縮する", "肺静脈が空気を直接送り込む", "食道を通じて肺へ入る", "胸郭内容積が減ることで吸い込む", "呼吸筋の働きで胸郭が広がり肺内圧が下がる"], "answer": 5, "explanation": "肺は呼吸筋による胸郭の拡張に伴って膨らむ。肺胞そのものの能動的な筋運動で吸気を起こすわけではない。", "option_explanations": ["胸郭と呼吸筋の働きが基本。", "血管は気道ではない。", "通常の吸気経路ではない。", "通常は呼気側の変化。", "圧力差で気流が生じる。"], "sources": [{"name": "2026年4月公表 潜水士免許試験（傾向・基礎事項確認）", "section": "問21", "url": "https://www.exam.or.jp/wp-content/uploads/2026/04/LC20260419-1.pdf", "checked_at": "2026-10-18", "local_source": "2026-04.txt"}, {"name": "2026年10月公表 潜水士免許試験（傾向・基礎事項確認）", "section": "問21", "url": "https://www.exam.or.jp/wp-content/uploads/2026/10/LC20262119.pdf", "checked_at": "2026-10-18", "local_source": "2026-10.txt"}], "source_checked_at": "2026-10-18", "verification_status": "AI資料照合済・販売用最終採用保留・専門家未監修", "calculation": null}, {"id": "DV-3-002", "subject": "高気圧障害", "topic": "呼吸と肺", "difficulty": "基本", "type": "知識", "stem": "肺胞の気体と毛細血管中の血液との間のガス交換を何というか。", "options": ["潜水墜落", "外呼吸", "体循環", "耳抜き", "骨壊死"], "answer": 2, "explanation": "肺胞と血液の間の酸素・二酸化炭素交換は外呼吸。組織側でのガス交換と区別する。", "option_explanations": ["潜水中の浮力異常。", "肺でのガス交換。", "全身をめぐる血流の経路。", "中耳の圧平衡。", "骨組織の障害。"], "sources": [{"name": "2026年4月公表 潜水士免許試験（傾向・基礎事項確認）", "section": "問21", "url": "https://www.exam.or.jp/wp-content/uploads/2026/04/LC20260419-1.pdf", "checked_at": "2026-10-18", "local_source": "2026-04.txt"}], "source_checked_at": "2026-10-18", "verification_status": "AI資料照合済・販売用最終採用保留・専門家未監修", "calculation": null}, {"id": "DV-3-003", "subject": "高気圧障害", "topic": "血液循環", "difficulty": "基本", "type": "知識", "stem": "右心室から肺へ血液を運ぶ血管はどれか。", "options": ["大静脈", "大動脈", "冠静脈だけ", "肺動脈", "肺静脈"], "answer": 4, "explanation": "右心室→肺動脈→肺→肺静脈→左心房が肺循環。動脈・静脈の名称は心臓から出るか戻るかで区別する。", "option_explanations": ["全身から右心房へ戻る。", "左心室から全身へ送る。", "心筋から戻る経路で肺への主経路ではない。", "心臓から肺へ出る血管。", "肺から左心房へ戻る。"], "sources": [{"name": "2026年4月公表 潜水士免許試験（傾向・基礎事項確認）", "section": "問22", "url": "https://www.exam.or.jp/wp-content/uploads/2026/04/LC20260419-1.pdf", "checked_at": "2026-10-18", "local_source": "2026-04.txt"}, {"name": "2026年10月公表 潜水士免許試験（傾向・基礎事項確認）", "section": "問22", "url": "https://www.exam.or.jp/wp-content/uploads/2026/10/LC20262119.pdf", "checked_at": "2026-10-18", "local_source": "2026-10.txt"}], "source_checked_at": "2026-10-18", "verification_status": "AI資料照合済・販売用最終採用保留・専門家未監修", "calculation": null}, {"id": "DV-3-004", "subject": "高気圧障害", "topic": "血液循環", "difficulty": "標準", "type": "理解", "stem": "体循環で全身へ血液を送り出す心臓の部屋はどれか。", "options": ["左心室", "右心室", "右心房", "左心房", "胸膜腔"], "answer": 1, "explanation": "左心室が全身への体循環を駆動する。右心室は肺循環を担う。", "option_explanations": ["大動脈へ駆出する。", "肺動脈へ駆出する。", "全身から戻る血液を受ける。", "肺から戻る血液を受ける。", "心臓の部屋ではない。"], "sources": [{"name": "2026年10月公表 潜水士免許試験（傾向・基礎事項確認）", "section": "問22", "url": "https://www.exam.or.jp/wp-content/uploads/2026/10/LC20262119.pdf", "checked_at": "2026-10-18", "local_source": "2026-10.txt"}], "source_checked_at": "2026-10-18", "verification_status": "AI資料照合済・販売用最終採用保留・専門家未監修", "calculation": null}, {"id": "DV-3-005", "subject": "高気圧障害", "topic": "神経系", "difficulty": "基本", "type": "知識", "stem": "中枢神経系に属する組合せはどれか。", "options": ["胃と小腸", "鼓膜と耳管だけ", "脳と脊髄", "大動脈と大静脈", "肺胞と気管支"], "answer": 3, "explanation": "神経系は中枢神経系と末梢神経系に分かれ、中枢は脳と脊髄からなる。", "option_explanations": ["消化器である。", "中枢神経系の構成ではない。", "中枢神経系の構成。", "血管である。", "呼吸器である。"], "sources": [{"name": "2026年4月公表 潜水士免許試験（傾向・基礎事項確認）", "section": "問23", "url": "https://www.exam.or.jp/wp-content/uploads/2026/04/LC20260419-1.pdf", "checked_at": "2026-10-18", "local_source": "2026-04.txt"}], "source_checked_at": "2026-10-18", "verification_status": "AI資料照合済・販売用最終採用保留・専門家未監修", "calculation": null}, {"id": "DV-3-006", "subject": "高気圧障害", "topic": "神経系", "difficulty": "標準", "type": "理解", "stem": "小脳の障害で起こり得る変化として適切なのはどれか。", "options": ["酸素を作れなくなる", "血液が肺静脈を逆流することだけ", "肺胞がなくなる", "骨の密度が必ず直ちに倍増する", "運動や平衡の調整が乱れる"], "answer": 5, "explanation": "小脳は運動・平衡を調整し、障害時には運動失調が起こり得る。", "option_explanations": ["小脳は酸素生成器官ではない。", "小脳の主な機能障害の説明ではない。", "解剖学的な関連が違う。", "そのような機能ではない。", "小脳は随意運動や平衡の調整に関与する。"], "sources": [{"name": "2026年10月公表 潜水士免許試験（傾向・基礎事項確認）", "section": "問23", "url": "https://www.exam.or.jp/wp-content/uploads/2026/10/LC20262119.pdf", "checked_at": "2026-10-18", "local_source": "2026-10.txt"}], "source_checked_at": "2026-10-18", "verification_status": "AI資料照合済・販売用最終採用保留・専門家未監修", "calculation": null}, {"id": "DV-3-007", "subject": "高気圧障害", "topic": "体温と低体温症", "difficulty": "標準", "type": "理解", "stem": "同じ温度の空気中より水中で身体が冷えやすい理由として適切なのはどれか。", "options": ["圧力が高いと熱移動はなくなる", "水は空気より熱を伝えやすい", "水中では代謝が完全に止まる", "水は断熱材としてしか働かない", "体温は外部条件に無関係"], "answer": 2, "explanation": "水の熱伝導率は空気より大きい。水温、滞在時間、保温装備などで冷却の程度が変わる。", "option_explanations": ["熱移動は存在する。", "熱放散が大きくなる。", "代謝は継続する。", "水は空気より熱伝導率が大きい。", "産熱と放熱の収支が影響する。"], "sources": [{"name": "2026年4月公表 潜水士免許試験（傾向・基礎事項確認）", "section": "問24", "url": "https://www.exam.or.jp/wp-content/uploads/2026/04/LC20260419-1.pdf", "checked_at": "2026-10-18", "local_source": "2026-04.txt"}, {"name": "2026年10月公表 潜水士免許試験（傾向・基礎事項確認）", "section": "問24", "url": "https://www.exam.or.jp/wp-content/uploads/2026/10/LC20262119.pdf", "checked_at": "2026-10-18", "local_source": "2026-10.txt"}], "source_checked_at": "2026-10-18", "verification_status": "AI資料照合済・販売用最終採用保留・専門家未監修", "calculation": null}, {"id": "DV-3-008", "subject": "高気圧障害", "topic": "体温と低体温症", "difficulty": "応用", "type": "判断", "stem": "冷水潜水後の人に震えと意識の混濁が見られる。適切な評価はどれか。", "options": ["必ず窒素酔いだけである", "本人に走らせれば必ず治る", "意識が混濁していても入浴だけで十分", "低体温症を疑い救急対応につなげる", "震えがある限り放置してよい"], "answer": 4, "explanation": "低体温症は意識障害や死亡に至り得る。保温と救急要請を行い、重症疑いで急激な入浴をさせるなどの自己判断は避ける。", "option_explanations": ["冷却による障害も評価する。", "重症疑いで運動を強制しない。", "医療対応を遅らせない。", "重症化し得る兆候である。", "意識変化は危険な徴候。"], "sources": [{"name": "2026年10月公表 潜水士免許試験（傾向・基礎事項確認）", "section": "問24", "url": "https://www.exam.or.jp/wp-content/uploads/2026/10/LC20262119.pdf", "checked_at": "2026-10-18", "local_source": "2026-10.txt"}], "source_checked_at": "2026-10-18", "verification_status": "AI資料照合済・販売用最終採用保留・専門家未監修", "calculation": null}, {"id": "DV-3-009", "subject": "高気圧障害", "topic": "圧外傷", "difficulty": "標準", "type": "理解", "stem": "潜降に伴う閉鎖された空気腔の変化として正しいものはどれか。", "options": ["外圧が増し、空気が圧縮される", "外圧が下がり、空気が膨張する", "外圧はどの深度でも同じ", "気体量が必ず増え続ける", "すべての体腔が自動的に完全平衡する"], "answer": 1, "explanation": "潜降時のスクィーズは外圧増加に対し体腔内圧を平衡できないことなどで起こる。", "option_explanations": ["圧平衡できなければ組織損傷につながる。", "浮上時の変化。", "深度に応じて増す。", "密閉なら気体量は変わらない。", "耳や副鼻腔などでは平衡できないことがある。"], "sources": [{"name": "2026年4月公表 潜水士免許試験（傾向・基礎事項確認）", "section": "問25", "url": "https://www.exam.or.jp/wp-content/uploads/2026/04/LC20260419-1.pdf", "checked_at": "2026-10-18", "local_source": "2026-04.txt"}, {"name": "2026年10月公表 潜水士免許試験（傾向・基礎事項確認）", "section": "問25", "url": "https://www.exam.or.jp/wp-content/uploads/2026/10/LC20262119.pdf", "checked_at": "2026-10-18", "local_source": "2026-10.txt"}], "source_checked_at": "2026-10-18", "verification_status": "AI資料照合済・販売用最終採用保留・専門家未監修", "calculation": null}, {"id": "DV-3-010", "subject": "高気圧障害", "topic": "圧外傷", "difficulty": "応用", "type": "判断", "stem": "浅い場所で呼吸装置を用いて潜水した人が、息を止めて浮上しようとしている。適切な評価はどれか。", "options": ["ボンベの色だけで危険性が決まる", "浮上時は肺内気体が圧縮される", "浅い深度からでも肺過膨張の危険がある", "2 m程度なら圧力は変化しない", "息止めは肺過膨張の予防になる"], "answer": 3, "explanation": "呼吸装置で周囲圧のガスを吸った後の息止め浮上は肺過膨張を起こし得る。浅い潜水でも例外ではない。", "option_explanations": ["深度と呼吸管理が重要。", "浮上時には膨張する。", "浅いから安全とはいえない。", "浅くても圧力は変化する。", "膨張ガスを排出できず危険。"], "sources": [{"name": "2026年4月公表 潜水士免許試験（傾向・基礎事項確認）", "section": "問25・問26", "url": "https://www.exam.or.jp/wp-content/uploads/2026/04/LC20260419-1.pdf", "checked_at": "2026-10-18", "local_source": "2026-04.txt"}, {"name": "2026年10月公表 潜水士免許試験（傾向・基礎事項確認）", "section": "問21", "url": "https://www.exam.or.jp/wp-content/uploads/2026/10/LC20262119.pdf", "checked_at": "2026-10-18", "local_source": "2026-10.txt"}], "source_checked_at": "2026-10-18", "verification_status": "AI資料照合済・販売用最終採用保留・専門家未監修", "calculation": null}, {"id": "DV-3-011", "subject": "高気圧障害", "topic": "耳・副鼻腔の障害", "difficulty": "基本", "type": "知識", "stem": "潜降中の中耳の圧外傷の主な原因はどれか。", "options": ["大動脈と肺動脈の圧力差だけ", "骨のカルシウム量だけ", "水中時計の磁力", "酸素の色", "外耳道側と中耳腔側の圧力差"], "answer": 5, "explanation": "耳管を介した中耳の圧平衡が不十分だと、鼓膜を隔てた圧力差で痛みや損傷が起こる。", "option_explanations": ["中耳障害の直接の説明ではない。", "急性の圧外傷の原因ではない。", "圧外傷の原因ではない。", "酸素は無色で圧差の説明にならない。", "鼓膜の両側の圧差が生じる。"], "sources": [{"name": "2026年10月公表 潜水士免許試験（傾向・基礎事項確認）", "section": "問26", "url": "https://www.exam.or.jp/wp-content/uploads/2026/10/LC20262119.pdf", "checked_at": "2026-10-18", "local_source": "2026-10.txt"}], "source_checked_at": "2026-10-18", "verification_status": "AI資料照合済・販売用最終採用保留・専門家未監修", "calculation": null}, {"id": "DV-3-012", "subject": "高気圧障害", "topic": "耳・副鼻腔の障害", "difficulty": "標準", "type": "理解", "stem": "副鼻腔の圧外傷でみられ得る症状はどれか。", "options": ["肺活量が必ず瞬時に倍増", "額や目・鼻の根部の痛み、鼻出血", "ボンベ圧力の上昇", "空気槽の排水増加", "足ヒレの変色"], "answer": 2, "explanation": "副鼻腔は鼻腔と通じるが、閉塞すると圧差による痛みや鼻出血などを生じ得る。中耳の耳抜きとの混同を避ける。", "option_explanations": ["そのような症状ではない。", "副鼻腔障害に合う。", "器材の変化で人体症状ではない。", "器材の現象。", "人体症状ではない。"], "sources": [{"name": "2026年10月公表 潜水士免許試験（傾向・基礎事項確認）", "section": "問26", "url": "https://www.exam.or.jp/wp-content/uploads/2026/10/LC20262119.pdf", "checked_at": "2026-10-18", "local_source": "2026-10.txt"}], "source_checked_at": "2026-10-18", "verification_status": "AI資料照合済・販売用最終採用保留・専門家未監修", "calculation": null}, {"id": "DV-3-013", "subject": "高気圧障害", "topic": "動脈ガス塞栓症", "difficulty": "標準", "type": "理解", "stem": "急浮上時の肺過膨張に続く動脈ガス塞栓症の仕組みとして適切なのはどれか。", "options": ["必ず鼓膜だけが障害される", "気体が血液に入ることはない", "全例が24時間後だけに発症する", "血管に入ったガスが動脈系を閉塞する", "酸素が骨だけに沈着する"], "answer": 4, "explanation": "肺過膨張でガスが血管内に侵入し、動脈系の血流を妨げる。浮上後の意識障害などは緊急対応を要する。", "option_explanations": ["全身、特に脳などへの影響がある。", "侵入したガスによる障害である。", "一般に浮上直後などに重篤な症状を示し得る。", "脳などで重篤な障害を起こし得る。", "ガス塞栓の病理ではない。"], "sources": [{"name": "2026年4月公表 潜水士免許試験（傾向・基礎事項確認）", "section": "問26", "url": "https://www.exam.or.jp/wp-content/uploads/2026/04/LC20260419-1.pdf", "checked_at": "2026-10-18", "local_source": "2026-04.txt"}], "source_checked_at": "2026-10-18", "verification_status": "AI資料照合済・販売用最終採用保留・専門家未監修", "calculation": null}, {"id": "DV-3-014", "subject": "高気圧障害", "topic": "二酸化炭素・一酸化炭素", "difficulty": "標準", "type": "理解", "stem": "一酸化炭素による中毒の説明として適切なのはどれか。", "options": ["ヘモグロビンと結合して酸素運搬を妨げる", "強い臭いで必ず事前に気付く", "通常の水分分離だけで必ず除去できる", "二酸化炭素と同じ物質である", "ヘリウムと同じ不活性ガスで無害"], "answer": 1, "explanation": "COとCO₂を区別する。一酸化炭素は酸素運搬を阻害し、吸気汚染の管理が重要。", "option_explanations": ["一酸化炭素の代表的機序。", "無色無臭なので臭いでは判断できない。", "除去装置の機能が異なる。", "化学的に異なる。", "一酸化炭素は有害。"], "sources": [{"name": "2026年4月公表 潜水士免許試験（傾向・基礎事項確認）", "section": "問3・問27", "url": "https://www.exam.or.jp/wp-content/uploads/2026/04/LC20260419-1.pdf", "checked_at": "2026-10-18", "local_source": "2026-04.txt"}], "source_checked_at": "2026-10-18", "verification_status": "AI資料照合済・販売用最終採用保留・専門家未監修", "calculation": null}, {"id": "DV-3-015", "subject": "高気圧障害", "topic": "二酸化炭素・一酸化炭素", "difficulty": "応用", "type": "判断", "stem": "ガス節約のための呼吸抑制で頭痛などが生じる危険について、適切な説明はどれか。", "options": ["呼吸を止めるほど二酸化炭素排出が増す", "ヘモグロビンとの強い結合だけが機序", "換気不足で二酸化炭素が蓄積し得る", "スクーバなら二酸化炭素中毒は絶対にない", "二酸化炭素は常に無害"], "answer": 3, "explanation": "二酸化炭素中毒は呼吸や換気の不足などで起こり得る。CO中毒の酸素運搬阻害と区別する。", "option_explanations": ["換気低下で排出が妨げられる。", "一酸化炭素の説明との混同。", "意図的な呼吸抑制は危険。", "方式にかかわらず蓄積し得る。", "高濃度では有害。"], "sources": [{"name": "2026年4月公表 潜水士免許試験（傾向・基礎事項確認）", "section": "問27", "url": "https://www.exam.or.jp/wp-content/uploads/2026/04/LC20260419-1.pdf", "checked_at": "2026-10-18", "local_source": "2026-04.txt"}, {"name": "2026年10月公表 潜水士免許試験（傾向・基礎事項確認）", "section": "問14", "url": "https://www.exam.or.jp/wp-content/uploads/2026/10/LC20262119.pdf", "checked_at": "2026-10-18", "local_source": "2026-10.txt"}], "source_checked_at": "2026-10-18", "verification_status": "AI資料照合済・販売用最終採用保留・専門家未監修", "calculation": null}, {"id": "DV-3-016", "subject": "高気圧障害", "topic": "酸素中毒", "difficulty": "標準", "type": "理解", "stem": "酸素が多い呼吸ガスでも安全と一律に判断できない理由はどれか。", "options": ["酸素は常に麻酔用ガスだから", "酸素濃度と圧力は無関係だから", "酸素を含むと呼吸できないから", "純酸素はどの深度でも安全だから", "高い酸素分圧へのばく露で中毒が起こり得る"], "answer": 5, "explanation": "酸素は必要なガスだが、高分圧や長いばく露で中枢神経・肺への毒性がある。", "option_explanations": ["酸素中毒の説明ではない。", "分圧は濃度と絶対圧力の積。", "適切な分圧の酸素は生命維持に必要。", "高分圧では危険になる。", "分圧と時間の管理が必要。"], "sources": [{"name": "2026年4月公表 潜水士免許試験（傾向・基礎事項確認）", "section": "問27", "url": "https://www.exam.or.jp/wp-content/uploads/2026/04/LC20260419-1.pdf", "checked_at": "2026-10-18", "local_source": "2026-04.txt"}, {"name": "2026年10月公表 潜水士免許試験（傾向・基礎事項確認）", "section": "問27", "url": "https://www.exam.or.jp/wp-content/uploads/2026/10/LC20262119.pdf", "checked_at": "2026-10-18", "local_source": "2026-10.txt"}], "source_checked_at": "2026-10-18", "verification_status": "AI資料照合済・販売用最終採用保留・専門家未監修", "calculation": null}, {"id": "DV-3-017", "subject": "高気圧障害", "topic": "酸素中毒", "difficulty": "基本", "type": "知識", "stem": "UPTDが主に評価する対象はどれか。", "options": ["水中での音速", "肺酸素毒性", "ボンベの耐圧", "空気塞栓の数", "耳管の長さ"], "answer": 2, "explanation": "UPTDは肺酸素毒性量単位。動脈ガス塞栓症の危険性を直接表す指標ではない。", "option_explanations": ["音響量ではない。", "肺への酸素ばく露を評価する単位。", "容器検査の単位ではない。", "気泡数の単位ではない。", "解剖寸法ではない。"], "sources": [{"name": "2026年4月公表 潜水士免許試験（傾向・基礎事項確認）", "section": "問29", "url": "https://www.exam.or.jp/wp-content/uploads/2026/04/LC20260419-1.pdf", "checked_at": "2026-10-18", "local_source": "2026-04.txt"}, {"name": "2026年10月公表 潜水士免許試験（傾向・基礎事項確認）", "section": "問27", "url": "https://www.exam.or.jp/wp-content/uploads/2026/10/LC20262119.pdf", "checked_at": "2026-10-18", "local_source": "2026-10.txt"}], "source_checked_at": "2026-10-18", "verification_status": "AI資料照合済・販売用最終採用保留・専門家未監修", "calculation": null}, {"id": "DV-3-018", "subject": "高気圧障害", "topic": "窒素の麻酔作用", "difficulty": "標準", "type": "理解", "stem": "深い空気潜水での窒素に関する適切な説明はどれか。", "options": ["窒素は空気に含まれない", "高圧ほど必ず判断力が増す", "窒素分圧は酸素濃度だけで固定される", "高い分圧で麻酔作用が問題になる", "化学的に安定なので身体に一切作用しない"], "answer": 4, "explanation": "窒素は高圧下で麻酔作用を示すため、呼吸ガス分圧管理が必要。", "option_explanations": ["空気の主成分である。", "安全な方向の作用とは限らない。", "全圧も影響する。", "常温で安定な性質と生理作用は別。", "高圧下の麻酔作用がある。"], "sources": [{"name": "2026年4月公表 潜水士免許試験（傾向・基礎事項確認）", "section": "問3", "url": "https://www.exam.or.jp/wp-content/uploads/2026/04/LC20260419-1.pdf", "checked_at": "2026-10-18", "local_source": "2026-04.txt"}, {"name": "高気圧作業安全衛生規則（2026年4月1日施行版）", "section": "第15条第1項第2号・第27条", "url": "https://laws.e-gov.go.jp/law/347M50002000040/20260401_508M60000100003", "checked_at": "2026-10-18", "local_source": "law-compact.txt"}], "source_checked_at": "2026-10-18", "verification_status": "AI資料照合済・販売用最終採用保留・専門家未監修", "calculation": null}, {"id": "DV-3-019", "subject": "高気圧障害", "topic": "減圧症の病理と症状", "difficulty": "標準", "type": "理解", "stem": "減圧症と関係が深い機序はどれか。", "options": ["減圧に伴う体内不活性ガスの気泡形成", "水が一律に肺へ入ることだけ", "すべての症状が酸素不足だけによる", "気体と無関係な骨折だけ", "皮膚の塩分だけが原因"], "answer": 1, "explanation": "減圧では溶けていた不活性ガスが過飽和となり気泡形成につながる。皮膚・関節だけでなく神経や肺にも障害を起こし得る。", "option_explanations": ["組織・血管などに障害を起こす。", "溺水の説明で減圧症とは別。", "病理を単純化し過ぎている。", "減圧による気泡が問題。", "体内不活性ガスを無視している。"], "sources": [{"name": "2026年10月公表 潜水士免許試験（傾向・基礎事項確認）", "section": "問28", "url": "https://www.exam.or.jp/wp-content/uploads/2026/10/LC20262119.pdf", "checked_at": "2026-10-18", "local_source": "2026-10.txt"}, {"name": "高気圧作業安全衛生規則（2026年4月1日施行版）", "section": "第18条第1項第2号・第27条", "url": "https://laws.e-gov.go.jp/law/347M50002000040/20260401_508M60000100003", "checked_at": "2026-10-18", "local_source": "law-compact.txt"}], "source_checked_at": "2026-10-18", "verification_status": "AI資料照合済・販売用最終採用保留・専門家未監修", "calculation": null}, {"id": "DV-3-020", "subject": "高気圧障害", "topic": "減圧症の病理と症状", "difficulty": "応用", "type": "判断", "stem": "浮上後に関節痛やしびれが出た。適切な受け止め方はどれか。", "options": ["症状を消すため単独で再潜水する", "翌日も潜水すれば自然に治る", "減圧障害などを疑い速やかに医療評価につなぐ", "24時間たつまでは減圧症ではない", "痛みだけなら必ず運動不足"], "answer": 3, "explanation": "減圧症は浮上後早い時期にも発症する。疑い症状は救急連絡・医療評価の対象であり自己治療しない。", "option_explanations": ["自己判断の水中再圧は危険。", "再ばく露で悪化・再発し得る。", "症状の軽重を自己判断して放置しない。", "発症時期の理解が誤り。", "潜水関連障害も考える。"], "sources": [{"name": "2026年10月公表 潜水士免許試験（傾向・基礎事項確認）", "section": "問28", "url": "https://www.exam.or.jp/wp-content/uploads/2026/10/LC20262119.pdf", "checked_at": "2026-10-18", "local_source": "2026-10.txt"}, {"name": "2026年4月公表 潜水士免許試験（傾向・基礎事項確認）", "section": "問29", "url": "https://www.exam.or.jp/wp-content/uploads/20 (function (root) {

// 資格に依存しない採点・検証・保存のしくみ。資格ごとの違いは book（設定）で受け取る。
function make(book) {

      && (t.caption === undefined || typeof t.caption === 'string');
  }

  function safeURL(v) { try { return new URL(v).protocol === 'https:'; } catch { return false; } }

<script>

// ---- ホーム ----

    h('div', { class: 'book-head' },

    h('div', { class: 'card-row' }, h('h2', { class: 'h-card' }, '中断した演習'), h('span', { class: 'tiny' }, s.label + '　' + (s.index + 1) + ' / ' + s.ids.length + '問目')),

}

// ---- 模擬試験の結果 ----
function result() {
  const r = resultView || state.mockResults.at(-1);

  if (!r) { app.append(page(h('p', {}, '模擬試験の記録はありません。'))); return; }

  res.subjects.filter(x => !x.passed).forEach(x => misses.push('「' + x.subject + '」'));

    h('div', { class: 'stack', style: 'gap:6px' },
      h('span', { class: 'small' }, '合計'),

      h('span', { class: 'badge ' + (res.passed ? 'pass' : 'fail') }, res.passed ? '合格基準に到達' : '合格基準に未到達'),

    h('section', { class: 'card', style: 'gap:16px' },
      res.subjects.map(x => h('div', { class: 'stack', style: 'gap:6px' },
        h('div', { class: 'card-row' }, h('b', { style: 'font-size:14px' }, x.subject), h('span', { class: 'small' }, x.correct + '/' + x.total + '問　' + x.points + ' / ' + x.maxPoints + '点')),
        h('div', { class: 'meter', role: 'img', 'aria-label': x.subject + ' 正答率' + pct(x.correct, x.total) + '%' },
          h('i', { style: 'width:' + pct(x.correct, x.total) + '%;background:' + (x.passed ? 'var(--accent)' : 'var(--bad)') }),
          h('u', { style: 'left:' + ex.subjectMinPercent + '%' })),
        h('span', { class: 'tiny ' + (x.passed ? '' : 'bad'), style: x.passed ? '' : 'font-weight:700' }, x.passed ? '基準に到達' : '基準未満（' + ex.subjectMinPercent + '%に届いていません）'))),
      h('span', { class: 'tiny' }, '黒い線は各科目の基準（' + ex.subjectMinPercent + '%）')),
    btn('間違えた問題を復習する', () => goto('#review'), 'primary'),
    h('h2', { class: 'h-sec' }, '全' + r.ids.length + '問の解答'),
    r.ids.map((id, i) => {
      const q = byId.get(id), c = r.answers[id] || 0;
      return h('details', {}, h('summary', {}, (i + 1) + '. ' + q.topic + '　', h('span', { class: c === q.answer ? 'good' : 'bad' }, c === q.answer ? '正解' : c ? '不正解' : '未解答')),
        h('div', { class: 'stack' }, ...stemBlock(q), h('p', { class: 'small' }, 'あなたの解答：' + (c ? c + '　' + q.options[c - 1] : '未解答')), ...explanation(q, c)));
    }));
  app.append(p);
}

// ---- 復習 ----
function review() {
  const list = C.review(qs, state.attempts);
  const p = page(h('h1', { class: 'page-title' }, '間違えた問題の復習'),
    h('p', { class: 'small' }, '最後に解いたときに不正解・未解答だった問題です。今は ' + list.length + '問あります。'));
  if (!list.length) p.append(h('p', { class: 'muted' }, '復習する問題はありません。演習を進めましょう。'));
  else {
    p.append(btn('復習を始める', () => start('practice', C.shuffle(list), '間違えた問題の復習'), 'primary'));
    p.append(h('div', { class: 'list' }, list.map(q => h('div', { class: 'row', style: 'cursor:default' }, h('span', {}, h('b', {}, q.topic), h('span', { class: 'tiny' }, q.subject + '　' + q.id))))));
  }
  app.append(p);
}

// ---- 記録 ----
function progress() {
  const total = state.attempts.length, correct = state.attempts.filter(a => a.correct).length;
  const p = page(h('h1', { class: 'page-title' }, '学習記録'),
    h('section', { class: 'card' },
      h('div', { class: 'card-row' }, h('div', {}, h('div', { class: 'small' }, '正答率'), h('div', { class: 'stat' }, total ? pct(correct, total) + '%' : '—')),
        h('div', {}, h('div', { class: 'small' }, '解答した回数'), h('div', { class: 'stat' }, String(total)))),
      h('p', { class: 'tiny' }, '学習した問題 ' + latestCount() + ' / ' + qs.length + '問。正答率はこれまでのすべての解答から計算します。模擬試験で未解答のまま終えた問題も不正解に含みます。')));
  p.append(h('h2', { class: 'h-sec' }, '苦手な論点（正答率70%未満）'));
  const weak = C.stats(qs, state.attempts).filter(r => r.total && r.rate < 70).sort((a, b) => a.rate - b.rate || b.total - a.total);
  if (!weak.length) p.append(h('p', { class: 'small' }, 'まだありません。解いていない論点も演習してみてください。'));
  else p.append(h('div', { class: 'list' }, weak.map(r => h('button', { type: 'button', class: 'row', onclick: () => start('practice', C.shuffle(qs.filter(q => q.subject === r.subject && q.topic === r.topic)), r.topic) },
    h('span', {}, h('b', {}, r.topic), h('span', { class: 'tiny' }, r.subject + '　' + r.rate + '%（' + r.correct + '/' + r.total + '）')), icon('M6 3l5 5-5 5')))));
  p.append(h('h2', { class: 'h-sec' }, '模擬試験の記録'));
  if (!state.mockResults.length) p.append(h('p', { class: 'small' }, 'まだ受けていません。'));
  else p.append(h('div', { class: 'list' }, [...state.mockResults].reverse().map(r => h('button', { type: 'button', class: 'row', onclick: () => { resultView = r; goto('#result'); } },
    h('span', {}, h('b', {}, r.result.total + '点　' + (r.result.passed ? '到達' : '未到達')), h('span', { class: 'tiny' }, when(r.at))), icon('M6 3l5 5-5 5')))));
  p.append(h('details', {}, h('summary', {}, '最近の解答（新しい順に100件）'),
    h('div', { class: 'stack', style: 'gap:2px' }, state.attempts.slice(-100).reverse().map(a => h('p', { class: 'tiny' }, when(a.at) + '　' + a.id + '　' + (a.choice ? a.choice + 'を選択' : '未解答') + '　' + (a.correct ? '正解' : '不正解'))))));
  const input = h('input', { type: 'file', accept: '.json,application/json', id: 'restore' });
  const backup = h('section', { class: 'card' },
    h('h2', { class: 'h-card' }, '記録のバックアップ'),
    h('p', { class: 'small' }, '記録はこのブラウザーの中だけに保存されます。ブラウザーのデータを消すと記録も消えます。書き出したファイルは、この問題集で元に戻せます。'),
    btn('学習記録をダウンロード', () => download(book.fileName + '-progress.json', state)),
    raw ? btn('開いたときの元データを保存', () => download(book.fileName + '-original-progress.json', raw, true)) : null,
    h('label', { class: 'field', for: 'restore' }, 'バックアップから元に戻す（今の記録と置き換わります）'), input);
  input.onchange = async () => {
    const f = input.files[0]; if (!f) return;
    if (f.size > 20 * 1024 * 1024) { flash('ファイルが大きすぎます。'); return; }
    const parsed = C.parseState(await f.text(), qs);
    if (parsed.warning) { flash('このファイルからは元に戻せません。今の記録は変わっていません。'); return; }
    const area = h('div', { class: 'warnbox' },
      h('p', {}, '元に戻す解答の記録は ' + parsed.state.attempts.length + '件です。先に今の記録をダウンロードしておくと安心です。'),
      btn('今の記録をダウンロード', () => download(book.fileName + '-before-restore.json', state)),
      h('div', { class: 'btns' }, btn('やめる', () => area.remove()), btn('置き換える', () => { state = parsed.state; save(); render(); flash('記録を元に戻しました。'); }, 'primary')));
    backup.append(area);
  };
  p.append(backup);
  app.append(p);
}

// ---- 案内 ----
function about() {
  const p = page(h('h1', { class: 'page-title' }, 'ご案内'),
    h('section', { class: 'card' }, h('h2', { class: 'h-card' }, 'ご購入前にお読みください'),
      h('ul', { class: 'notice-list' }, book.purchaseNotice.filter(n => !n.pending).map(n => h('li', {}, n.text)))),
    h('section', { class: 'card' }, h('h2', { class: 'h-card' }, '資料'),
      h('p', { class: 'small' }, '各問題の根拠は、解説の下に資料名と該当箇所を載せています。'),
      h('ul', { class: 'notice-list' }, book.references.map(r => h('li', {}, extLink(r.name, r.url))))),
    h('section', { class: 'card' }, h('h2', { class: 'h-card' }, '誤りの報告'),
      h('p', { class: 'small' }, '解説の下の「この問題の誤りを報告する」から、報告用のファイルを作れます。' + book.reportGuide)),
    h('section', { class: 'card' }, h('h2', { class: 'h-card' }, '記録の保存'),
      h('p', { class: 'small' }, '学習の記録と模擬試験の途中経過は、このブラウザーの中（localStorage）に保存します。外部へ送ることはありません。プライベートブラウズなどでは保存できないことがあります。')),
    h('section', { class: 'card' }, h('h2', { class: 'h-card' }, 'この版について'),
      h('p', { class: 'small' }, '内容の版 ' + (bank.content_version || '—') + '　／　確認日 ' + (bank.checked_at || '—')),
      h('p', { class: 'small' }, '状態：' + (bank.release_status || '—'))));
  app.append(p);
}

// ---- 表示の切り替え ----
const routes = { '#home': home, '#review': review, '#progress': progress, '#session': session, '#result': result, '#about': about };
const tabFor = { '#session': '#home', '#result': '#progress' };
function render(focus = true) {
  const y = window.scrollY;
  app.replaceChildren();
  const pageKey = routes[location.hash] ? location.hash : '#home';
  const tab = tabFor[pageKey] || pageKey;
  document.querySelectorAll('.tabs a').forEach(a => { if (a.getAttribute('href') === tab) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
  try { routes[pageKey](); }
  catch (e) {
    console.error(e); app.replaceChildren();
    app.append(page(h('h1', { class: 'page-title' }, '表示を続けられません'), h('p', { class: 'small' }, '問題データか保存した記録に問題があります。今の記録を保存してください。'), btn('学習記録を保存', () => download(book.fileName + '-recovery.json', state), 'primary')));
  }
  if (focus && !initial) { app.focus({ preventScroll: true }); window.scrollTo({ top: 0 }); } else if (!focus) window.scrollTo({ top: y });
  initial = false;
}

try {
  document.title = book.title + ' ' + book.kind + '｜' + book.author;
  document.documentElement.style.setProperty('--accent', book.accent);
  // 区切り（／）の途中で改行されないよう、まとまりごとに折り返す
  const sn = document.getElementById('short-notice'), parts = book.shortNotice.split('／');
  parts.forEach((t, i) => sn.append(h('span', { style: 'display:inline-block' }, t + (i < parts.length - 1 ? '／' : ''))));
  bank = C.validateBank(globalThis.QBOOK_BANK); qs = bank.questions; byId = new Map(qs.map(q => [q.id, q]));
  try { raw = localStorage.getItem(KEY) || ''; } catch { flash('記録の保存場所にアクセスできません。「記録」から学習記録をダウンロードしてください。'); }
  const parsed = C.parseState(raw, qs); state = parsed.state; if (parsed.warning) flash(parsed.warning);
  render();
  window.addEventListener('hashchange', () => { selected = null; render(); });
  setInterval(clock, 1000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) clock(); });
} catch (e) {
  app.replaceChildren(page(h('h1', { class: 'page-title' }, '問題データを読み込めません'), h('p', { class: 'small' }, String(e.message))));
}
})();

</script>
</body>
</html>
